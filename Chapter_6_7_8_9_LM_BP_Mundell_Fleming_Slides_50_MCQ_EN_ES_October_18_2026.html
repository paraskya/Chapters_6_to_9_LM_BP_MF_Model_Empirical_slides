rilemma is correct?","options":["With free capital movement and a fixed exchange rate, a country cannot run an independent monetary policy.","With a fixed exchange rate and free capital movement, the central bank can still set any interest rate it wants.","With a flexible exchange rate and perfect capital mobility, monetary policy has no effect on output.","Capital controls make monetary policy fully effective when the exchange rate is fixed.","All of the above."],"steps":["With free capital movement the domestic interest rate cannot stay away from r*.","A fixed exchange rate makes the money supply follow the balance of payments, so the central bank cannot use it: free capital movement, a fixed rate and an independent monetary policy cannot hold together.","With a flexible rate monetary policy is fully effective, so C is false; with a fixed rate, the reserve losses that follow a monetary expansion undo it even with capital controls, so D is false too."]},"es":{"stem":"¿Qué afirmación sobre el trilema de la política económica es correcta?","options":["Con libre movimiento de capitales y tipo de cambio fijo, un país no puede tener una política monetaria independiente.","Con tipo de cambio fijo y libre movimiento de capitales, el banco central puede seguir fijando el tipo de interés que quiera.","Con tipo de cambio flexible y movilidad perfecta del capital, la política monetaria no tiene efecto sobre la producción.","Los controles de capital hacen plenamente eficaz la política monetaria cuando el tipo de cambio es fijo.","Todas las anteriores."],"steps":["Con libre movimiento de capitales el tipo de interés nacional no puede alejarse de r*.","Un tipo de cambio fijo hace que la cantidad de dinero siga a la balanza de pagos, de modo que el banco central no puede usarla: libre movimiento de capitales, tipo fijo y política monetaria independiente no pueden darse a la vez.","Con tipo flexible la política monetaria es plenamente eficaz, de modo que C es falsa; con tipo fijo, las pérdidas de reservas que siguen a una expansión monetaria la deshacen incluso con controles de capital, de modo que D también es falsa."]}},{"id":50,"topic":"mfreg","slides":[62,72],"correct":4,"en":{"stem":"Capital mobility is imperfect and the BP curve is flatter than the LM curve. Under a flexible exchange rate, a fiscal expansion leads to:","options":["A deficit and a depreciation, so the IS curve shifts further to the right and Y rises more.","A surplus and a depreciation, so net exports rise and the IS curve shifts further right.","No change in the exchange rate, because with imperfect mobility the BP curve is not horizontal.","A deficit that the central bank finances with its foreign reserves, so the money supply falls.","A surplus and an appreciation: Y rises, but less than at the IS–LM point."],"steps":["With the BP curve flatter than the LM curve, fb &gt; (m<sub>1<\/sub>/ER<sub>0<\/sub>)h, so ΔBP &gt; 0: the expansion creates a surplus.","Under a flexible exchange rate the surplus appreciates the currency: net exports fall, the IS curve shifts back part of the way and the BP curve shifts up.","Y ends above its initial level but below the IS–LM point; the multiplier is h/[h(1 − c<sub>1<\/sub> − α) + b(d + f)]. Option D describes intervention, which does not happen with a flexible rate."]},"es":{"stem":"La movilidad del capital es imperfecta y la curva BP es más plana que la LM. Con tipo de cambio flexible, una expansión fiscal lleva a:","options":["Un déficit y una depreciación, de modo que la IS se desplaza aún más a la derecha e Y sube más.","Un superávit y una depreciación, de modo que las exportaciones netas suben y la IS se desplaza más a la derecha.","Ningún cambio del tipo de cambio, porque con movilidad imperfecta la curva BP no es horizontal.","Un déficit que el banco central financia con sus reservas de divisas, de modo que la cantidad de dinero baja.","Un superávit y una apreciación: Y sube, pero menos que en el punto IS-LM."],"steps":["Con la curva BP más plana que la LM, fb &gt; (m<sub>1<\/sub>/ER<sub>0<\/sub>)h, de modo que ΔBP &gt; 0: la expansión crea un superávit.","Con tipo de cambio flexible el superávit aprecia la moneda: las exportaciones netas caen, la IS retrocede en parte y la BP se desplaza hacia arriba.","Y termina por encima de su nivel inicial pero por debajo del punto IS-LM; el multiplicador es h/[h(1 − c<sub>1<\/sub> − α) + b(d + f)]. La opción D describe una intervención, que no ocurre con tipo flexible."]}}];
const SLIDES = [{"s":0,"t":{"en":"","es":""},"en":"<div class=\"title-slide\"><div class=\"left\"><div><div class=\"wm\">COMILLAS<\/div><div class=\"wms\">UNIVERSIDAD PONTIFICIA<\/div><\/div><div class=\"url\">comillas<span style=\"color:#F9B233\">.<\/span>edu<\/div><\/div><div class=\"right\"><div class=\"top\"><h2>International Macroeconomics<\/h2><\/div><div class=\"bottom\"><h3>Chapters 6–9 · The LM Curve, the BP Curve and the Mundell–Fleming Model<\/h3><p>Ioannis Paraskevopoulos<br>Department of Economics, ICADE<br>2026<\/p><div class=\"crest\">⚜<\/div><\/div><\/div><\/div>","es":"<div class=\"title-slide\"><div class=\"left\"><div><div class=\"wm\">COMILLAS<\/div><div class=\"wms\">UNIVERSIDAD PONTIFICIA<\/div><\/div><div class=\"url\">comillas<span style=\"color:#F9B233\">.<\/span>edu<\/div><\/div><div class=\"right\"><div class=\"top\"><h2>Macroeconomía Internacional<\/h2><\/div><div class=\"bottom\"><h3>Temas 6–9 · La curva LM, la curva BP y el modelo Mundell-Fleming<\/h3><p>Ioannis Paraskevopoulos<br>Departamento de Economía, ICADE<br>2026<\/p><div class=\"crest\">⚜<\/div><\/div><\/div><\/div>","plain":true},{"s":0,"t":{"en":"Outline","es":"Índice"},"en":"<div class=\"two\"><div><p class=\"bl\">The LM curve<\/p><ol style=\"font-size:1.05rem;line-height:1.6\">\n<li>The LM curve<\/li>\n<li>Liquidity preference: money demand and the real money supply<\/li>\n<li>Money market equilibrium<\/li>\n<li>Monetary policy instruments<\/li>\n<li>Deriving the LM curve: movements, shifts and slope<\/li>\n<li>In-class exercise<\/li>\n<li>The LM curve across countries: China and the United States<\/li>\n<li>IS–LM and the exchange rate: a monetary expansion and a productivity shock<\/li>\n<li>The liquidity trap<\/li><\/ol>\n<p class=\"bl\">The BP curve<\/p><ol start=\"10\" style=\"font-size:1.05rem;line-height:1.6\">\n<li>The BP curve: setup, derivation and the interest-rate differential<\/li>\n<li>Capital mobility and the slope of the BP curve<\/li>\n<li>Off the BP curve: surplus, deficit and adjustment<\/li>\n<li>Fiscal policy and shifts of the BP curve<\/li><\/ol><\/div>\n<div><p class=\"bl\">The Mundell–Fleming model<\/p><ol start=\"14\" style=\"font-size:1.05rem;line-height:1.6\">\n<li>The full system: goods market, money market and balance of payments<\/li>\n<li>Solving the model: the IS, LM and BP curves and the equilibrium<\/li>\n<li>Multipliers, crowding out and the balance of payments<\/li>\n<li>Closing the model: flexible and fixed exchange rates<\/li>\n<li>Perfect capital mobility: the four policy cases<\/li>\n<li>Imperfect capital mobility<\/li>\n<li>Worked exercise: the full model<\/li><\/ol>\n<p class=\"bl\">Real data<\/p><ol start=\"21\" style=\"font-size:1.05rem;line-height:1.6\">\n<li>The empirical IS–LM–BP: the euro area<\/li><\/ol>\n<p class=\"datasrc\">Slides marked “Real data” apply the model to published statistics; each chart has a table with its numbers and sources.<\/p><\/div><\/div>","es":"<div class=\"two\"><div><p class=\"bl\">La curva LM<\/p><ol style=\"font-size:1.05rem;line-height:1.6\">\n<li>La curva LM<\/li>\n<li>Preferencia por la liquidez: demanda de dinero y oferta monetaria real<\/li>\n<li>Equilibrio del mercado de dinero<\/li>\n<li>Instrumentos de política monetaria<\/li>\n<li>Derivación de la curva LM: movimientos, desplazamientos y pendiente<\/li>\n<li>Ejercicio en clase<\/li>\n<li>La curva LM entre países: China y Estados Unidos<\/li>\n<li>IS-LM y el tipo de cambio: una expansión monetaria y una perturbación de productividad<\/li>\n<li>La trampa de liquidez<\/li><\/ol>\n<p class=\"bl\">La curva BP<\/p><ol start=\"10\" style=\"font-size:1.05rem;line-height:1.6\">\n<li>La curva BP: planteamiento, derivación y diferencial de tipos de interés<\/li>\n<li>Movilidad del capital y pendiente de la curva BP<\/li>\n<li>Fuera de la curva BP: superávit, déficit y ajuste<\/li>\n<li>Política fiscal y desplazamientos de la curva BP<\/li><\/ol><\/div>\n<div><p class=\"bl\">El modelo Mundell-Fleming<\/p><ol start=\"14\" style=\"font-size:1.05rem;line-height:1.6\">\n<li>El sistema completo: mercado de bienes, mercado de dinero y balanza de pagos<\/li>\n<li>Resolver el modelo: las curvas IS, LM y BP y el equilibrio<\/li>\n<li>Multiplicadores, efecto expulsión y balanza de pagos<\/li>\n<li>Cerrar el modelo: tipo de cambio flexible y fijo<\/li>\n<li>Movilidad perfecta del capital: los cuatro casos de política<\/li>\n<li>Movilidad imperfecta del capital<\/li>\n<li>Ejercicio resuelto: el modelo completo<\/li><\/ol>\n<p class=\"bl\">Datos reales<\/p><ol start=\"21\" style=\"font-size:1.05rem;line-height:1.6\">\n<li>El IS-LM-BP empírico: la zona del euro<\/li><\/ol>\n<p class=\"datasrc\">Las diapositivas «Datos reales» aplican el modelo a estadísticas publicadas; cada gráfico tiene una tabla con sus cifras y fuentes.<\/p><\/div><\/div>"},{"s":1,"t":{"en":"The LM Curve","es":"La curva LM"},"en":"<div class=\"two\"><div><ol type=\"A\">\n<li>The LM relation stands for the <span class=\"hl\">Liquidity preference–Money supply<\/span> relation. It is the equilibrium condition of the <b>money market<\/b>.<\/li>\n<li>The LM curve is the graphical representation of all the combinations of the interest rate <b>r<\/b> and income <b>Y<\/b> that are <span class=\"bl\">consistent with equilibrium in the money market<\/span>: the real money supply equals the demand for real money balances,\n<div class=\"eq\">@f{@o{M}}{@o{P}} = <span class=\"hl\">M<sup>d<\/sup>(Y, r)<\/span><\/div>\nThe central bank sets the money supply; money demand rises with income and falls with the interest rate.<\/li><\/ol><\/div>\n<div><p>The LM curve relates the interest rate, r, to income, Y.<\/p>\n[[fig:lm_curve]]\n<div class=\"blk\"><div class=\"bt\">Remember<\/div><div class=\"bb\">The IS curve gives the equilibrium in the <b>goods market<\/b>, and the LM curve gives the equilibrium in the <b>money market<\/b>. Where the two curves cross, both markets clear.<\/div><\/div><\/div><\/div>","es":"<div class=\"two\"><div><ol type=\"A\">\n<li>La relación LM toma su nombre de <span class=\"hl\">preferencia por la liquidez–oferta monetaria<\/span> (Liquidity preference–Money supply). Es la condición de equilibrio del <b>mercado de dinero<\/b>.<\/li>\n<li>La curva LM es la representación gráfica de todas las combinaciones del tipo de interés <b>r<\/b> y de la renta <b>Y<\/b> que son <span class=\"bl\">compatibles con el equilibrio del mercado de dinero<\/span>: la oferta monetaria real es igual a la demanda de saldos monetarios reales,\n<div class=\"eq\">@f{@o{M}}{@o{P}} = <span class=\"hl\">M<sup>d<\/sup>(Y, r)<\/span><\/div>\nEl banco central fija la oferta monetaria; la demanda de dinero aumenta con la renta y disminuye con el tipo de interés.<\/li><\/ol><\/div>\n<div><p>La curva LM relaciona el tipo de interés, r, con la renta, Y.<\/p>\n[[fig:lm_curve]]\n<div class=\"blk\"><div class=\"bt\">Recuerda<\/div><div class=\"bb\">La curva IS da el equilibrio del <b>mercado de bienes<\/b>, y la curva LM el del <b>mercado de dinero<\/b>. Donde se cortan las dos curvas, los dos mercados están en equilibrio.<\/div><\/div><\/div><\/div>"},{"s":1,"t":{"en":"Liquidity Preference: Money or Bonds","es":"Preferencia por la liquidez: dinero o bonos"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Two assets<\/div><div class=\"bb\">We simplify by assuming that financial wealth is held in only two assets:\n<ol type=\"A\"><li><b>Money<\/b>: currency and checkable deposits. It can be used in transactions but <span class=\"hl\">pays no interest<\/span>.<\/li>\n<li><b>Bonds<\/b>: they pay a positive interest rate, r, but cannot be used in transactions.<\/li><\/ol><\/div><\/div>\n<div class=\"identity\">Wealth = money + bonds. With wealth given, deciding how much money to hold is the same as deciding how many bonds to hold, so when the money market is in equilibrium the bond market is too.<\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Wealth allocation<\/div><div class=\"bb\">Households and firms decide how to divide their wealth between money and bonds. This choice is their <span class=\"hl\">liquidity preference<\/span>, and it depends on:\n<ol><li>the level of transactions, which grows with income, Y;<\/li>\n<li>the interest rate on bonds, r, which is the return given up by holding money.<\/li><\/ol><\/div><\/div><\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Dos activos<\/div><div class=\"bb\">Simplificamos suponiendo que la riqueza financiera se mantiene solo en dos activos:\n<ol type=\"A\"><li><b>Dinero<\/b>: efectivo y depósitos a la vista. Puede usarse en las transacciones pero <span class=\"hl\">no paga intereses<\/span>.<\/li>\n<li><b>Bonos<\/b>: pagan un tipo de interés positivo, r, pero no pueden usarse en las transacciones.<\/li><\/ol><\/div><\/div>\n<div class=\"identity\">Riqueza = dinero + bonos. Con la riqueza dada, decidir cuánto dinero mantener es lo mismo que decidir cuántos bonos mantener, de modo que cuando el mercado de dinero está en equilibrio también lo está el de bonos.<\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Asignación de la riqueza<\/div><div class=\"bb\">Los hogares y las empresas deciden cómo repartir su riqueza entre dinero y bonos. Esta elección es su <span class=\"hl\">preferencia por la liquidez<\/span>, y depende de:\n<ol><li>el nivel de transacciones, que crece con la renta, Y;<\/li>\n<li>el tipo de interés de los bonos, r, que es el rendimiento al que se renuncia al mantener dinero.<\/li><\/ol><\/div><\/div><\/div><\/div>"},{"s":1,"t":{"en":"Money Demand","es":"La demanda de dinero"},"en":"<div class=\"blk\"><div class=\"bt\">Money demand, M<sup>d<\/sup><\/div><div class=\"bb\"><ul>\n<li>The demand for money is a <b>demand for real money balances<\/b>, M/P: people care about the purchasing power of the money they hold.<\/li>\n<li>People hold money for three reasons: <span class=\"hl\">transactions, precaution and speculation<\/span>.<\/li>\n<li>The demand for real balances depends <b>positively on income and negatively on the interest rate<\/b>:\n<table class=\"signs\"><tr><th>Money demand<\/th><\/tr><tr><td>M<sup>d<\/sup> = f(Y, r)<\/td><\/tr><tr><td>(+, −)<\/td><\/tr><\/table><\/li>\n<li><b>Income (Y)<\/b>: people demand money for their purchases, which grow with income.<\/li>\n<li><b>Interest rate (r)<\/b>: the opportunity cost of holding money. A higher r makes bonds more attractive, so people hold less money.<\/li><\/ul><\/div><\/div>","es":"<div class=\"blk\"><div class=\"bt\">Demanda de dinero, M<sup>d<\/sup><\/div><div class=\"bb\"><ul>\n<li>La demanda de dinero es una <b>demanda de saldos monetarios reales<\/b>, M/P: a la gente le importa el poder adquisitivo del dinero que mantiene.<\/li>\n<li>Se mantiene dinero por tres motivos: <span class=\"hl\">transacción, precaución y especulación<\/span>.<\/li>\n<li>La demanda de saldos reales depende <b>positivamente de la renta y negativamente del tipo de interés<\/b>:\n<table class=\"signs\"><tr><th>Demanda de dinero<\/th><\/tr><tr><td>M<sup>d<\/sup> = f(Y, r)<\/td><\/tr><tr><td>(+, −)<\/td><\/tr><\/table><\/li>\n<li><b>Renta (Y)<\/b>: la gente demanda dinero para sus compras, que crecen con la renta.<\/li>\n<li><b>Tipo de interés (r)<\/b>: el coste de oportunidad de mantener dinero. Un r más alto hace más atractivos los bonos, de modo que la gente mantiene menos dinero.<\/li><\/ul><\/div><\/div>"},{"s":1,"t":{"en":"The Money Demand Function","es":"La función de demanda de dinero"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Money demand function<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"hl\">M<sup>d<\/sup> = a + bY − hr<\/span><\/div>\n<ol><li><b>b &gt; 0, transactions<\/b>: the sensitivity of the demand for real balances to income.<\/li>\n<li><b>h &gt; 0, speculation<\/b>: the sensitivity of the demand for real balances to the interest rate.<\/li>\n<li><b>a, precaution<\/b>: money held for unexpected payments, whatever the levels of income and of the interest rate. With a = 0 there is no precautionary demand.<\/li>\n<li>For each value of Y, the demand for real balances falls as the interest rate rises: in the (M/P, r) graph the curve slopes downward, with slope −1/h.<\/li>\n<li><span class=\"hl\">A change in Y shifts the money demand curve<\/span>: an increase in Y moves it in parallel to the right, by bΔY.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:md_fn]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Función de demanda de dinero<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"hl\">M<sup>d<\/sup> = a + bY − hr<\/span><\/div>\n<ol><li><b>b &gt; 0, transacción<\/b>: la sensibilidad de la demanda de saldos reales a la renta.<\/li>\n<li><b>h &gt; 0, especulación<\/b>: la sensibilidad de la demanda de saldos reales al tipo de interés.<\/li>\n<li><b>a, precaución<\/b>: dinero que se mantiene para pagos imprevistos, sean cuales sean la renta y el tipo de interés. Con a = 0 no hay demanda por precaución.<\/li>\n<li>Para cada valor de Y, la demanda de saldos reales cae al subir el tipo de interés: en el gráfico (M/P, r) la curva tiene pendiente negativa, igual a −1/h.<\/li>\n<li><span class=\"hl\">Un cambio de Y desplaza la curva de demanda de dinero<\/span>: un aumento de Y la desplaza en paralelo a la derecha, en bΔY.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:md_fn]]<\/div><\/div>"},{"s":1,"t":{"en":"Money Demand: Shifts and Movements","es":"Demanda de dinero: desplazamientos y movimientos"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Two different changes<\/div><div class=\"bb\"><ol type=\"A\">\n<li>At a given interest rate, what happens if income increases, Y′ &gt; Y? More transactions raise the demand for money at every interest rate: <span class=\"hl\">the money demand curve shifts to the right<\/span>.<\/li>\n<li>At a given income, what happens if the interest rate falls, r′ &lt; r? Holding money becomes cheaper and people hold more of it: this is a <span class=\"bl\">movement along<\/span> the money demand curve.<\/li><\/ol><\/div><\/div>\n<div class=\"identity\">A change in a variable on the axes, M/P or r, moves the economy along the curve. A change in any other variable, such as Y, shifts the curve.<\/div><\/div>\n<div>[[fig:md_shift]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Dos cambios distintos<\/div><div class=\"bb\"><ol type=\"A\">\n<li>Para un tipo de interés dado, ¿qué ocurre si aumenta la renta, Y′ &gt; Y? Más transacciones elevan la demanda de dinero para cada tipo de interés: <span class=\"hl\">la curva de demanda de dinero se desplaza a la derecha<\/span>.<\/li>\n<li>Para una renta dada, ¿qué ocurre si baja el tipo de interés, r′ &lt; r? Mantener dinero resulta más barato y la gente mantiene más: es un <span class=\"bl\">movimiento a lo largo<\/span> de la curva de demanda de dinero.<\/li><\/ol><\/div><\/div>\n<div class=\"identity\">Un cambio de una variable de los ejes, M/P o r, mueve la economía a lo largo de la curva. Un cambio de cualquier otra variable, como Y, desplaza la curva.<\/div><\/div>\n<div>[[fig:md_shift]]<\/div><\/div>"},{"s":1,"t":{"en":"Real Data: Liquidity Preference in the Euro Area","es":"Datos reales: la preferencia por la liquidez en la zona del euro"},"en":"<div class=\"two wide-l\"><div>[[fig:d_m1]]<p class=\"datasrc\">Sources: ECB, “Monetary developments in the euro area” (M1 and deposits, figures as published); ECB, key interest rates.<\/p>[[data:d_m1]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the data show<\/div><div class=\"bb\"><ul>\n<li>From July 2022 to September 2023 the ECB raised its deposit facility rate from −0.50% to 4.00%: the opportunity cost of holding money rose by 4.5 points.<\/li>\n<li>Euro area M1, currency and overnight deposits, went from growing 9.8% a year in December 2021 to shrinking 10.4% in August 2023.<\/li>\n<li>Money moved into assets that pay interest: in June 2023 overnight deposits were 9.2% lower than a year earlier, while deposits with an agreed maturity of up to two years were 85.5% higher.<\/li>\n<li>When the ECB began to cut rates in June 2024, M1 growth turned positive again: 1.8% in December 2024.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">r ↑ → M<sup>d<\/sup> ↓: a movement along the money demand curve, as in the money market graph.<\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_m1]]<p class=\"datasrc\">Fuentes: BCE, «Monetary developments in the euro area» (M1 y depósitos, cifras publicadas); BCE, tipos de interés oficiales.<\/p>[[data:d_m1]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestran los datos<\/div><div class=\"bb\"><ul>\n<li>De julio de 2022 a septiembre de 2023 el BCE subió el tipo de la facilidad de depósito del −0,50% al 4,00%: el coste de oportunidad de mantener dinero subió 4,5 puntos.<\/li>\n<li>M1 de la zona del euro, efectivo y depósitos a la vista, pasó de crecer un 9,8% anual en diciembre de 2021 a caer un 10,4% en agosto de 2023.<\/li>\n<li>El dinero se desplazó hacia activos que pagan intereses: en junio de 2023 los depósitos a la vista eran un 9,2% menores que un año antes, mientras que los depósitos a plazo de hasta dos años eran un 85,5% mayores.<\/li>\n<li>Cuando el BCE empezó a bajar tipos en junio de 2024, el crecimiento de M1 volvió a ser positivo: 1,8% en diciembre de 2024.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">r ↑ → M<sup>d<\/sup> ↓: un movimiento a lo largo de la curva de demanda de dinero, como en el gráfico del mercado de dinero.<\/div><\/div><\/div>","data":true},{"s":1,"t":{"en":"The Real Money Supply","es":"La oferta monetaria real"},"en":"<div class=\"two wide-l\"><div><div class=\"blk\"><div class=\"bt\">Real money supply<\/div><div class=\"bb\"><ol>\n<li>The real money supply, (M/P)<sup>S<\/sup>, is the amount of money available in the economy, measured in real terms.<\/li>\n<li>Why is it vertical? The central bank (the Fed in the USA, the ECB in the euro area) decides the amount of money in circulation. If we assume this decision is <b>exogenous<\/b>, it does not depend on the interest rate, and with the price level fixed in the short run the curve is <span class=\"hl\">perfectly inelastic<\/span>: a vertical line at @o{M}/@o{P}.<\/li>\n<li>The money supply <b>moves in parallel to the right<\/b> if the central bank increases the amount of money in circulation, and to the left if it reduces it.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:ms_curve]]<\/div><\/div>","es":"<div class=\"two wide-l\"><div><div class=\"blk\"><div class=\"bt\">Oferta monetaria real<\/div><div class=\"bb\"><ol>\n<li>La oferta monetaria real, (M/P)<sup>S<\/sup>, es la cantidad de dinero disponible en la economía, medida en términos reales.<\/li>\n<li>¿Por qué es vertical? El banco central (la Fed en Estados Unidos, el BCE en la zona del euro) decide la cantidad de dinero en circulación. Si suponemos que esta decisión es <b>exógena<\/b>, no depende del tipo de interés, y con el nivel de precios fijo a corto plazo la curva es <span class=\"hl\">perfectamente inelástica<\/span>: una recta vertical en @o{M}/@o{P}.<\/li>\n<li>La oferta monetaria <b>se desplaza en paralelo a la derecha<\/b> si el banco central aumenta la cantidad de dinero en circulación, y a la izquierda si la reduce.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:ms_curve]]<\/div><\/div>"},{"s":2,"t":{"en":"Money Market Equilibrium","es":"Equilibrio del mercado de dinero"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">M<sup>d<\/sup> = M<sup>S<\/sup><\/div><div class=\"bb\"><ul>\n<li>The equilibrium interest rate, r<sub>0<\/sub>, is where money demand crosses the vertical money supply:\n<div class=\"eq\">@f{@o{M}}{@o{P}} = a + bY − hr<sub>0<\/sub><\/div><\/li>\n<li><b>Above r<sub>0<\/sub><\/b>, people want to hold less money than there is: <span class=\"hl\">excess supply of money<\/span>. They use it to buy bonds, bond prices rise and the interest rate falls.<\/li>\n<li><b>Below r<sub>0<\/sub><\/b>, people want more money than there is: <span class=\"hl\">excess demand for money<\/span>. They sell bonds, bond prices fall and the interest rate rises.<\/li>\n<li>Bond prices and interest rates move in opposite directions: a bond that pays a fixed amount is worth less when the interest rate is higher.<\/li><\/ul><\/div><\/div><\/div>\n<div>[[fig:mm_eq]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">M<sup>d<\/sup> = M<sup>S<\/sup><\/div><div class=\"bb\"><ul>\n<li>El tipo de interés de equilibrio, r<sub>0<\/sub>, está donde la demanda de dinero corta a la oferta monetaria vertical:\n<div class=\"eq\">@f{@o{M}}{@o{P}} = a + bY − hr<sub>0<\/sub><\/div><\/li>\n<li><b>Por encima de r<sub>0<\/sub><\/b>, la gente quiere mantener menos dinero del que hay: <span class=\"hl\">exceso de oferta de dinero<\/span>. Lo usa para comprar bonos, el precio de los bonos sube y el tipo de interés baja.<\/li>\n<li><b>Por debajo de r<sub>0<\/sub><\/b>, la gente quiere más dinero del que hay: <span class=\"hl\">exceso de demanda de dinero<\/span>. Vende bonos, su precio cae y el tipo de interés sube.<\/li>\n<li>El precio de los bonos y el tipo de interés se mueven en sentidos opuestos: un bono que paga una cantidad fija vale menos cuando el tipo de interés es más alto.<\/li><\/ul><\/div><\/div><\/div>\n<div>[[fig:mm_eq]]<\/div><\/div>"},{"s":2,"t":{"en":"An Increase in Income","es":"Un aumento de la renta"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Income rises, Y<sub>2<\/sub> &gt; Y<sub>1<\/sub><\/div><div class=\"bb\"><ol type=\"A\">\n<li>A higher income raises the level of transactions and therefore the demand for real balances: M<sup>d<\/sup> shifts to the right.<\/li>\n<li>The money supply is fixed, so at the initial interest rate there is now <span class=\"hl\">excess demand for money<\/span>.<\/li>\n<li>People sell bonds to obtain money, bond prices fall and the interest rate rises from r<sub>1<\/sub> to r<sub>2<\/sub>. The higher r <span class=\"bl\">reduces the amount of money people want to hold<\/span> until it equals the money supply again.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:mm_y]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">La renta aumenta, Y<sub>2<\/sub> &gt; Y<sub>1<\/sub><\/div><div class=\"bb\"><ol type=\"A\">\n<li>Una renta mayor eleva el nivel de transacciones y, por tanto, la demanda de saldos reales: M<sup>d<\/sup> se desplaza a la derecha.<\/li>\n<li>La oferta monetaria está fija, de modo que al tipo de interés inicial hay ahora <span class=\"hl\">exceso de demanda de dinero<\/span>.<\/li>\n<li>La gente vende bonos para obtener dinero, su precio cae y el tipo de interés sube de r<sub>1<\/sub> a r<sub>2<\/sub>. El r más alto <span class=\"bl\">reduce la cantidad de dinero que la gente quiere mantener<\/span> hasta que vuelve a igualar a la oferta monetaria.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:mm_y]]<\/div><\/div>"},{"s":2,"t":{"en":"An Increase in the Money Supply","es":"Un aumento de la oferta monetaria"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">The money supply rises, M<sup>S′<\/sup> &gt; M<sup>S<\/sup><\/div><div class=\"bb\"><ol type=\"A\">\n<li>The central bank increases the money supply: the vertical line shifts to the right.<\/li>\n<li>At the initial interest rate there is <span class=\"hl\">excess supply of money<\/span>; people buy bonds and the interest rate falls to r′.<\/li>\n<li>The lower r raises the quantity of money demanded, a movement along M<sup>d<\/sup>, until the market is in equilibrium again.<\/li>\n<li>A reduction of the money supply works in the opposite direction and raises the interest rate.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:mm_ms]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">La oferta monetaria aumenta, M<sup>S′<\/sup> &gt; M<sup>S<\/sup><\/div><div class=\"bb\"><ol type=\"A\">\n<li>El banco central aumenta la oferta monetaria: la recta vertical se desplaza a la derecha.<\/li>\n<li>Al tipo de interés inicial hay <span class=\"hl\">exceso de oferta de dinero<\/span>; la gente compra bonos y el tipo de interés baja hasta r′.<\/li>\n<li>El r más bajo eleva la cantidad demandada de dinero, un movimiento a lo largo de M<sup>d<\/sup>, hasta que el mercado vuelve al equilibrio.<\/li>\n<li>Una reducción de la oferta monetaria funciona en sentido contrario y eleva el tipo de interés.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:mm_ms]]<\/div><\/div>"},{"s":3,"t":{"en":"Monetary Policy Instruments","es":"Instrumentos de política monetaria"},"en":"<div class=\"blk\"><div class=\"bt\">Policy instruments<\/div><div class=\"bb\">Central banks change the money supply to achieve their goals. The conventional instruments that control the money supply, and through it the interest rate, are:\n<ol type=\"A\"><li><b>Open market operations<\/b> (OMO): purchases and sales of government bonds.<\/li>\n<li><b>The reserve requirement<\/b>, k: the share of their deposits that commercial banks must hold as reserves.<\/li>\n<li><b>Standing facilities<\/b>: the interest rate at which the central bank lends to commercial banks, the discount rate.<\/li><\/ol><\/div><\/div>\n<div class=\"identity\"><b>Expansionary monetary policy<\/b>: M<sup>S<\/sup> ↑ → r ↓ → C ↑, I ↑ → Y ↑<br><b>Contractionary monetary policy<\/b>: M<sup>S<\/sup> ↓ → r ↑ → C ↓, I ↓ → Y ↓<\/div>\n<div class=\"assume\">In the graphs the central bank changes the money supply to move r: it does not set r directly. In practice central banks announce a target for the short-term interest rate and supply the money that the target requires; the graphs work the same way.<\/div>","es":"<div class=\"blk\"><div class=\"bt\">Instrumentos de política<\/div><div class=\"bb\">Los bancos centrales modifican la oferta monetaria para alcanzar sus objetivos. Los instrumentos convencionales que controlan la oferta monetaria, y a través de ella el tipo de interés, son:\n<ol type=\"A\"><li><b>Operaciones de mercado abierto<\/b> (OMA): compras y ventas de bonos públicos.<\/li>\n<li><b>El coeficiente de reservas<\/b>, k: la proporción de sus depósitos que los bancos comerciales deben mantener como reservas.<\/li>\n<li><b>Facilidades permanentes<\/b>: el tipo de interés al que el banco central presta a los bancos comerciales, el tipo de descuento.<\/li><\/ol><\/div><\/div>\n<div class=\"identity\"><b>Política monetaria expansiva<\/b>: M<sup>S<\/sup> ↑ → r ↓ → C ↑, I ↑ → Y ↑<br><b>Política monetaria contractiva<\/b>: M<sup>S<\/sup> ↓ → r ↑ → C ↓, I ↓ → Y ↓<\/div>\n<div class=\"assume\">En los gráficos el banco central cambia la oferta monetaria para mover r: no fija r directamente. En la práctica los bancos centrales anuncian un objetivo para el tipo de interés a corto plazo y ofrecen el dinero que ese objetivo requiere; los gráficos funcionan igual.<\/div>"},{"s":3,"t":{"en":"Open Market Operations","es":"Operaciones de mercado abierto"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Monetary policy through OMO<\/div><div class=\"bb\"><ol>\n<li>Open market operations are purchases and sales of public debt in the secondary (open) market to regulate the money supply.<\/li>\n<li><b>Expansionary operation<\/b>: the central bank <span class=\"hl\">buys bonds<\/span>. The money supply rises, the M<sup>S<\/sup> line shifts to the right and r falls; the purchases also raise bond prices, which is the same thing as a lower interest rate. Large-scale purchases of public debt and of other assets, such as corporate debt, are called <b>quantitative easing<\/b> (QE).<\/li>\n<li><b>Contractionary operation<\/b>: the central bank <span class=\"hl\">sells bonds<\/span> and removes money from circulation. The money supply falls and r rises.<\/li><\/ol><\/div><\/div>\n<div class=\"identity\">Purchase of bonds: M<sup>S<\/sup> ↑ → r ↓ → C ↑, I ↑ → Y ↑<br>Sale of bonds: M<sup>S<\/sup> ↓ → r ↑ → C ↓, I ↓ → Y ↓<\/div><\/div>\n<div>[[fig:omo]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Política monetaria mediante OMA<\/div><div class=\"bb\"><ol>\n<li>Las operaciones de mercado abierto son compras y ventas de deuda pública en el mercado secundario (abierto) para regular la oferta monetaria.<\/li>\n<li><b>Operación expansiva<\/b>: el banco central <span class=\"hl\">compra bonos<\/span>. La oferta monetaria aumenta, la recta M<sup>S<\/sup> se desplaza a la derecha y r baja; las compras también elevan el precio de los bonos, que es lo mismo que un tipo de interés más bajo. Las compras a gran escala de deuda pública y de otros activos, como la deuda corporativa, se llaman <b>expansión cuantitativa<\/b> (QE).<\/li>\n<li><b>Operación contractiva<\/b>: el banco central <span class=\"hl\">vende bonos<\/span> y retira dinero de la circulación. La oferta monetaria cae y r sube.<\/li><\/ol><\/div><\/div>\n<div class=\"identity\">Compra de bonos: M<sup>S<\/sup> ↑ → r ↓ → C ↑, I ↑ → Y ↑<br>Venta de bonos: M<sup>S<\/sup> ↓ → r ↑ → C ↓, I ↓ → Y ↓<\/div><\/div>\n<div>[[fig:omo]]<\/div><\/div>"},{"s":3,"t":{"en":"Reserve Requirement and Standing Facilities","es":"Coeficiente de reservas y facilidades permanentes"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Reserve requirement, k<\/div><div class=\"bb\"><ul>\n<li>The share of their deposits that commercial banks must hold as reserves.<\/li>\n<li>A <span class=\"hl\">lower k<\/span> raises the money supply; a higher k reduces it.<\/li>\n<li>Some central banks, such as the People's Bank of China, use it as an active policy instrument.<\/li><\/ul>\n<div class=\"identity\">Expansionary policy: k ↓ → M<sup>S<\/sup> ↑ → r ↓ → C ↑, I ↑ → Y ↑<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Standing facilities and the discount rate<\/div><div class=\"bb\"><ul>\n<li>The central bank is the <b>lender of last resort<\/b>: it lends to commercial banks through its standing facilities.<\/li>\n<li>By changing the conditions of these short-term loans, above all their interest rate, the central bank changes the money supply and r.<\/li><\/ul>\n<div class=\"identity\">Expansionary policy: standing-facility rate ↓ → M<sup>S<\/sup> ↑ → r ↓ → C ↑, I ↑ → Y ↑<\/div><\/div><\/div><\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Coeficiente de reservas, k<\/div><div class=\"bb\"><ul>\n<li>La proporción de sus depósitos que los bancos comerciales deben mantener como reservas.<\/li>\n<li>Un <span class=\"hl\">k menor<\/span> eleva la oferta monetaria; un k mayor la reduce.<\/li>\n<li>Algunos bancos centrales, como el Banco Popular de China, lo usan como instrumento activo de política.<\/li><\/ul>\n<div class=\"identity\">Política expansiva: k ↓ → M<sup>S<\/sup> ↑ → r ↓ → C ↑, I ↑ → Y ↑<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Facilidades permanentes y tipo de descuento<\/div><div class=\"bb\"><ul>\n<li>El banco central es el <b>prestamista de última instancia<\/b>: presta a los bancos comerciales a través de sus facilidades permanentes.<\/li>\n<li>Al cambiar las condiciones de estos préstamos a corto plazo, sobre todo su tipo de interés, el banco central cambia la oferta monetaria y r.<\/li><\/ul>\n<div class=\"identity\">Política expansiva: tipo de las facilidades ↓ → M<sup>S<\/sup> ↑ → r ↓ → C ↑, I ↑ → Y ↑<\/div><\/div><\/div><\/div><\/div>"},{"s":4,"t":{"en":"Deriving the LM Curve","es":"Derivación de la curva LM"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">M<sup>d<\/sup> = M<sup>S<\/sup><\/div><div class=\"bb\">\n<div class=\"eq\">@f{@o{M}}{@o{P}} = a + bY − hr<\/div>\n<p>The <span class=\"hl\">LM curve<\/span> shows every combination of income, Y, and interest rate, r, at which the supply of real money balances equals the demand. <b>Solving for r<\/b>:<\/p>\n<div class=\"eq\"><span class=\"hl\">r = @f{1}{h} (a + bY − @f{@o{M}}{@o{P}})<\/span><\/div><\/div><\/div><\/div>\n<div><ul>\n<li>In the money market: with income Y<sub>1<\/sub>, the market is in equilibrium at r<sub>1<\/sub>. With Y<sub>2<\/sub> &gt; Y<sub>1<\/sub>, money demand is higher and the equilibrium is at r<sub>2<\/sub>.<\/li>\n<li>In the LM graph: the pairs (Y<sub>1<\/sub>, r<sub>1<\/sub>) and (Y<sub>2<\/sub>, r<sub>2<\/sub>) are two points of the LM curve. Repeating the exercise for every income traces the whole curve.<\/li><\/ul><\/div><\/div>\n[[fig:lm_deriv]]","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">M<sup>d<\/sup> = M<sup>S<\/sup><\/div><div class=\"bb\">\n<div class=\"eq\">@f{@o{M}}{@o{P}} = a + bY − hr<\/div>\n<p>La <span class=\"hl\">curva LM<\/span> muestra todas las combinaciones de renta, Y, y tipo de interés, r, en las que la oferta de saldos monetarios reales es igual a la demanda. <b>Despejando r<\/b>:<\/p>\n<div class=\"eq\"><span class=\"hl\">r = @f{1}{h} (a + bY − @f{@o{M}}{@o{P}})<\/span><\/div><\/div><\/div><\/div>\n<div><ul>\n<li>En el mercado de dinero: con renta Y<sub>1<\/sub>, el mercado está en equilibrio en r<sub>1<\/sub>. Con Y<sub>2<\/sub> &gt; Y<sub>1<\/sub>, la demanda de dinero es mayor y el equilibrio está en r<sub>2<\/sub>.<\/li>\n<li>En el gráfico LM: los pares (Y<sub>1<\/sub>, r<sub>1<\/sub>) e (Y<sub>2<\/sub>, r<sub>2<\/sub>) son dos puntos de la curva LM. Repitiendo el ejercicio para cada renta se obtiene toda la curva.<\/li><\/ul><\/div><\/div>\n[[fig:lm_deriv]]"},{"s":4,"t":{"en":"Formation of the LM Curve I: Higher Income","es":"Formación de la curva LM I: una renta mayor"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">What happens to r if Y increases?<\/div><div class=\"bb\"><ol type=\"A\">\n<li>Y ↑ → transactions ↑ → M<sup>d<\/sup> ↑. At r<sub>1<\/sub>, M<sup>d<\/sup> &gt; M<sup>S<\/sup>, which is fixed: <span class=\"hl\">excess demand for money<\/span>.<\/li>\n<li>People sell bonds to obtain money, bond prices fall and r rises until the market is in equilibrium at r<sub>2<\/sub>. Bonds become more attractive, which is the same as saying that holding money has become more expensive.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Conclusion<\/div><div class=\"bb\">For a given money supply, a higher Y goes hand in hand with a higher r: the economy <span class=\"bl\">moves along<\/span> the LM curve, from (Y<sub>1<\/sub>, r<sub>1<\/sub>) to (Y<sub>2<\/sub>, r<sub>2<\/sub>).<\/div><\/div><\/div><\/div>\n[[fig:lm_y]]","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">¿Qué ocurre con r si aumenta Y?<\/div><div class=\"bb\"><ol type=\"A\">\n<li>Y ↑ → transacciones ↑ → M<sup>d<\/sup> ↑. En r<sub>1<\/sub>, M<sup>d<\/sup> &gt; M<sup>S<\/sup>, que está fija: <span class=\"hl\">exceso de demanda de dinero<\/span>.<\/li>\n<li>La gente vende bonos para obtener dinero, su precio cae y r sube hasta que el mercado está en equilibrio en r<sub>2<\/sub>. Los bonos resultan más atractivos, lo que equivale a decir que mantener dinero se ha encarecido.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Conclusión<\/div><div class=\"bb\">Para una oferta monetaria dada, una Y mayor va unida a un r mayor: la economía <span class=\"bl\">se mueve a lo largo<\/span> de la curva LM, de (Y<sub>1<\/sub>, r<sub>1<\/sub>) a (Y<sub>2<\/sub>, r<sub>2<\/sub>).<\/div><\/div><\/div><\/div>\n[[fig:lm_y]]"},{"s":4,"t":{"en":"Formation of the LM Curve II: a Smaller Money Supply","es":"Formación de la curva LM II: una oferta monetaria menor"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">The central bank reduces M<sup>S<\/sup><\/div><div class=\"bb\"><ol type=\"A\">\n<li>M<sup>S<\/sup> ↓, through open market sales, a higher k or a higher discount rate: at the initial income Y<sub>1<\/sub> there is <span class=\"hl\">excess demand for money<\/span>, M<sup>d<\/sup> &gt; M<sup>S<\/sup>.<\/li>\n<li>r rises from r<sub>1<\/sub> to r<sub>2<\/sub>, and the same happens at every level of income.<\/li>\n<li>The money supply is not on the axes of the LM graph, so <span class=\"hl\">the LM curve shifts up and to the left<\/span>, from LM to LM′: there is no movement along it.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"assume\">Think of the central bank as changing M<sup>S<\/sup> to influence r: in the graphs it does not change r directly. In reality central banks operate directly on the interest rate, and the money supply adjusts to the rate they set.<\/div><\/div><\/div>\n[[fig:lm_ms]]","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">El banco central reduce M<sup>S<\/sup><\/div><div class=\"bb\"><ol type=\"A\">\n<li>M<sup>S<\/sup> ↓, mediante ventas en el mercado abierto, un k mayor o un tipo de descuento más alto: con la renta inicial Y<sub>1<\/sub> hay <span class=\"hl\">exceso de demanda de dinero<\/span>, M<sup>d<\/sup> &gt; M<sup>S<\/sup>.<\/li>\n<li>r sube de r<sub>1<\/sub> a r<sub>2<\/sub>, y lo mismo ocurre para cada nivel de renta.<\/li>\n<li>La oferta monetaria no está en los ejes del gráfico LM, de modo que <span class=\"hl\">la curva LM se desplaza hacia arriba y a la izquierda<\/span>, de LM a LM′: no hay movimiento a lo largo de ella.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"assume\">Piensa que el banco central cambia M<sup>S<\/sup> para influir en r: en los gráficos no cambia r directamente. En la realidad los bancos centrales actúan directamente sobre el tipo de interés, y la oferta monetaria se ajusta al tipo que fijan.<\/div><\/div><\/div>\n[[fig:lm_ms]]"},{"s":4,"t":{"en":"Formation of the LM Curve III: the Central Bank Buys Bonds","es":"Formación de la curva LM III: el banco central compra bonos"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">An open market purchase<\/div><div class=\"bb\"><ol type=\"A\">\n<li>M<sup>S<\/sup> ↑: the central bank buys bonds. At the initial income Y<sub>1<\/sub> there is <span class=\"hl\">excess supply of money<\/span>, M<sup>S<\/sup> &gt; M<sup>d<\/sup>, and r falls until money demand rises to the new money supply.<\/li>\n<li>The money supply has changed, so <span class=\"bl\">the LM curve shifts down and to the right<\/span>, to LM′: there is no movement along it.<\/li>\n<li>In the goods market the lower r raises investment and consumption: Y rises along the IS curve, and the new equilibrium is E<sub>2<\/sub>.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"identity\">Central bank buys bonds: M<sup>S<\/sup> ↑ → LM shifts right → r ↓ → C ↑, I ↑ → Y ↑<\/div>\n<p class=\"note\">As income rises towards E<sub>2<\/sub>, money demand rises too, so r ends above the rate reached at the initial income.<\/p><\/div><\/div>\n[[fig:cb_buys]]","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Una compra en el mercado abierto<\/div><div class=\"bb\"><ol type=\"A\">\n<li>M<sup>S<\/sup> ↑: el banco central compra bonos. Con la renta inicial Y<sub>1<\/sub> hay <span class=\"hl\">exceso de oferta de dinero<\/span>, M<sup>S<\/sup> &gt; M<sup>d<\/sup>, y r baja hasta que la demanda de dinero sube hasta la nueva oferta monetaria.<\/li>\n<li>La oferta monetaria ha cambiado, de modo que <span class=\"bl\">la curva LM se desplaza hacia abajo y a la derecha<\/span>, a LM′: no hay movimiento a lo largo de ella.<\/li>\n<li>En el mercado de bienes el menor r eleva la inversión y el consumo: Y aumenta a lo largo de la curva IS, y el nuevo equilibrio es E<sub>2<\/sub>.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"identity\">El banco central compra bonos: M<sup>S<\/sup> ↑ → la LM se desplaza a la derecha → r ↓ → C ↑, I ↑ → Y ↑<\/div>\n<p class=\"note\">Al subir la renta hacia E<sub>2<\/sub>, también sube la demanda de dinero, de modo que r termina por encima del tipo alcanzado con la renta inicial.<\/p><\/div><\/div>\n[[fig:cb_buys]]"},{"s":4,"t":{"en":"Slope and Shifts from the Equilibrium Equation","es":"Pendiente y desplazamientos a partir de la ecuación de equilibrio"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Read the LM equation<\/div><div class=\"bb\">\n<div class=\"eq\">r = @f{1}{h} (a + <span class=\"bl\">bY<\/span> − <span class=\"hl\">@f{@o{M}}{@o{P}}<\/span>)<\/div>\n<ol type=\"A\"><li><span class=\"bl\">Y is on the axis<\/span>, so changes in Y lead to <b>movements along<\/b> the LM curve.<\/li>\n<li><span class=\"hl\">Changes in the money supply<\/span> do not affect the slope and are not variables on the axes: they <b>shift<\/b> the curve. An increase in M/P lowers r by Δ(M/P)/h at every income.<\/li>\n<li>The slope of the LM curve is <div class=\"eq\">@f{∂r}{∂Y} = @f{b}{h} &gt; 0<\/div><\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the slope depends on<\/div><div class=\"bb\"><ul>\n<li><b>b<\/b>: the more money demand responds to income, the steeper the LM curve.<\/li>\n<li><b>h<\/b>: the more money demand responds to the interest rate, the flatter the LM curve.<\/li>\n<li>h → ∞: the LM curve is horizontal, the case of the liquidity trap.<\/li>\n<li>h → 0: the LM curve is vertical, because only income determines the demand for money.<\/li><\/ul><\/div><\/div>\n[[fig:lm_eq]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Leer la ecuación LM<\/div><div class=\"bb\">\n<div class=\"eq\">r = @f{1}{h} (a + <span class=\"bl\">bY<\/span> − <span class=\"hl\">@f{@o{M}}{@o{P}}<\/span>)<\/div>\n<ol type=\"A\"><li><span class=\"bl\">Y está en el eje<\/span>, de modo que los cambios de Y producen <b>movimientos a lo largo<\/b> de la curva LM.<\/li>\n<li><span class=\"hl\">Los cambios de la oferta monetaria<\/span> no afectan a la pendiente y no son variables de los ejes: <b>desplazan<\/b> la curva. Un aumento de M/P reduce r en Δ(M/P)/h para cada renta.<\/li>\n<li>La pendiente de la curva LM es <div class=\"eq\">@f{∂r}{∂Y} = @f{b}{h} &gt; 0<\/div><\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">De qué depende la pendiente<\/div><div class=\"bb\"><ul>\n<li><b>b<\/b>: cuanto más responde la demanda de dinero a la renta, más inclinada es la curva LM.<\/li>\n<li><b>h<\/b>: cuanto más responde la demanda de dinero al tipo de interés, más plana es la curva LM.<\/li>\n<li>h → ∞: la curva LM es horizontal, el caso de la trampa de liquidez.<\/li>\n<li>h → 0: la curva LM es vertical, porque solo la renta determina la demanda de dinero.<\/li><\/ul><\/div><\/div>\n[[fig:lm_eq]]<\/div><\/div>"},{"s":4,"t":{"en":"In-Class Exercise: the LM Curve","es":"Ejercicio en clase: la curva LM"},"en":"<div class=\"blk\"><div class=\"bt\">Data and questions<\/div><div class=\"bb\">Money demand is M<sup>d<\/sup> = 50 + 0.4Y − 10r, with r in percent, and the real money supply is @o{M}/@o{P} = 330.\n<ol><li><span class=\"hl\">Find the LM curve and its slope.<\/span><\/li>\n<li><span class=\"hl\">Calculate the interest rate when Y = 800 and when Y = 900, and place both points on the graph.<\/span><\/li>\n<li><span class=\"hl\">The central bank raises the real money supply to 350. Find the new LM curve.<\/span> By how much does r change at a given income, and by how much does Y change at a given interest rate?<\/li><\/ol><\/div><\/div>\n<details class=\"sol\"><summary><span class=\"s-closed\">Show the solution<\/span><span class=\"s-open\">Hide the solution<\/span><\/summary>\n<div class=\"two\"><div><ol>\n<li>330 = 50 + 0.4Y − 10r, so 10r = 0.4Y − 280 and <b>r = 0.04Y − 28<\/b>. The slope is b/h = 0.4/10 = <b>0.04<\/b>.<\/li>\n<li>Y = 800: r = 32 − 28 = <b>4<\/b>. Y = 900: r = 36 − 28 = <b>8<\/b>.<\/li>\n<li>350 = 50 + 0.4Y − 10r gives <b>r = 0.04Y − 30<\/b>. At each income r is 20/10 = <b>2 points lower<\/b>; at each interest rate Y is 20/0.4 = <b>50 higher<\/b>. At r = 4, income moves from 800 to 850.<\/li><\/ol><\/div>\n<div>[[fig:ex_lm]]<\/div><\/div><\/details>","es":"<div class=\"blk\"><div class=\"bt\">Datos y preguntas<\/div><div class=\"bb\">La demanda de dinero es M<sup>d<\/sup> = 50 + 0,4Y − 10r, con r en porcentaje, y la oferta monetaria real es @o{M}/@o{P} = 330.\n<ol><li><span class=\"hl\">Halla la curva LM y su pendiente.<\/span><\/li>\n<li><span class=\"hl\">Calcula el tipo de interés cuando Y = 800 y cuando Y = 900, y sitúa los dos puntos en el gráfico.<\/span><\/li>\n<li><span class=\"hl\">El banco central eleva la oferta monetaria real a 350. Halla la nueva curva LM.<\/span> ¿Cuánto cambia r para una renta dada, y cuánto cambia Y para un tipo de interés dado?<\/li><\/ol><\/div><\/div>\n<details class=\"sol\"><summary><span class=\"s-closed\">Mostrar la solución<\/span><span class=\"s-open\">Ocultar la solución<\/span><\/summary>\n<div class=\"two\"><div><ol>\n<li>330 = 50 + 0,4Y − 10r, de modo que 10r = 0,4Y − 280 y <b>r = 0,04Y − 28<\/b>. La pendiente es b/h = 0,4/10 = <b>0,04<\/b>.<\/li>\n<li>Y = 800: r = 32 − 28 = <b>4<\/b>. Y = 900: r = 36 − 28 = <b>8<\/b>.<\/li>\n<li>350 = 50 + 0,4Y − 10r da <b>r = 0,04Y − 30<\/b>. Para cada renta, r es 20/10 = <b>2 puntos menor<\/b>; para cada tipo de interés, Y es 20/0,4 = <b>50 mayor<\/b>. Con r = 4, la renta pasa de 800 a 850.<\/li><\/ol><\/div>\n<div>[[fig:ex_lm]]<\/div><\/div><\/details>"},{"s":5,"t":{"en":"China Cuts the Reserve Requirement","es":"China reduce el coeficiente de reservas"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">What happens if China lowers k?<\/div><div class=\"bb\"><ol type=\"A\">\n<li>The People's Bank of China lowers the reserve requirement: M<sup>S<\/sup> ↑. At the initial income Y<sub>1<\/sub> there is <span class=\"hl\">excess supply of money<\/span>, M<sup>S<\/sup> &gt; M<sup>d<\/sup>, and r falls until money demand rises to the new money supply.<\/li>\n<li>The money supply has changed, so the Chinese <span class=\"bl\">LM curve shifts to the right<\/span>: there is no movement along it.<\/li>\n<li>In the goods market the lower r raises investment and consumption, and Chinese income rises from Y<sub>1<\/sub> to Y<sub>2<\/sub>.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"identity\">China: k ↓ → M<sup>S<\/sup> ↑ → LM shifts right → r ↓ → Y ↑<\/div><\/div><\/div>\n[[fig:china]]","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">¿Qué ocurre si China reduce k?<\/div><div class=\"bb\"><ol type=\"A\">\n<li>El Banco Popular de China reduce el coeficiente de reservas: M<sup>S<\/sup> ↑. Con la renta inicial Y<sub>1<\/sub> hay <span class=\"hl\">exceso de oferta de dinero<\/span>, M<sup>S<\/sup> &gt; M<sup>d<\/sup>, y r baja hasta que la demanda de dinero sube hasta la nueva oferta monetaria.<\/li>\n<li>La oferta monetaria ha cambiado, de modo que <span class=\"bl\">la curva LM china se desplaza a la derecha<\/span>: no hay movimiento a lo largo de ella.<\/li>\n<li>En el mercado de bienes el menor r eleva la inversión y el consumo, y la renta china aumenta de Y<sub>1<\/sub> a Y<sub>2<\/sub>.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"identity\">China: k ↓ → M<sup>S<\/sup> ↑ → la LM se desplaza a la derecha → r ↓ → Y ↑<\/div><\/div><\/div>\n[[fig:china]]"},{"s":5,"t":{"en":"The Effect on the United States","es":"El efecto sobre Estados Unidos"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">The spillover to the US economy<\/div><div class=\"bb\"><ol type=\"A\">\n<li>Higher Chinese income raises Chinese imports, which are <span class=\"hl\">US exports<\/span>: the US IS curve shifts to the right and American income rises.<\/li>\n<li>At the initial US interest rate, more transactions create <span class=\"hl\">excess demand for money<\/span>, M<sup>d<\/sup> &gt; M<sup>S<\/sup>, and r<sub>US<\/sub> rises. The US economy moves along its LM curve, which does not shift because the Fed has not changed the money supply.<\/li>\n<li>The US interest rate rises while the Chinese rate falls: capital moves towards US assets and <span class=\"bl\">the dollar appreciates against the yuan<\/span>.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"identity\">United States: X ↑ → IS shifts right → Y ↑ → M<sup>d<\/sup> ↑ → r<sub>US<\/sub> ↑ → the dollar appreciates against the yuan<\/div><\/div><\/div>\n[[fig:us]]","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">El contagio a la economía estadounidense<\/div><div class=\"bb\"><ol type=\"A\">\n<li>Una renta china mayor eleva las importaciones chinas, que son <span class=\"hl\">exportaciones de Estados Unidos<\/span>: la curva IS estadounidense se desplaza a la derecha y la renta de Estados Unidos aumenta.<\/li>\n<li>Al tipo de interés estadounidense inicial, más transacciones crean <span class=\"hl\">exceso de demanda de dinero<\/span>, M<sup>d<\/sup> &gt; M<sup>S<\/sup>, y r<sub>US<\/sub> sube. La economía estadounidense se mueve a lo largo de su curva LM, que no se desplaza porque la Fed no ha cambiado la oferta monetaria.<\/li>\n<li>El tipo de interés estadounidense sube mientras el chino baja: el capital se dirige hacia los activos estadounidenses y <span class=\"bl\">el dólar se aprecia frente al yuan<\/span>.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"identity\">Estados Unidos: X ↑ → la IS se desplaza a la derecha → Y ↑ → M<sup>d<\/sup> ↑ → r<sub>US<\/sub> ↑ → el dólar se aprecia frente al yuan<\/div><\/div><\/div>\n[[fig:us]]"},{"s":6,"t":{"en":"IS–LM Equilibrium","es":"Equilibrio IS-LM"},"en":"<div class=\"two\"><div><ul>\n<li>The <b>IS curve<\/b>: the combinations of Y and r with equilibrium in the goods market, Y = ZZ. It slopes downward: a lower r raises investment and output.<\/li>\n<li>The <b>LM curve<\/b>: the combinations of Y and r with equilibrium in the money market, @o{M}/@o{P} = M<sup>d<\/sup>(Y, r). It slopes upward.<\/li>\n<li>At the crossing, E, <span class=\"hl\">both markets are in equilibrium<\/span>: the economy produces Y<sub>E<\/sub> and the interest rate is r<sub>E<\/sub>.<\/li>\n<li><span class=\"bl\">Fiscal policy<\/span> (G, T, TR) shifts the IS curve; <span class=\"bl\">monetary policy<\/span> (M<sup>S<\/sup>) shifts the LM curve.<\/li><\/ul>\n<div class=\"identity\">A change in a variable on the axes, Y or r, is a movement along a curve. A change in anything else shifts the curve.<\/div><\/div>\n<div>[[fig:islm]]<\/div><\/div>","es":"<div class=\"two\"><div><ul>\n<li>La <b>curva IS<\/b>: las combinaciones de Y y r con equilibrio en el mercado de bienes, Y = ZZ. Tiene pendiente negativa: un r más bajo eleva la inversión y la producción.<\/li>\n<li>La <b>curva LM<\/b>: las combinaciones de Y y r con equilibrio en el mercado de dinero, @o{M}/@o{P} = M<sup>d<\/sup>(Y, r). Tiene pendiente positiva.<\/li>\n<li>En el corte, E, <span class=\"hl\">los dos mercados están en equilibrio<\/span>: la economía produce Y<sub>E<\/sub> y el tipo de interés es r<sub>E<\/sub>.<\/li>\n<li>La <span class=\"bl\">política fiscal<\/span> (G, T, TR) desplaza la curva IS; la <span class=\"bl\">política monetaria<\/span> (M<sup>S<\/sup>) desplaza la curva LM.<\/li><\/ul>\n<div class=\"identity\">Un cambio de una variable de los ejes, Y o r, es un movimiento a lo largo de una curva. Un cambio de cualquier otra cosa desplaza la curva.<\/div><\/div>\n<div>[[fig:islm]]<\/div><\/div>"},{"s":6,"t":{"en":"Monetary Expansion: IS, LM and the Exchange Rate","es":"Expansión monetaria: IS, LM y tipo de cambio"},"en":"<div class=\"blk\"><div class=\"bt\">Monetary expansion<\/div><div class=\"bb\"><ol>\n<li>M<sup>S<\/sup> ↑: the money supply shifts to the right and creates excess supply of money, which pushes r down. <span class=\"hl\">The LM curve shifts to the right<\/span>.<\/li>\n<li>The lower interest rate raises consumption and investment and shifts aggregate demand up, from AD to AD′. Output rises to Y<sub>2<\/sub>, and the IS curve crosses LM′ at point 2, the new equilibrium for r and Y.<\/li>\n<li>In the forex market, domestic assets now pay a lower return: investors move funds abroad, the supply of the domestic currency rises and <span class=\"hl\">the domestic currency depreciates<\/span>.<\/li><\/ol><\/div><\/div>\n[[fig:mp_fx]]","es":"<div class=\"blk\"><div class=\"bt\">Expansión monetaria<\/div><div class=\"bb\"><ol>\n<li>M<sup>S<\/sup> ↑: la oferta monetaria se desplaza a la derecha y crea un exceso de oferta de dinero, que empuja r a la baja. <span class=\"hl\">La curva LM se desplaza a la derecha<\/span>.<\/li>\n<li>El menor tipo de interés eleva el consumo y la inversión y desplaza la demanda agregada hacia arriba, de DA a DA′. La producción aumenta hasta Y<sub>2<\/sub>, y la curva IS corta a LM′ en el punto 2, el nuevo equilibrio de r e Y.<\/li>\n<li>En el mercado de divisas, los activos nacionales rinden ahora menos: los inversores llevan fondos al exterior, la oferta de moneda nacional aumenta y <span class=\"hl\">la moneda nacional se deprecia<\/span>.<\/li><\/ol><\/div><\/div>\n[[fig:mp_fx]]"},{"s":6,"t":{"en":"A Productivity Shock","es":"Una perturbación de productividad"},"en":"<div class=\"blk\"><div class=\"bt\">More transactions in the economy<\/div><div class=\"bb\"><ul>\n<li>Suppose there is a positive <b>productivity shock<\/b>, for example from the use of AI.<\/li>\n<li>Aggregate demand shifts up and Y rises to Y<sub>2<\/sub> (graph 1).<\/li>\n<li>More transactions need more money: the money demand curve shifts to the right and crosses the fixed money supply at a higher point, E<sub>2<\/sub>. The interest rate rises from r<sub>1<\/sub> to r<sub>2<\/sub> because of the excess demand for money (graph 2).<\/li>\n<li>In the IS–LM graph, the IS curve shifts to the right and the economy <span class=\"bl\">moves along the LM curve<\/span> to E<sub>2<\/sub> (graph 3).<\/li>\n<li>In the forex market both curves shift: the shock raises exports and the higher interest rate attracts capital, so the demand for the domestic currency rises more than its supply, which grows with imports. <span class=\"hl\">The domestic currency appreciates<\/span> (graph 4).<\/li><\/ul><\/div><\/div>\n[[fig:prod]]","es":"<div class=\"blk\"><div class=\"bt\">Más transacciones en la economía<\/div><div class=\"bb\"><ul>\n<li>Supongamos una <b>perturbación positiva de productividad<\/b>, por ejemplo por el uso de la IA.<\/li>\n<li>La demanda agregada se desplaza hacia arriba e Y aumenta hasta Y<sub>2<\/sub> (gráfico 1).<\/li>\n<li>Más transacciones necesitan más dinero: la curva de demanda de dinero se desplaza a la derecha y corta a la oferta monetaria fija en un punto más alto, E<sub>2<\/sub>. El tipo de interés sube de r<sub>1<\/sub> a r<sub>2<\/sub> por el exceso de demanda de dinero (gráfico 2).<\/li>\n<li>En el gráfico IS-LM, la curva IS se desplaza a la derecha y la economía <span class=\"bl\">se mueve a lo largo de la curva LM<\/span> hasta E<sub>2<\/sub> (gráfico 3).<\/li>\n<li>En el mercado de divisas se desplazan las dos curvas: la perturbación eleva las exportaciones y el tipo de interés más alto atrae capital, de modo que la demanda de moneda nacional aumenta más que su oferta, que crece con las importaciones. <span class=\"hl\">La moneda nacional se aprecia<\/span> (gráfico 4).<\/li><\/ul><\/div><\/div>\n[[fig:prod]]"},{"s":7,"t":{"en":"The Liquidity Trap","es":"La trampa de liquidez"},"en":"<div class=\"blk\"><div class=\"bt\">When monetary policy is ineffective<\/div><div class=\"bb\"><ol type=\"A\">\n<li>First described by J. M. Keynes. In a liquidity trap, <span class=\"hl\">people avoid bonds and keep their funds in cash, because the return on bonds is very low<\/span>.<\/li>\n<li>The central bank cannot lower r any further, so its efforts to spur economic activity no longer encourage investors and consumers.<\/li>\n<li>The problem appears in long crises, such as Japan in the 1990s or Europe after 2008: r falls step by step until it reaches its limit, zero. If the crisis gets worse, monetary policy cannot do more.<\/li>\n<li><b>People become indifferent between bonds and cash.<\/b><\/li>\n<li>The remaining option is a <span class=\"hl\">fiscal stimulus<\/span>.<\/li><\/ol><\/div><\/div>","es":"<div class=\"blk\"><div class=\"bt\">Cuando la política monetaria es ineficaz<\/div><div class=\"bb\"><ol type=\"A\">\n<li>La describió por primera vez J. M. Keynes. En una trampa de liquidez, <span class=\"hl\">la gente evita los bonos y mantiene sus fondos en efectivo, porque la rentabilidad de los bonos es muy baja<\/span>.<\/li>\n<li>El banco central no puede bajar más r, de modo que sus esfuerzos por estimular la actividad ya no animan a inversores ni a consumidores.<\/li>\n<li>El problema aparece en las crisis largas, como la de Japón en los años noventa o la de Europa después de 2008: r baja paso a paso hasta llegar a su límite, cero. Si la crisis empeora, la política monetaria no puede hacer más.<\/li>\n<li><b>La gente se vuelve indiferente entre bonos y efectivo.<\/b><\/li>\n<li>La opción que queda es un <span class=\"hl\">estímulo fiscal<\/span>.<\/li><\/ol><\/div><\/div>"},{"s":7,"t":{"en":"The Liquidity Trap in the Graphs","es":"La trampa de liquidez en los gráficos"},"en":"<div class=\"blk\"><div class=\"bb\"><ul>\n<li><b>Money market<\/b>: at an interest rate close to zero, money demand becomes flat. A larger money supply, from M<sup>S<\/sup> to M<sup>S′<\/sup>, is simply held as money, and r does not fall.<\/li>\n<li><b>IS–LM<\/b>: the LM curve has a flat segment at r ≈ 0. A monetary expansion shifts LM to LM′, but if the IS curve crosses the flat segment, income does not change.<\/li>\n<li>A <b>fiscal expansion<\/b> shifts the IS curve to IS′ and raises income from Y<sub>1<\/sub> to Y<sub>2<\/sub> without any rise in the interest rate.<\/li><\/ul><\/div><\/div>\n[[fig:liq]]","es":"<div class=\"blk\"><div class=\"bb\"><ul>\n<li><b>Mercado de dinero<\/b>: con un tipo de interés cercano a cero, la demanda de dinero se vuelve plana. Una oferta monetaria mayor, de M<sup>S<\/sup> a M<sup>S′<\/sup>, simplemente se mantiene como dinero, y r no baja.<\/li>\n<li><b>IS-LM<\/b>: la curva LM tiene un tramo plano en r ≈ 0. Una expansión monetaria desplaza LM a LM′, pero si la curva IS corta el tramo plano, la renta no cambia.<\/li>\n<li>Una <b>expansión fiscal<\/b> desplaza la curva IS a IS′ y eleva la renta de Y<sub>1<\/sub> a Y<sub>2<\/sub> sin que suba el tipo de interés.<\/li><\/ul><\/div><\/div>\n[[fig:liq]]"},{"s":7,"t":{"en":"Real Data: Policy Rates and the Zero Bound, 2000–2026","es":"Datos reales: tipos oficiales y el límite cero, 2000–2026"},"en":"<div class=\"two wide-l\"><div>[[fig:d_rates]]<p class=\"datasrc\">Sources: Federal Reserve, FOMC statements; ECB, key interest rates; Bank of Japan, monetary policy releases.<\/p>[[data:d_rates]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the data show<\/div><div class=\"bb\"><ul>\n<li>Central banks set a short-term interest rate and supply the money it requires; in the money market graph this is a change in M<sup>S<\/sup> that moves r.<\/li>\n<li><b>Japan<\/b>: the call rate has been at or close to zero for most of the time since 1999, and from February 2016 to March 2024 the Bank of Japan applied −0.1% to part of the banks' reserves: the clearest case of a liquidity trap.<\/li>\n<li><b>Euro area<\/b>: the deposit facility rate was zero or negative from July 2012 to September 2022 and reached −0.50% in 2019.<\/li>\n<li><b>United States<\/b>: the Fed kept its target range at 0–0.25% from December 2008 to December 2015 and from March 2020 to March 2022.<\/li>\n<li>When inflation rose, the Fed took its range to 5.25–5.50% (July 2023) and the ECB its rate to 4.00% (September 2023). In September 2026 the rates were 3.75–4.00% (Fed), 2.50% (ECB) and 1.25% (Bank of Japan).<\/li><\/ul><\/div><\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_rates]]<p class=\"datasrc\">Fuentes: Reserva Federal, comunicados del FOMC; BCE, tipos de interés oficiales; Banco de Japón, comunicados de política monetaria.<\/p>[[data:d_rates]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestran los datos<\/div><div class=\"bb\"><ul>\n<li>Los bancos centrales fijan un tipo de interés a corto plazo y suministran el dinero que exige; en el gráfico del mercado de dinero es un cambio de M<sup>S<\/sup> que mueve r.<\/li>\n<li><b>Japón<\/b>: el tipo call ha estado en cero o cerca de cero la mayor parte del tiempo desde 1999, y de febrero de 2016 a marzo de 2024 el Banco de Japón aplicó un −0,1% a parte de las reservas de los bancos: el caso más claro de trampa de liquidez.<\/li>\n<li><b>Zona del euro<\/b>: la facilidad de depósito estuvo en cero o en negativo de julio de 2012 a septiembre de 2022 y llegó al −0,50% en 2019.<\/li>\n<li><b>Estados Unidos<\/b>: la Fed mantuvo su banda en 0–0,25% de diciembre de 2008 a diciembre de 2015 y de marzo de 2020 a marzo de 2022.<\/li>\n<li>Cuando subió la inflación, la Fed llevó su banda al 5,25–5,50% (julio de 2023) y el BCE su tipo al 4,00% (septiembre de 2023). En septiembre de 2026 los tipos eran 3,75–4,00% (Fed), 2,50% (BCE) y 1,25% (Banco de Japón).<\/li><\/ul><\/div><\/div><\/div><\/div>","data":true},{"s":8,"t":{"en":"The Balance of Payments and the BP Curve","es":"La balanza de pagos y la curva BP"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Concepts<\/div><div class=\"bb\"><ol type=\"A\">\n<li>The balance of payments records the money entering a country minus the money leaving it, and it affects the exchange rate.<\/li>\n<li><span class=\"hl\">The BP curve shows the combinations of income and interest rate for which the current account (CA) and the financial account (FA) offset each other<\/span>: if imports increase, they must be financed by capital inflows in the financial account.<\/li>\n<li>Along the curve, the net exports that go with each level of income are matched by the net capital flows that go with each interest rate.<\/li><\/ol>\n<div class=\"eq\">BP = CA + FA = 0<\/div><\/div><\/div><\/div>\n<div>[[fig:bp_basic]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Conceptos<\/div><div class=\"bb\"><ol type=\"A\">\n<li>La balanza de pagos registra el dinero que entra en un país menos el que sale, y afecta al tipo de cambio.<\/li>\n<li><span class=\"hl\">La curva BP muestra las combinaciones de renta y tipo de interés para las que la cuenta corriente (CC) y la cuenta financiera (CF) se compensan<\/span>: si aumentan las importaciones, hay que financiarlas con entradas de capital en la cuenta financiera.<\/li>\n<li>A lo largo de la curva, las exportaciones netas que corresponden a cada nivel de renta se compensan con los flujos netos de capital que corresponden a cada tipo de interés.<\/li><\/ol>\n<div class=\"eq\">BP = CC + CF = 0<\/div><\/div><\/div><\/div>\n<div>[[fig:bp_basic]]<\/div><\/div>"},{"s":8,"t":{"en":"The BP Curve: Basic Setup","es":"La curva BP: planteamiento básico"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Behavioral functions<\/div><div class=\"bb\"><ol type=\"A\">\n<li><b>Imports<\/b>: <div class=\"eq\">M = @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>}<\/div> where 0 &lt; m<sub>1<\/sub> &lt; 1 is the marginal propensity to import.<\/li>\n<li><b>Exports<\/b>: <div class=\"eq\">X = xY*·ER<sub>0<\/sub><\/div> where x &gt; 0 is the export coefficient and Y* is foreign income.<\/li>\n<li><b>Financial account<\/b>: <div class=\"eq\">FA = f(r − r*)<\/div> where f &gt; 0 is the capital mobility coefficient and r* is the foreign interest rate.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Balance of payments<\/div><div class=\"bb\">\n<div class=\"eq\">BP = CA + FA<\/div>\n<div class=\"eq\">BP = @u{xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>}}{current account} + @u{f(r − r*)}{financial account}<\/div>\n<p><b>External equilibrium<\/b>: BP = 0.<\/p><\/div><\/div>\n<div class=\"assume\">ER<sub>0<\/sub> is the price of the foreign currency in units of the domestic currency: a rise in ER<sub>0<\/sub> is a depreciation of the domestic currency, which raises exports and lowers imports.<\/div><\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Funciones de comportamiento<\/div><div class=\"bb\"><ol type=\"A\">\n<li><b>Importaciones<\/b>: <div class=\"eq\">M = @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>}<\/div> donde 0 &lt; m<sub>1<\/sub> &lt; 1 es la propensión marginal a importar.<\/li>\n<li><b>Exportaciones<\/b>: <div class=\"eq\">X = xY*·ER<sub>0<\/sub><\/div> donde x &gt; 0 es el coeficiente de exportaciones e Y* es la renta extranjera.<\/li>\n<li><b>Cuenta financiera<\/b>: <div class=\"eq\">CF = f(r − r*)<\/div> donde f &gt; 0 es el coeficiente de movilidad del capital y r* es el tipo de interés extranjero.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Balanza de pagos<\/div><div class=\"bb\">\n<div class=\"eq\">BP = CC + CF<\/div>\n<div class=\"eq\">BP = @u{xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>}}{cuenta corriente} + @u{f(r − r*)}{cuenta financiera}<\/div>\n<p><b>Equilibrio externo<\/b>: BP = 0.<\/p><\/div><\/div>\n<div class=\"assume\">ER<sub>0<\/sub> es el precio de la moneda extranjera en unidades de moneda nacional: una subida de ER<sub>0<\/sub> es una depreciación de la moneda nacional, que eleva las exportaciones y reduce las importaciones.<\/div><\/div><\/div>"},{"s":8,"t":{"en":"The BP Curve: Derivation","es":"La curva BP: derivación"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Solving for r<\/div><div class=\"bb\">\n<p>Start from BP = 0:<\/p><div class=\"eq\">xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>} + f(r − r*) = 0<\/div>\n<p>Isolate the capital flows:<\/p><div class=\"eq\">f(r − r*) = @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>} − xY*·ER<sub>0<\/sub><\/div>\n<p>Solve for the interest differential:<\/p><div class=\"eq\">r − r* = @f{m<sub>1<\/sub>Y}{f·ER<sub>0<\/sub>} − @f{xY*·ER<sub>0<\/sub>}{f}<\/div>\n<p>Factor out m<sub>1<\/sub>/f:<\/p><div class=\"eq\"><span class=\"bl\">r − r* = @f{m<sub>1<\/sub>}{f} (@f{Y}{ER<sub>0<\/sub>} − @f{x}{m<sub>1<\/sub>} Y*·ER<sub>0<\/sub>)<\/span><\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">The BP slope<\/div><div class=\"bb\">\n<p>Taking the derivative with respect to Y:<\/p>\n<div class=\"eq\"><span class=\"hl\">@f{∂r}{∂Y} = @f{m<sub>1<\/sub>}{f·ER<sub>0<\/sub>} &gt; 0<\/span><\/div>\n<ul><li>Numerator: m<sub>1<\/sub> &gt; 0.<\/li><li>Denominator: f·ER<sub>0<\/sub> &gt; 0.<\/li><li>Therefore the slope is positive.<\/li><\/ul>\n<p><b>Economic meaning<\/b>:<\/p>\n<div class=\"eq\">slope = @f{sensitivity of the CA to Y}{capital mobility × ER}<\/div><\/div><\/div><\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Despejar r<\/div><div class=\"bb\">\n<p>Partimos de BP = 0:<\/p><div class=\"eq\">xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>} + f(r − r*) = 0<\/div>\n<p>Aislamos los flujos de capital:<\/p><div class=\"eq\">f(r − r*) = @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>} − xY*·ER<sub>0<\/sub><\/div>\n<p>Despejamos el diferencial de tipos de interés:<\/p><div class=\"eq\">r − r* = @f{m<sub>1<\/sub>Y}{f·ER<sub>0<\/sub>} − @f{xY*·ER<sub>0<\/sub>}{f}<\/div>\n<p>Sacamos factor común m<sub>1<\/sub>/f:<\/p><div class=\"eq\"><span class=\"bl\">r − r* = @f{m<sub>1<\/sub>}{f} (@f{Y}{ER<sub>0<\/sub>} − @f{x}{m<sub>1<\/sub>} Y*·ER<sub>0<\/sub>)<\/span><\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">La pendiente de la BP<\/div><div class=\"bb\">\n<p>Derivando respecto a Y:<\/p>\n<div class=\"eq\"><span class=\"hl\">@f{∂r}{∂Y} = @f{m<sub>1<\/sub>}{f·ER<sub>0<\/sub>} &gt; 0<\/span><\/div>\n<ul><li>Numerador: m<sub>1<\/sub> &gt; 0.<\/li><li>Denominador: f·ER<sub>0<\/sub> &gt; 0.<\/li><li>Por tanto, la pendiente es positiva.<\/li><\/ul>\n<p><b>Significado económico<\/b>:<\/p>\n<div class=\"eq\">pendiente = @f{sensibilidad de la CC a Y}{movilidad del capital × ER}<\/div><\/div><\/div><\/div><\/div>"},{"s":8,"t":{"en":"The BP Equation and the Interest-Rate Differential","es":"La ecuación BP y el diferencial de tipos de interés"},"en":"<div class=\"blk\"><div class=\"bt\">The fundamental relationship<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"bl\">r = r* + @f{m<sub>1<\/sub>}{f} (@f{Y}{ER<sub>0<\/sub>} − @f{x}{m<sub>1<\/sub>} Y*·ER<sub>0<\/sub>)<\/span><\/div>\n<p style=\"text-align:center\">Domestic rate = foreign rate + an adjustment for the trade imbalance<\/p><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">The trade-imbalance term, ΔPPP<\/div><div class=\"bb\">\n<div class=\"eq\">ΔPPP = @f{Y}{ER<sub>0<\/sub>} − @f{x}{m<sub>1<\/sub>} Y*·ER<sub>0<\/sub> = @f{M − X}{m<sub>1<\/sub>}<\/div>\n<ul><li>ΔPPP = 0: balanced trade → r = r*.<\/li>\n<li>ΔPPP &gt; 0: current account deficit → the economy needs r &gt; r* to attract the capital that finances it.<\/li>\n<li>ΔPPP &lt; 0: current account surplus → the economy can have r &lt; r*.<\/li><\/ul>\n<p>The interest differential is r − r* = (m<sub>1<\/sub>/f)·ΔPPP: the larger the trade imbalance and the lower capital mobility, the larger the differential.<\/p><\/div><\/div>","es":"<div class=\"blk\"><div class=\"bt\">La relación fundamental<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"bl\">r = r* + @f{m<sub>1<\/sub>}{f} (@f{Y}{ER<sub>0<\/sub>} − @f{x}{m<sub>1<\/sub>} Y*·ER<sub>0<\/sub>)<\/span><\/div>\n<p style=\"text-align:center\">Tipo nacional = tipo extranjero + un ajuste por el desequilibrio comercial<\/p><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">El término de desequilibrio comercial, ΔPPP<\/div><div class=\"bb\">\n<div class=\"eq\">ΔPPP = @f{Y}{ER<sub>0<\/sub>} − @f{x}{m<sub>1<\/sub>} Y*·ER<sub>0<\/sub> = @f{M − X}{m<sub>1<\/sub>}<\/div>\n<ul><li>ΔPPP = 0: comercio equilibrado → r = r*.<\/li>\n<li>ΔPPP &gt; 0: déficit por cuenta corriente → la economía necesita r &gt; r* para atraer el capital que lo financia.<\/li>\n<li>ΔPPP &lt; 0: superávit por cuenta corriente → la economía puede tener r &lt; r*.<\/li><\/ul>\n<p>El diferencial de tipos es r − r* = (m<sub>1<\/sub>/f)·ΔPPP: cuanto mayor es el desequilibrio comercial y menor la movilidad del capital, mayor es el diferencial.<\/p><\/div><\/div>"},{"s":8,"t":{"en":"Real Data: Current Account Balances, 2000–2025","es":"Datos reales: saldos por cuenta corriente, 2000–2025"},"en":"<div class=\"two wide-l\"><div>[[fig:d_ca]]<p class=\"datasrc\">Source: World Bank, World Development Indicators (BN.CAB.XOKA.GD.ZS), October 2026.<\/p>[[data:d_ca]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the data show<\/div><div class=\"bb\"><ul>\n<li>The BP equation links the current account to the interest differential, r − r* = (m<sub>1<\/sub>/f)·ΔPPP: a surplus, ΔPPP &lt; 0, allows r &lt; r*; a deficit needs r &gt; r* to attract the capital that finances it.<\/li>\n<li><b>Surpluses<\/b>: Germany every year since 2002, with a peak of 8.9% of GDP in 2016; China every year since 2000, with a peak of 9.8% in 2007.<\/li>\n<li><b>Deficits<\/b>: the United States every year since 2000, 3.8% of GDP in 2025. In 2025 the Fed's rate was [[emp:gap:2]] points above the ECB's while the euro area had a surplus of 1.6% of GDP: r &gt; r* seen from the United States, r &lt; r* seen from the euro area.<\/li>\n<li><b>Spain<\/b> went from a deficit of 9.4% of GDP in 2007 to a surplus from 2012: when private capital stopped flowing in, the deficit could no longer be financed (see “Real Data: Spain's Sudden Stop”).<\/li>\n<li>From year to year the link is loose: capital flows also respond to growth prospects, risk and saving decisions, which in the model shift the BP curve.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">BP = CA + FA = 0: a surplus on one account is matched by a deficit on the other.<\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_ca]]<p class=\"datasrc\">Fuente: Banco Mundial, World Development Indicators (BN.CAB.XOKA.GD.ZS), octubre de 2026.<\/p>[[data:d_ca]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestran los datos<\/div><div class=\"bb\"><ul>\n<li>La ecuación BP relaciona la cuenta corriente con el diferencial de tipos, r − r* = (m<sub>1<\/sub>/f)·ΔPPP: un superávit, ΔPPP &lt; 0, permite r &lt; r*; un déficit exige r &gt; r* para atraer el capital que lo financia.<\/li>\n<li><b>Superávits<\/b>: Alemania todos los años desde 2002, con un máximo del 8,9% del PIB en 2016; China todos los años desde 2000, con un máximo del 9,8% en 2007.<\/li>\n<li><b>Déficits<\/b>: Estados Unidos todos los años desde 2000, un 3,8% del PIB en 2025. En 2025 el tipo de la Fed estaba [[emp:gap:2]] puntos por encima del del BCE mientras la zona del euro tenía un superávit del 1,6% del PIB: r &gt; r* visto desde Estados Unidos, r &lt; r* visto desde la zona del euro.<\/li>\n<li><b>España<\/b> pasó de un déficit del 9,4% del PIB en 2007 a un superávit desde 2012: cuando el capital privado dejó de entrar, el déficit ya no podía financiarse (véase «Datos reales: la parada súbita de España»).<\/li>\n<li>De un año a otro la relación es débil: los flujos de capital también responden a las perspectivas de crecimiento, al riesgo y a las decisiones de ahorro, que en el modelo desplazan la curva BP.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">BP = CC + CF = 0: el superávit de una cuenta se compensa con el déficit de la otra.<\/div><\/div><\/div>","data":true},{"s":9,"t":{"en":"The BP Slope: m<sub>1<\/sub>/f","es":"La pendiente de la BP: m<sub>1<\/sub>/f"},"en":"<div class=\"blk\"><div class=\"bt\">What does the slope mean?<\/div><div class=\"bb\">\n<div class=\"eq\">@f{∂r}{∂Y} = @f{m<sub>1<\/sub>}{f} &emsp; (with ER<sub>0<\/sub> = 1)<\/div>\n<p style=\"text-align:center\">How much the interest rate must rise when income increases<\/p><\/div><\/div>\n<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Component: m<sub>1<\/sub><\/div><div class=\"bb\"><b>Marginal propensity to import<\/b><ul>\n<li>How sensitive imports are to Y.<\/li><li>Higher m<sub>1<\/sub> → steeper BP.<\/li><li>More imports for each ΔY.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div
