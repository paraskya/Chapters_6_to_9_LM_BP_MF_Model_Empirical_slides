class=\"bt\">Component: f<\/div><div class=\"bb\"><b>Capital mobility<\/b><ul>\n<li>How much capital responds to Δr.<\/li><li>Higher f → flatter BP.<\/li><li>More capital for each Δr.<\/li><\/ul><\/div><\/div><\/div>\n<div>[[fig:bp_rot]]<\/div><\/div>","es":"<div class=\"blk\"><div class=\"bt\">¿Qué significa la pendiente?<\/div><div class=\"bb\">\n<div class=\"eq\">@f{∂r}{∂Y} = @f{m<sub>1<\/sub>}{f} &emsp; (con ER<sub>0<\/sub> = 1)<\/div>\n<p style=\"text-align:center\">Cuánto debe subir el tipo de interés cuando aumenta la renta<\/p><\/div><\/div>\n<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Componente: m<sub>1<\/sub><\/div><div class=\"bb\"><b>Propensión marginal a importar<\/b><ul>\n<li>Mide la sensibilidad de las importaciones a Y.<\/li><li>Una m<sub>1<\/sub> mayor → BP más inclinada.<\/li><li>Más importaciones por cada ΔY.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Componente: f<\/div><div class=\"bb\"><b>Movilidad del capital<\/b><ul>\n<li>Cuánto responde el capital a Δr.<\/li><li>Una f mayor → BP más plana.<\/li><li>Más capital por cada Δr.<\/li><\/ul><\/div><\/div><\/div>\n<div>[[fig:bp_rot]]<\/div><\/div>"},{"s":9,"t":{"en":"Capital Mobility: Four Cases","es":"Movilidad del capital: cuatro casos"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Four scenarios<\/div><div class=\"bb\"><ol>\n<li><b>Perfect mobility<\/b> (f → ∞): ∂r/∂Y → 0. The BP curve is horizontal at r = r*: a tiny Δr causes unlimited capital flows.<\/li>\n<li><b>High mobility<\/b> (large f): the slope is small. The BP curve is relatively flat: a small Δr causes large capital flows.<\/li>\n<li><b>Low mobility<\/b> (small f): the slope is large. The BP curve is relatively steep: a large Δr is needed for external equilibrium.<\/li>\n<li><b>Zero mobility<\/b> (f = 0): ∂r/∂Y → ∞. The BP curve is vertical at Y<sub>TB<\/sub>: the interest rate cannot attract capital, and only a change in income, for example through fiscal policy, restores external equilibrium.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:bp_mob]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Cuatro escenarios<\/div><div class=\"bb\"><ol>\n<li><b>Movilidad perfecta<\/b> (f → ∞): ∂r/∂Y → 0. La curva BP es horizontal en r = r*: un Δr mínimo provoca flujos de capital ilimitados.<\/li>\n<li><b>Movilidad alta<\/b> (f grande): la pendiente es pequeña. La curva BP es relativamente plana: un Δr pequeño provoca grandes flujos de capital.<\/li>\n<li><b>Movilidad baja<\/b> (f pequeña): la pendiente es grande. La curva BP es relativamente inclinada: hace falta un Δr grande para el equilibrio externo.<\/li>\n<li><b>Movilidad nula<\/b> (f = 0): ∂r/∂Y → ∞. La curva BP es vertical en Y<sub>TB<\/sub>: el tipo de interés no puede atraer capital, y solo un cambio de la renta, por ejemplo mediante la política fiscal, restablece el equilibrio externo.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:bp_mob]]<\/div><\/div>"},{"s":9,"t":{"en":"The Role of Capital Mobility (f)","es":"El papel de la movilidad del capital (f)"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">High capital mobility (large f)<\/div><div class=\"bb\">\n<p><b>Characteristics<\/b><\/p><ul><li>Flat BP curve.<\/li><li>A small Δr moves a lot of capital.<\/li><\/ul>\n<p><b>Exchange-rate effect<\/b><\/p><ul><li>Strong exchange-rate adjustment.<\/li><li>Quick response to shocks.<\/li><\/ul>\n<p><b>Example<\/b>: developed economies with open capital markets.<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Low capital mobility (small f)<\/div><div class=\"bb\">\n<p><b>Characteristics<\/b><\/p><ul><li>Steep BP curve.<\/li><li>A large Δr moves little capital.<\/li><\/ul>\n<p><b>Exchange-rate effect<\/b><\/p><ul><li>Weak exchange-rate adjustment.<\/li><li>Slow response to shocks.<\/li><\/ul>\n<p><b>Example<\/b>: emerging markets and economies with capital controls.<\/p><\/div><\/div><\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Alta movilidad del capital (f grande)<\/div><div class=\"bb\">\n<p><b>Características<\/b><\/p><ul><li>Curva BP plana.<\/li><li>Un Δr pequeño mueve mucho capital.<\/li><\/ul>\n<p><b>Efecto sobre el tipo de cambio<\/b><\/p><ul><li>Ajuste intenso del tipo de cambio.<\/li><li>Respuesta rápida a las perturbaciones.<\/li><\/ul>\n<p><b>Ejemplo<\/b>: economías desarrolladas con mercados de capitales abiertos.<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Baja movilidad del capital (f pequeña)<\/div><div class=\"bb\">\n<p><b>Características<\/b><\/p><ul><li>Curva BP inclinada.<\/li><li>Un Δr grande mueve poco capital.<\/li><\/ul>\n<p><b>Efecto sobre el tipo de cambio<\/b><\/p><ul><li>Ajuste débil del tipo de cambio.<\/li><li>Respuesta lenta a las perturbaciones.<\/li><\/ul>\n<p><b>Ejemplo<\/b>: mercados emergentes y economías con controles de capital.<\/p><\/div><\/div><\/div><\/div>"},{"s":9,"t":{"en":"The BP Slope: Economic Interpretation","es":"La pendiente de la BP: interpretación económica"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Sensitivity of the financial account<\/div><div class=\"bb\"><ol>\n<li><span class=\"bl\">Very high sensitivity<\/span>: an almost zero change in r causes huge capital flows. A large rise in Y, and with it a large worsening of the current account, is financed with almost no change in r: the curve is nearly flat.<\/li>\n<li><span class=\"gn\">High sensitivity<\/span>: a change in r moves a lot of capital, so a moderate rise in r finances the extra imports of a sizeable rise in Y: the curve is flat.<\/li>\n<li><span class=\"hl\">Low sensitivity<\/span>: capital flows change little when r changes, so the same rise in Y needs a large rise in r: the curve is steep.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"eq\">BP = X(Y*, ER) − M(Y, @f{1}{ER}) + f(r − r*)<\/div>[[fig:bp_interp]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Sensibilidad de la cuenta financiera<\/div><div class=\"bb\"><ol>\n<li><span class=\"bl\">Sensibilidad muy alta<\/span>: un cambio casi nulo de r provoca enormes flujos de capital. Un gran aumento de Y, y con él un gran empeoramiento de la cuenta corriente, se financia casi sin cambiar r: la curva es casi plana.<\/li>\n<li><span class=\"gn\">Sensibilidad alta<\/span>: un cambio de r mueve mucho capital, de modo que una subida moderada de r financia las importaciones adicionales de un aumento considerable de Y: la curva es plana.<\/li>\n<li><span class=\"hl\">Sensibilidad baja<\/span>: los flujos de capital cambian poco cuando cambia r, de modo que el mismo aumento de Y necesita una gran subida de r: la curva es inclinada.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"eq\">BP = X(Y*, ER) − M(Y, @f{1}{ER}) + f(r − r*)<\/div>[[fig:bp_interp]]<\/div><\/div>"},{"s":10,"t":{"en":"Reading the BP Curve: Surplus and Deficit","es":"Leer la curva BP: superávit y déficit"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">The BP curve<\/div><div class=\"bb\"><ol type=\"A\">\n<li>Any point <b>above (to the left of)<\/b> the curve implies a <span class=\"bl\">balance of payments surplus<\/span>.<\/li>\n<li>Any point <b>below (to the right of)<\/b> the curve implies a <span class=\"hl\">balance of payments deficit<\/span>.<\/li>\n<li>If Y = Y<sub>TB<\/sub>, then CA = 0 (X − M = 0); on the curve FA = 0 as well, and r − r* = 0.<\/li>\n<li>In general, the curve is the set of points where\n<div class=\"eq\">X(Y*, ER) − M(Y, @f{1}{ER}) + f(r − r*) = 0<\/div><\/li><\/ol><\/div><\/div><\/div>\n<div><p class=\"bl\">What happens if the IS–LM equilibrium lies on one side or the other of the BP curve?<\/p>[[fig:bp_regions]]\n<details class=\"sol\"><summary><span class=\"s-closed\">Show the answer<\/span><span class=\"s-open\">Hide the answer<\/span><\/summary>\n<ul><li>An equilibrium above the BP curve: the interest rate attracts more capital than the current account needs, BP &gt; 0, and the domestic currency tends to appreciate.<\/li>\n<li>An equilibrium below the BP curve: the interest rate is too low for that income, BP &lt; 0, and the domestic currency tends to depreciate.<\/li><\/ul><\/details><\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">La curva BP<\/div><div class=\"bb\"><ol type=\"A\">\n<li>Cualquier punto <b>por encima (a la izquierda)<\/b> de la curva implica un <span class=\"bl\">superávit de la balanza de pagos<\/span>.<\/li>\n<li>Cualquier punto <b>por debajo (a la derecha)<\/b> de la curva implica un <span class=\"hl\">déficit de la balanza de pagos<\/span>.<\/li>\n<li>Si Y = Y<sub>TB<\/sub>, entonces CC = 0 (X − M = 0); sobre la curva también CF = 0, y r − r* = 0.<\/li>\n<li>En general, la curva es el conjunto de puntos en los que\n<div class=\"eq\">X(Y*, ER) − M(Y, @f{1}{ER}) + f(r − r*) = 0<\/div><\/li><\/ol><\/div><\/div><\/div>\n<div><p class=\"bl\">¿Qué ocurre si el equilibrio IS-LM está a un lado u otro de la curva BP?<\/p>[[fig:bp_regions]]\n<details class=\"sol\"><summary><span class=\"s-closed\">Mostrar la respuesta<\/span><span class=\"s-open\">Ocultar la respuesta<\/span><\/summary>\n<ul><li>Un equilibrio por encima de la curva BP: el tipo de interés atrae más capital del que necesita la cuenta corriente, BP &gt; 0, y la moneda nacional tiende a apreciarse.<\/li>\n<li>Un equilibrio por debajo de la curva BP: el tipo de interés es demasiado bajo para esa renta, BP &lt; 0, y la moneda nacional tiende a depreciarse.<\/li><\/ul><\/details><\/div><\/div>"},{"s":10,"t":{"en":"Points On and Off the BP Curve","es":"Puntos sobre la curva BP y fuera de ella"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Points TB, A, B, C and D<\/div><div class=\"bb\"><p class=\"hl\">Points below and to the right of the BP curve are deficits: the interest rate is too low and capital leaves the country.<\/p><ol type=\"A\">\n<li><b>TB<\/b>: trade balance, X = M, so CA = 0. For BP = 0 the financial account must be zero too, which requires r = r*: the pair (Y<sub>TB<\/sub>, r<sub>TB<\/sub>), with r<sub>TB<\/sub> = r*, guarantees BP = 0.<\/li>\n<li><b>A<\/b>: income Y<sub>TB<\/sub> and r<sub>A<\/sub> &gt; r<sub>TB<\/sub>. CA = 0, and the higher domestic rate attracts capital: FA &gt; 0, so <span class=\"bl\">BP &gt; 0<\/span>.<\/li>\n<li><b>B<\/b>: income Y<sub>TB<\/sub> and r<sub>B<\/sub> &lt; r<sub>TB<\/sub>. CA = 0, but r &lt; r* causes capital outflows: FA &lt; 0, so <span class=\"hl\">BP &lt; 0<\/span>. A higher r is needed.<\/li>\n<li><b>C<\/b>: income Y<sub>C<\/sub> &gt; Y<sub>TB<\/sub> and r<sub>C<\/sub>. The higher income raises imports and creates a current account deficit, and r<sub>C<\/sub> is not high enough to bring in the capital that would finance it: <span class=\"hl\">BP &lt; 0<\/span>. Extend a vertical line from C up to the BP curve to find the rate that is needed.<\/li>\n<li><b>D<\/b>: income Y<sub>D<\/sub> ≠ Y<sub>TB<\/sub>, on the curve. CA ≠ 0, but r<sub>D<\/sub> brings exactly the capital flows that offset it, so BP = 0.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:bp_points]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Puntos TB, A, B, C y D<\/div><div class=\"bb\"><p class=\"hl\">Los puntos por debajo y a la derecha de la curva BP son déficits: el tipo de interés es demasiado bajo y el capital sale del país.<\/p><ol type=\"A\">\n<li><b>TB<\/b>: equilibrio comercial, X = M, de modo que CC = 0. Para que BP = 0 la cuenta financiera también debe ser cero, lo que exige r = r*: el par (Y<sub>TB<\/sub>, r<sub>TB<\/sub>), con r<sub>TB<\/sub> = r*, garantiza BP = 0.<\/li>\n<li><b>A<\/b>: renta Y<sub>TB<\/sub> y r<sub>A<\/sub> &gt; r<sub>TB<\/sub>. CC = 0, y el tipo nacional más alto atrae capital: CF &gt; 0, de modo que <span class=\"bl\">BP &gt; 0<\/span>.<\/li>\n<li><b>B<\/b>: renta Y<sub>TB<\/sub> y r<sub>B<\/sub> &lt; r<sub>TB<\/sub>. CC = 0, pero r &lt; r* provoca salidas de capital: CF &lt; 0, de modo que <span class=\"hl\">BP &lt; 0<\/span>. Hace falta un r más alto.<\/li>\n<li><b>C<\/b>: renta Y<sub>C<\/sub> &gt; Y<sub>TB<\/sub> y r<sub>C<\/sub>. La renta mayor eleva las importaciones y crea un déficit por cuenta corriente, y r<sub>C<\/sub> no es suficientemente alto para atraer el capital que lo financiaría: <span class=\"hl\">BP &lt; 0<\/span>. Prolonga una línea vertical desde C hasta la curva BP para encontrar el tipo necesario.<\/li>\n<li><b>D<\/b>: renta Y<sub>D<\/sub> ≠ Y<sub>TB<\/sub>, sobre la curva. CC ≠ 0, pero r<sub>D<\/sub> atrae exactamente los flujos de capital que la compensan, de modo que BP = 0.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:bp_points]]<\/div><\/div>"},{"s":10,"t":{"en":"Adjustment with a Current Account Deficit","es":"Ajuste con déficit por cuenta corriente"},"en":"<div class=\"blk\"><div class=\"bt\">Starting point<\/div><div class=\"bb\">Y &gt; Y<sub>TB<\/sub>: the capacity to import exceeds the capacity to export, so ΔPPP &gt; 0.<\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">The four-step mechanism<\/div><div class=\"bb\"><ol>\n<li><b>Current account deficit<\/b>: M &gt; X and ΔPPP &gt; 0.<\/li>\n<li><b>The interest rate rises<\/b>: the economy needs r &gt; r* to attract financing. The premium is r − r* = (m<sub>1<\/sub>/f)·ΔPPP.<\/li>\n<li><b>Capital inflows<\/b>: the higher r attracts foreign capital, and the financial account surplus finances the current account deficit.<\/li>\n<li><b>The currency appreciates<\/b>: capital inflows raise the demand for the domestic currency, and ER<sub>0<\/sub> falls (appreciation). The size of the effect depends on f.<\/li><\/ol><\/div><\/div>","es":"<div class=\"blk\"><div class=\"bt\">Punto de partida<\/div><div class=\"bb\">Y &gt; Y<sub>TB<\/sub>: la capacidad de importar supera a la de exportar, de modo que ΔPPP &gt; 0.<\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">El mecanismo en cuatro pasos<\/div><div class=\"bb\"><ol>\n<li><b>Déficit por cuenta corriente<\/b>: M &gt; X y ΔPPP &gt; 0.<\/li>\n<li><b>El tipo de interés sube<\/b>: la economía necesita r &gt; r* para atraer financiación. La prima es r − r* = (m<sub>1<\/sub>/f)·ΔPPP.<\/li>\n<li><b>Entradas de capital<\/b>: el r más alto atrae capital extranjero, y el superávit de la cuenta financiera financia el déficit por cuenta corriente.<\/li>\n<li><b>La moneda se aprecia<\/b>: las entradas de capital elevan la demanda de moneda nacional, y ER<sub>0<\/sub> baja (apreciación). La intensidad del efecto depende de f.<\/li><\/ol><\/div><\/div>"},{"s":10,"t":{"en":"Adjustment with a Current Account Surplus","es":"Ajuste con superávit por cuenta corriente"},"en":"<div class=\"blk\"><div class=\"bt\">Starting point<\/div><div class=\"bb\">Y &lt; Y<sub>TB<\/sub>: the capacity to export exceeds the capacity to import, so ΔPPP &lt; 0.<\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">The four-step mechanism<\/div><div class=\"bb\"><ol>\n<li><b>Current account surplus<\/b>: X &gt; M and ΔPPP &lt; 0.<\/li>\n<li><b>The interest rate falls<\/b>: the economy can have r &lt; r*, because it does not need to attract capital. The premium, (m<sub>1<\/sub>/f)·ΔPPP, is negative.<\/li>\n<li><b>Capital outflows<\/b>: the lower r makes capital leave, and the financial account deficit offsets the current account surplus.<\/li>\n<li><b>The currency depreciates<\/b>: capital outflows raise the supply of the domestic currency, and ER<sub>0<\/sub> rises (depreciation). The size of the effect depends on f.<\/li><\/ol><\/div><\/div>","es":"<div class=\"blk\"><div class=\"bt\">Punto de partida<\/div><div class=\"bb\">Y &lt; Y<sub>TB<\/sub>: la capacidad de exportar supera a la de importar, de modo que ΔPPP &lt; 0.<\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">El mecanismo en cuatro pasos<\/div><div class=\"bb\"><ol>\n<li><b>Superávit por cuenta corriente<\/b>: X &gt; M y ΔPPP &lt; 0.<\/li>\n<li><b>El tipo de interés baja<\/b>: la economía puede tener r &lt; r*, porque no necesita atraer capital. La prima, (m<sub>1<\/sub>/f)·ΔPPP, es negativa.<\/li>\n<li><b>Salidas de capital<\/b>: el r más bajo hace salir el capital, y el déficit de la cuenta financiera compensa el superávit por cuenta corriente.<\/li>\n<li><b>La moneda se deprecia<\/b>: las salidas de capital elevan la oferta de moneda nacional, y ER<sub>0<\/sub> sube (depreciación). La intensidad del efecto depende de f.<\/li><\/ol><\/div><\/div>"},{"s":11,"t":{"en":"Three Degrees of Capital Mobility: BP and the Exchange Rate","es":"Tres grados de movilidad del capital: BP y tipo de cambio"},"en":"<div class=\"blk\"><div class=\"bt\">Changes in Y and r<\/div><div class=\"bb\">Starting from equilibrium at E<sub>1<\/sub>, an expansion raises income and the interest rate along the LM curve, to E<sub>2<\/sub>. What happens to capital flows, the balance of payments and the exchange rate depends on the slope of the BP curve compared with the slope of the LM curve.<\/div><\/div>\n<table class=\"num txt\"><tr><th>Capital mobility<\/th><th>Position of E<sub>2<\/sub><\/th><th>Balance of payments<\/th><th>Exchange rate<\/th><\/tr>\n<tr><td>Very high: BP almost flat<\/td><td>Above the BP curve<\/td><td>Surplus: capital inflows far exceed the extra imports<\/td><td>Strong appreciation<\/td><\/tr>\n<tr><td>High: BP flatter than LM<\/td><td>Above the BP curve<\/td><td>Surplus<\/td><td>Appreciation<\/td><\/tr>\n<tr><td>Low: BP steeper than LM<\/td><td>Below the BP curve<\/td><td>Deficit: capital inflows do not cover the extra imports<\/td><td>Depreciation<\/td><\/tr><\/table>\n[[fig:bp_three]]","es":"<div class=\"blk\"><div class=\"bt\">Cambios de Y y r<\/div><div class=\"bb\">Partiendo del equilibrio en E<sub>1<\/sub>, una expansión eleva la renta y el tipo de interés a lo largo de la curva LM, hasta E<sub>2<\/sub>. Lo que ocurre con los flujos de capital, la balanza de pagos y el tipo de cambio depende de la pendiente de la curva BP comparada con la de la curva LM.<\/div><\/div>\n<table class=\"num txt\"><tr><th>Movilidad del capital<\/th><th>Posición de E<sub>2<\/sub><\/th><th>Balanza de pagos<\/th><th>Tipo de cambio<\/th><\/tr>\n<tr><td>Muy alta: BP casi plana<\/td><td>Por encima de la curva BP<\/td><td>Superávit: las entradas de capital superan con creces las importaciones adicionales<\/td><td>Fuerte apreciación<\/td><\/tr>\n<tr><td>Alta: BP más plana que la LM<\/td><td>Por encima de la curva BP<\/td><td>Superávit<\/td><td>Apreciación<\/td><\/tr>\n<tr><td>Baja: BP más inclinada que la LM<\/td><td>Por debajo de la curva BP<\/td><td>Déficit: las entradas de capital no cubren las importaciones adicionales<\/td><td>Depreciación<\/td><\/tr><\/table>\n[[fig:bp_three]]"},{"s":11,"t":{"en":"Expansionary Fiscal Policy","es":"Política fiscal expansiva"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Fiscal policy, ΔG &gt; 0<\/div><div class=\"bb\"><ol>\n<li>The IS curve shifts to the right: Y and r rise along the LM curve, from E<sub>1<\/sub> to E<sub>2<\/sub>.<\/li>\n<li>The higher income raises imports and worsens the current account; the higher interest rate attracts capital and improves the financial account.<\/li>\n<li>With high capital mobility, a BP curve flatter than the LM curve, E<sub>2<\/sub> lies above the BP curve: <span class=\"bl\">surplus<\/span>, a higher demand for the domestic currency and an <span class=\"bl\">appreciation<\/span>.<\/li>\n<li>With low capital mobility, a BP curve steeper than the LM curve, E<sub>2<\/sub> lies below the BP curve: <span class=\"hl\">deficit<\/span> and <span class=\"hl\">depreciation<\/span>.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"identity\">ΔG &gt; 0 → IS shifts right → Y ↑, r ↑<br>High mobility: BP &gt; 0 → appreciation<br>Low mobility: BP &lt; 0 → depreciation<\/div><\/div><\/div>\n[[fig:fiscal]]","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Política fiscal, ΔG &gt; 0<\/div><div class=\"bb\"><ol>\n<li>La curva IS se desplaza a la derecha: Y y r suben a lo largo de la curva LM, de E<sub>1<\/sub> a E<sub>2<\/sub>.<\/li>\n<li>La renta más alta eleva las importaciones y empeora la cuenta corriente; el tipo de interés más alto atrae capital y mejora la cuenta financiera.<\/li>\n<li>Con alta movilidad del capital, una curva BP más plana que la LM, E<sub>2<\/sub> queda por encima de la curva BP: <span class=\"bl\">superávit<\/span>, mayor demanda de moneda nacional y <span class=\"bl\">apreciación<\/span>.<\/li>\n<li>Con baja movilidad del capital, una curva BP más inclinada que la LM, E<sub>2<\/sub> queda por debajo de la curva BP: <span class=\"hl\">déficit<\/span> y <span class=\"hl\">depreciación<\/span>.<\/li><\/ol><\/div><\/div><\/div>\n<div><div class=\"identity\">ΔG &gt; 0 → la IS se desplaza a la derecha → Y ↑, r ↑<br>Alta movilidad: BP &gt; 0 → apreciación<br>Baja movilidad: BP &lt; 0 → depreciación<\/div><\/div><\/div>\n[[fig:fiscal]]"},{"s":11,"t":{"en":"Shifts and Rotations of the BP Curve","es":"Desplazamientos y giros de la curva BP"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Shifts: BP moves right or down<\/div><div class=\"bb\"><ul>\n<li>Y* ↑: exports increase.<\/li>\n<li>ER<sub>0<\/sub> ↑: the depreciation helps the current account.<\/li>\n<li>r* ↓: it is easier to attract capital.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Shifts: BP moves left or up<\/div><div class=\"bb\"><ul>\n<li>Y* ↓: exports decrease.<\/li>\n<li>ER<sub>0<\/sub> ↓: the appreciation hurts the current account.<\/li>\n<li>r* ↑: it is harder to attract capital.<\/li><\/ul><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Rotations: the slope changes<\/div><div class=\"bb\"><ul>\n<li>m<sub>1<\/sub> ↑: the BP curve becomes steeper and rotates counterclockwise ↺.<\/li>\n<li>f ↑: the BP curve becomes flatter and rotates clockwise ↻ around the point (Y<sub>TB<\/sub>, r*).<\/li>\n<li>ER<sub>0<\/sub> ↑: the BP curve becomes flatter, ↻, and shifts down at the same time.<\/li><\/ul><\/div><\/div>\n<div class=\"assume\">Y*, x and r* enter only the intercept, so they shift the curve. m<sub>1<\/sub> and f change the slope, m<sub>1<\/sub>/(f·ER<sub>0<\/sub>), so they rotate it. ER<sub>0<\/sub> does both.<\/div><\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Desplazamientos: la BP se mueve a la derecha o hacia abajo<\/div><div class=\"bb\"><ul>\n<li>Y* ↑: aumentan las exportaciones.<\/li>\n<li>ER<sub>0<\/sub> ↑: la depreciación ayuda a la cuenta corriente.<\/li>\n<li>r* ↓: es más fácil atraer capital.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Desplazamientos: la BP se mueve a la izquierda o hacia arriba<\/div><div class=\"bb\"><ul>\n<li>Y* ↓: disminuyen las exportaciones.<\/li>\n<li>ER<sub>0<\/sub> ↓: la apreciación perjudica a la cuenta corriente.<\/li>\n<li>r* ↑: es más difícil atraer capital.<\/li><\/ul><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Giros: cambia la pendiente<\/div><div class=\"bb\"><ul>\n<li>m<sub>1<\/sub> ↑: la curva BP se vuelve más inclinada y gira en sentido contrario a las agujas del reloj ↺.<\/li>\n<li>f ↑: la curva BP se vuelve más plana y gira en el sentido de las agujas del reloj ↻ alrededor del punto (Y<sub>TB<\/sub>, r*).<\/li>\n<li>ER<sub>0<\/sub> ↑: la curva BP se vuelve más plana, ↻, y a la vez se desplaza hacia abajo.<\/li><\/ul><\/div><\/div>\n<div class=\"assume\">Y*, x y r* solo entran en la ordenada en el origen, de modo que desplazan la curva. m<sub>1<\/sub> y f cambian la pendiente, m<sub>1<\/sub>/(f·ER<sub>0<\/sub>), de modo que la giran. ER<sub>0<\/sub> hace las dos cosas.<\/div><\/div><\/div>"},{"s":11,"t":{"en":"What Shifts the BP Curve","es":"Qué desplaza la curva BP"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Shifting BP<\/div><div class=\"bb\">\n<div class=\"eq\">BP = X(Y*, ER) − M(Y, @f{1}{ER}) + f(r − r*)<\/div>\n<p>The BP curve shifts to the right (or down) if:<\/p>\n<ol><li>The <b>trade balance improves<\/b> because:<ul>\n<li>the nominal exchange rate depreciates and the Marshall–Lerner condition holds;<\/li>\n<li>imports fall exogenously, for example because of a tariff or an import quota;<\/li>\n<li>exports increase exogenously, for example because of a subsidy, or because income increases in the rest of the world.<\/li><\/ul><\/li>\n<li>The <b>financial account improves<\/b> because:<ul>\n<li>the interest rate in the rest of the world falls;<\/li>\n<li>there is an exogenous increase in net capital inflows.<\/li><\/ul><\/li><\/ol>\n<p>The opposite changes shift it to the left (or up).<\/p><\/div><\/div><\/div>\n<div>[[fig:bp_shift]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Desplazar la BP<\/div><div class=\"bb\">\n<div class=\"eq\">BP = X(Y*, ER) − M(Y, @f{1}{ER}) + f(r − r*)<\/div>\n<p>La curva BP se desplaza a la derecha (o hacia abajo) si:<\/p>\n<ol><li>La <b>balanza comercial mejora<\/b> porque:<ul>\n<li>el tipo de cambio nominal se deprecia y se cumple la condición de Marshall-Lerner;<\/li>\n<li>las importaciones caen de forma exógena, por ejemplo por un arancel o una cuota de importación;<\/li>\n<li>las exportaciones aumentan de forma exógena, por ejemplo por una subvención, o porque aumenta la renta en el resto del mundo.<\/li><\/ul><\/li>\n<li>La <b>cuenta financiera mejora<\/b> porque:<ul>\n<li>el tipo de interés del resto del mundo baja;<\/li>\n<li>hay un aumento exógeno de las entradas netas de capital.<\/li><\/ul><\/li><\/ol>\n<p>Los cambios contrarios la desplazan a la izquierda (o hacia arriba).<\/p><\/div><\/div><\/div>\n<div>[[fig:bp_shift]]<\/div><\/div>"},{"s":11,"t":{"en":"Real Data: Spain's Sudden Stop, 2007–2013","es":"Datos reales: la parada súbita de España, 2007–2013"},"en":"<div class=\"two wide-l\"><div>[[fig:d_es]]<p class=\"datasrc\">Sources: Eurostat (10-year government bond yields, irt_lt_mcby_a and irt_lt_mcby_m); World Bank (current account); Banco de España, annual accounts for 2007 and 2012 (TARGET position).<\/p>[[data:d_es]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the data show<\/div><div class=\"bb\"><ul>\n<li>Inside the euro area Spain had no exchange rate to defend and capital moved freely: in 2005–2007 it borrowed at almost the German rate, a spread of 0.02 to 0.09 points, while its current-account deficit reached 9.4% of GDP in 2007. In the model: a very large f and an almost flat BP curve.<\/li>\n<li>From 2010 private capital left: f fell and capital flowed out, which makes the BP curve steeper and shifts it up. The spread rose to 4.35 points in 2012 on average, and to 5.55 points in July 2012.<\/li>\n<li>Without a currency of its own to depreciate, Spain adjusted through lower income, which cut imports: the current account reached a surplus in 2012 and 2.1% of GDP in 2013.<\/li>\n<li>The balance of payments still balanced: Eurosystem financing replaced the private capital that left. The Banco de España's TARGET position went from €3.3 billion owed to the Eurosystem at the end of 2007 to €337.3 billion at the end of 2012.<\/li>\n<li>As the spread fell after 2012, from 4.35 points to 1.23 in 2015, Spain kept its surplus.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">f ↓ and capital outflows: the BP curve becomes steeper and shifts up; at the old (Y, r) the balance of payments is in deficit.<\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_es]]<p class=\"datasrc\">Fuentes: Eurostat (rentabilidad de la deuda pública a 10 años, irt_lt_mcby_a e irt_lt_mcby_m); Banco Mundial (cuenta corriente); Banco de España, cuentas anuales de 2007 y 2012 (posición TARGET).<\/p>[[data:d_es]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestran los datos<\/div><div class=\"bb\"><ul>\n<li>Dentro de la zona del euro, España no tenía tipo de cambio que defender y el capital circulaba libremente: en 2005–2007 se financiaba casi al tipo alemán, con un diferencial de 0,02 a 0,09 puntos, mientras su déficit por cuenta corriente llegaba al 9,4% del PIB en 2007. En el modelo: una f muy grande y una curva BP casi horizontal.<\/li>\n<li>Desde 2010 el capital privado salió: f cayó y salió capital, lo que hace más inclinada la curva BP y la desplaza hacia arriba. El diferencial subió a 4,35 puntos de media en 2012, y a 5,55 puntos en julio de 2012.<\/li>\n<li>Sin moneda propia que depreciar, España se ajustó con menos renta, que redujo las importaciones: la cuenta corriente alcanzó superávit en 2012 y el 2,1% del PIB en 2013.<\/li>\n<li>La balanza de pagos siguió cuadrando: la financiación del Eurosistema sustituyó al capital privado que salía. La posición TARGET del Banco de España pasó de 3,3 mil millones de euros adeudados al Eurosistema a finales de 2007 a 337,3 mil millones a finales de 2012.<\/li>\n<li>Cuando el diferencial bajó después de 2012, de 4,35 puntos a 1,23 en 2015, España mantuvo su superávit.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">f ↓ y salidas de capital: la curva BP se hace más inclinada y se desplaza hacia arriba; en el antiguo (Y, r) la balanza de pagos está en déficit.<\/div><\/div><\/div>","data":true},{"s":12,"t":{"en":"The Mundell–Fleming Model: Three Markets, One System","es":"El modelo Mundell-Fleming: tres mercados, un sistema"},"en":"<div class=\"two wide-l\"><div><div class=\"blk\"><div class=\"bt\">Goods market (IS)<\/div><div class=\"bb\">\n<div class=\"eq\">Y = C + I + G + NX<\/div><ul>\n<li>Consumption: C = c<sub>0<\/sub> + c<sub>1<\/sub>Y<sub>D<\/sub>, with Y<sub>D<\/sub> = Y + @o{TR} − @o{T} and 0 &lt; c<sub>1<\/sub> &lt; 1.<\/li>\n<li>Investment: I = @o{I} + αY − dr.<\/li>\n<li>Government spending: G = @o{G}.<\/li>\n<li>Net exports: NX = X − M, with X = xY*·ER<sub>0<\/sub> and M = m<sub>1<\/sub>Y/ER<sub>0<\/sub>.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Money market (LM)<\/div><div class=\"bb\"><div class=\"eq\">@f{@o{M}}{@o{P}} = M<sup>d<\/sup> = a + bY − hr<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Balance of payments (BP)<\/div><div class=\"bb\"><div class=\"eq\">BP = xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>} + f(r − r*)<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Endogenous and exogenous variables<\/div><div class=\"bb\"><ul>\n<li><b>Endogenous<\/b>: income Y and the interest rate r. A third variable adjusts the balance of payments: ER<sub>0<\/sub> with a flexible exchange rate, the money supply @o{M} with a fixed exchange rate.<\/li>\n<li><b>Exogenous<\/b>: c<sub>0<\/sub>, @o{TR}, @o{T}, @o{I}, @o{G}, Y*, r* and @o{P}, together with the parameters c<sub>1<\/sub>, α, d, x, m<sub>1<\/sub>, a, b, h and f.<\/li><\/ul><\/div><\/div>\n<div class=\"assume\">In the IS chapter the interest sensitivity of investment was called b. Here it is d, because b is the income sensitivity of money demand.<\/div>\n<div class=\"identity\">Three equations, IS, LM and BP = 0, and three unknowns: Y, r, and ER<sub>0<\/sub> or @o{M}.<\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div><div class=\"blk\"><div class=\"bt\">Mercado de bienes (IS)<\/div><div class=\"bb\">\n<div class=\"eq\">Y = C + I + G + NX<\/div><ul>\n<li>Consumo: C = c<sub>0<\/sub> + c<sub>1<\/sub>Y<sub>D<\/sub>, con Y<sub>D<\/sub> = Y + @o{TR} − @o{T} y 0 &lt; c<sub>1<\/sub> &lt; 1.<\/li>\n<li>Inversión: I = @o{I} + αY − dr.<\/li>\n<li>Gasto público: G = @o{G}.<\/li>\n<li>Exportaciones netas: NX = X − M, con X = xY*·ER<sub>0<\/sub> y M = m<sub>1<\/sub>Y/ER<sub>0<\/sub>.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Mercado de dinero (LM)<\/div><div class=\"bb\"><div class=\"eq\">@f{@o{M}}{@o{P}} = M<sup>d<\/sup> = a + bY − hr<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Balanza de pagos (BP)<\/div><div class=\"bb\"><div class=\"eq\">BP = xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>} + f(r − r*)<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Variables endógenas y exógenas<\/div><div class=\"bb\"><ul>\n<li><b>Endógenas<\/b>: la renta Y y el tipo de interés r. Una tercera variable ajusta la balanza de pagos: ER<sub>0<\/sub> con tipo de cambio flexible, la cantidad de dinero @o{M} con tipo de cambio fijo.<\/li>\n<li><b>Exógenas<\/b>: c<sub>0<\/sub>, @o{TR}, @o{T}, @o{I}, @o{G}, Y*, r* y @o{P}, junto con los parámetros c<sub>1<\/sub>, α, d, x, m<sub>1<\/sub>, a, b, h y f.<\/li><\/ul><\/div><\/div>\n<div class=\"assume\">En el tema de la IS la sensibilidad de la inversión al tipo de interés se llamaba b. Aquí se llama d, porque b es la sensibilidad de la demanda de dinero a la renta.<\/div>\n<div class=\"identity\">Tres ecuaciones, IS, LM y BP = 0, y tres incógnitas: Y, r, y ER<sub>0<\/sub> o @o{M}.<\/div><\/div><\/div>"},{"s":12,"t":{"en":"Step 1: the Goods Market","es":"Paso 1: el mercado de bienes"},"en":"<div class=\"two wide-l\"><div><div class=\"blk\"><div class=\"bt\">Substitute every function into Y = C + I + G + NX<\/div><div class=\"bb\">\n<div class=\"eq\">Y = c<sub>0<\/sub> + c<sub>1<\/sub>(Y + @o{TR} − @o{T}) + @o{I} + αY − dr + @o{G} + xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>}Y<\/div>\n<p>Autonomous spending collects the terms that depend on neither Y nor r:<\/p>\n<div class=\"eq\"><span class=\"bl\">@o{A} = c<sub>0<\/sub> + c<sub>1<\/sub>(@o{TR} − @o{T}) + @o{I} + @o{G} + xY*·ER<sub>0<\/sub><\/span><\/div>\n<p>The goods market becomes<\/p>\n<div class=\"eq\">Y = @o{A} + (c<sub>1<\/sub> + α − @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>})Y − dr<\/div>\n<p>and, with the terms in Y on the left,<\/p>\n<div class=\"eq\">(1 − c<sub>1<\/sub> − α + @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>})Y = @o{A} − dr<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">The inverse of the multiplier, σ<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"hl\">σ = 1 − c<sub>1<\/sub> − α + @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>} &gt; 0<\/span><\/div><ul>\n<li>1/σ is the open-economy multiplier of the goods market, k<sub>G<\/sub> in the IS chapter.<\/li>\n<li>Imports are a leakage: m<sub>1<\/sub>/ER<sub>0<\/sub> raises σ and lowers the multiplier.<\/li>\n<li>With a proportional tax, T = tY, c<sub>1<\/sub>(1 − t) takes the place of c<sub>1<\/sub> in σ, and @o{T} leaves @o{A}.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">σY = @o{A} − dr &emsp; ⇔ &emsp; Y = @f{@o{A} − dr}{σ}<\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div><div class=\"blk\"><div class=\"bt\">Sustituye cada función en Y = C + I + G + NX<\/div><div class=\"bb\">\n<div class=\"eq\">Y = c<sub>0<\/sub> + c<sub>1<\/sub>(Y + @o{TR} − @o{T}) + @o{I} + αY − dr + @o{G} + xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>}Y<\/div>\n<p>El gasto autónomo reúne los términos que no dependen ni de Y ni de r:<\/p>\n<div class=\"eq\"><span class=\"bl\">@o{A} = c<sub>0<\/sub> + c<sub>1<\/sub>(@o{TR} − @o{T}) + @o{I} + @o{G} + xY*·ER<sub>0<\/sub><\/span><\/div>\n<p>El mercado de bienes queda<\/p>\n<div class=\"eq\">Y = @o{A} + (c<sub>1<\/sub> + α − @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>})Y − dr<\/div>\n<p>y, con los términos en Y a la izquierda,<\/p>\n<div class=\"eq\">(1 − c<sub>1<\/sub> − α + @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>})Y = @o{A} − dr<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">La inversa del multiplicador, σ<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"hl\">σ = 1 − c<sub>1<\/sub> − α + @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>} &gt; 0<\/span><\/div><ul>\n<li>1/σ es el multiplicador de la economía abierta en el mercado de bienes, k<sub>G<\/sub> en el tema de la IS.<\/li>\n<li>Las importaciones son una fuga: m<sub>1<\/sub>/ER<sub>0<\/sub> eleva σ y reduce el multiplicador.<\/li>\n<li>Con un impuesto proporcional, T = tY, c<sub>1<\/sub>(1 − t) ocupa el lugar de c<sub>1<\/sub> en σ, y @o{T} sale de @o{A}.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">σY = @o{A} − dr &emsp; ⇔ &emsp; Y = @f{@o{A} − dr}{σ}<\/div><\/div><\/div>"},{"s":12,"t":{"en":"Step 1: the IS Curve","es":"Paso 1: la curva IS"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Solving for r<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"bl\">r = @u{@f{@o{A}}{d}}{intercept} @u{− @f{σ}{d}}{slope} Y<\/span><\/div>\n<div class=\"eq\">@f{∂r}{∂Y} = −@f{1 − c<sub>1<\/sub> − α + m<sub>1<\/sub>/ER<sub>0<\/sub>}{d} &lt; 0<\/div><ul>\n<li><b>Slope<\/b>: a larger d, investment more sensitive to r, makes the IS curve flatter; a larger m<sub>1<\/sub> makes it steeper.<\/li>\n<li><b>Shifts<\/b>: everything in @o{A} shifts the IS curve. @o{G} ↑, @o{TR} ↑, @o{T} ↓, @o{I} ↑ and Y* ↑ move it to the right.<\/li>\n<li><b>The exchange rate<\/b>: ER<sub>0<\/sub> ↑, a depreciation, raises exports in @o{A} and lowers the import leakage in σ, so the IS curve shifts to the right.<\/li><\/ul><\/div><\/div><\/div>\n<div>[[fig:mf_is]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Despejar r<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"bl\">r = @u{@f{@o{A}}{d}}{ordenada en el origen} @u{− @f{σ}{d}}{pendiente} Y<\/span><\/div>\n<div class=\"eq\">@f{∂r}{∂Y} = −@f{1 − c<sub>1<\/sub> − α + m<sub>1<\/sub>/ER<sub>0<\/sub>}{d} &lt; 0<\/div><ul>\n<li><b>Pendiente<\/b>: una d mayor, inversión más sensible a r, hace la IS más plana; una m<sub>1<\/sub> mayor la hace más inclinada.<\/li>\n<li><b>Desplazamientos<\/b>: todo lo que entra en @o{A} desplaza la curva IS. @o{G} ↑, @o{TR} ↑, @o{T} ↓, @o{I} ↑ e Y* ↑ la mueven a la derecha.<\/li>\n<li><b>El tipo de cambio<\/b>: ER<sub>0<\/sub> ↑, una depreciación, eleva las exportaciones en @o{A} y reduce la fuga de importaciones en σ, de modo que la IS se desplaza a la derecha.<\/li><\/ul><\/div><\/div><\/div>\n<div>[[fig:mf_is]]<\/div><\/div>"},{"s":12,"t":{"en":"Steps 2 and 3: the LM and BP Curves","es":"Pasos 2 y 3: las curvas LM y BP"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Step 2: the money market<\/div><div class=\"bb\">\n<div class=\"eq\">@f{@o{M}}{@o{P}} = a + bY − hr<\/div>\n<div class=\"eq\"><span class=\"bl\">r = @f{a − @o{M}/@o{P}}{h} + @f{b}{h}Y<\/span><\/div>\n<p>Slope b/h &gt; 0. A larger real money supply shifts the LM curve down and to the right.<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Step 3: the balance of payments<\/div><div class=\"bb\">\n<div class=\"eq\">xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>} + f(r − r*) = 0<\/div>\n<div class=\"eq\"><span class=\"bl\">r = r* − @f{x}{f}Y*·ER<sub>0<\/sub> + @f{m<sub>1<\/sub>}{f·ER<sub>0<\/sub>}Y<\/span><\/div>\n<p>Slope m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) &gt; 0. Y*, ER<sub>0<\/sub> and r* shift the curve.<\/p><\/div><\/div><\/div><\/div>\n<table class=\"num txt\"><tr><th>Curve<\/th><th>Market in equilibrium<\/th><th>Slope<\/th><th>Shifted by<\/th><\/tr>\n<tr><td>IS<\/td><td>Goods: Y = C + I + G + NX<\/td><td>−σ/d<\/td><td>@o{A}: @o{G}, @o{T}, @o{TR}, @o{I}, Y*, ER<sub>0<\/sub><\/td><\/tr>\n<tr><td>LM<\/td><td>Money: @o{M}/@o{P} = M<sup>d<\/sup><\/td><td>b/h<\/td><td>@o{M}/@o{P}, a<\/td><\/tr>\n<tr><td>BP<\/td><td>Balance of payments: BP = 0<\/td><td>m<sub>1<\/sub>/(f·ER<sub>0<\/sub>)<\/td><td>Y*, ER<sub>0<\/sub>, r*<\/td><\/tr><\/table>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Paso 2: el mercado de dinero<\/div><div class=\"bb\">\n<div class=\"eq\">@f{@o{M}}{@o{P}} = a + bY − hr<\/div>\n<div class=\"eq\"><span class=\"bl\">r = @f{a − @o{M}/@o{P}}{h} + @f{b}{h}Y<\/span><\/div>\n<p>Pendiente b/h &gt; 0. Una oferta monetaria real mayor desplaza la curva LM hacia abajo y a la derecha.<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Paso 3: la balanza de pagos<\/div><div class=\"bb\">\n<div class=\"eq\">xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>Y}{ER<sub>0<\/sub>} + f(r − r*) = 0<\/div>\n<div class=\"eq\"><span class=\"bl\">r = r* − @f{x}{f}Y*·ER<sub>0<\/sub> + @f{m<sub>1<\/sub>}{f·ER<sub>0<\/sub>}Y<\/span><\/div>\n<p>Pendiente m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) &gt; 0. Y*, ER<sub>0<\/sub> y r* desplazan la curva.<\/p><\/div><\/div><\/div><\/div>\n<table class=\"num txt\"><tr><th>Curva<\/th><th>Mercado en equilibrio<\/th><th>Pendiente<\/th><th>La desplazan<\/th><\/tr>\n<tr><td>IS<\/td><td>Bienes: Y = C + I + G + NX<\/td><td>−σ/d<\/td><td>@o{A}: @o{G}, @o{T}, @o{TR}, @o{I}, Y*, ER<sub>0<\/sub><\/td><\/tr>\n<tr><td>LM<\/td><td>Dinero: @o{M}/@o{P} = M<sup>d<\/sup><\/td><td>b/h<\/td><td>@o{M}/@o{P}, a<\/td><\/tr>\n<tr><td>BP<\/td><td>Balanza de pagos: BP = 0<\/td><td>m<sub>1<\/sub>/(f·ER<sub>0<\/sub>)<\/td><td>Y*, ER<sub>0<\/sub>, r*<\/td><\/tr><\/table>"},{"s":13,"t":{"en":"Step 4: Solving IS and LM Together","es":"Paso 4: resolver IS y LM a la vez"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Equate the two expressions for r<\/div><div class=\"bb\">\n<div class=\"eq\">@f{@o{A}}{d} − @f{σ}{d}Y = @f{a − @o{M}/@o{P}}{h} + @f{b}{h}Y<\/div>\n<p>Multiply both sides by d·h:<\/p>\n<div class=\"eq\">h@o{A} − hσY = d(a − @o{M}/@o{P}) + bdY<\/div>\n<p>Collect the terms in Y:<\/p>\n<div class=\"eq\">(hσ + bd)Y = h@o{A} + d(@o{M}/@o{P} − a)<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">The IS–LM equilibrium<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"hl\">Y<sub>e<\/sub> = @f{h@o{A} + d(@o{M}/@o{P} − a)}{hσ + bd}<\/span><\/div>\n<p>Substituting Y<sub>e<\/sub> into the LM curve gives<\/p>\n<div class=\"eq\"><span class=\"hl\">r<sub>e<\/sub> = @f{b@o{A} − σ(@o{M}/@o{P} − a)}{hσ + bd}<\/span><\/div><ul>\n<li>The denominator, hσ + bd, is positive.<\/li>\n<li>Y<sub>e<\/sub> rises with @o{A} and with @o{M}/@o{P}.<\/li>\n<li>r<sub>e<\/sub> rises with @o{A} and falls with @o{M}/@o{P}.<\/li><\/ul><\/div><\/div><\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Iguala las dos expresiones de r<\/div><div class=\"bb\">\n<div class=\"eq\">@f{@o{A}}{d} − @f{σ}{d}Y = @f{a − @o{M}/@o{P}}{h} + @f{b}{h}Y<\/div>\n<p>Multiplica los dos lados por d·h:<\/p>\n<div class=\"eq\">h@o{A} − hσY = d(a − @o{M}/@o{P}) + bdY<\/div>\n<p>Agrupa los términos en Y:<\/p>\n<div class=\"eq\">(hσ + bd)Y = h@o{A} + d(@o{M}/@o{P} − a)<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">El equilibrio IS-LM<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"hl\">Y<sub>e<\/sub> = @f{h@o{A} + d(@o{M}/@o{P} − a)}{hσ + bd}<\/span><\/div>\n<p>Al sustituir Y<sub>e<\/sub> en la curva LM se obtiene<\/p>\n<div class=\"eq\"><span class=\"hl\">r<sub>e<\/sub> = @f{b@o{A} − σ(@o{M}/@o{P} − a)}{hσ + bd}<\/span><\/div><ul>\n<li>El denominador, hσ + bd, es positivo.<\/li>\n<li>Y<sub>e<\/sub> aumenta con @o{A} y con @o{M}/@o{P}.<\/li>\n<li>r<sub>e<\/sub> aumenta con @o{A} y disminuye con @o{M}/@o{P}.<\/li><\/ul><\/div><\/div><\/div><\/div>"},{"s":13,"t":{"en":"Step 5: the Balance of Payments at the Equilibrium","es":"Paso 5: la balanza de pagos en el equilibrio"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Evaluate BP at (Y<sub>e<\/sub>, r<sub>e<\/sub>)<\/div><div class=\"bb\">\n<div class=\"eq\">BP<sub>e<\/sub> = xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>}Y<sub>e<\/sub> + f(r<sub>e<\/sub> − r*)<\/div><ol type=\"A\">\n<li>BP<sub>e<\/sub> = 0: the IS–LM equilibrium lies on the BP curve, and the three markets are in equilibrium.<\/li>\n<li>BP<sub>e<\/sub> &gt; 0: it lies above the BP curve, a <span class=\"bl\">surplus<\/span>, and the domestic currency tends to appreciate.<\/li>\n<li>BP<sub>e<\/sub> &lt; 0: it lies below the BP curve, a <span class=\"hl\">deficit<\/span>, and the domestic currency tends to depreciate.<\/li><\/ol>\n<p>Nothing makes BP<sub>e<\/sub> equal to zero. The exchange-rate regime decides which variable moves to close the gap.<\/p><\/div><\/div><\/div>\n<div>[[fig:mf_eq]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Evalúa BP en (Y<sub>e<\/sub>, r<sub>e<\/sub>)<\/div><div class=\"bb\">\n<div class=\"eq\">BP<sub>e<\/sub> = xY*·ER<sub>0<\/sub> − @f{m<sub>1<\/sub>}{ER<sub>0<\/sub>}Y<sub>e<\/sub> + f(r<sub>e<\/sub> − r*)<\/div><ol type=\"A\">\n<li>BP<sub>e<\/sub> = 0: el equilibrio IS-LM está sobre la curva BP, y los tres mercados están en equilibrio.<\/li>\n<li>BP<sub>e<\/sub> &gt; 0: está por encima de la curva BP, un <span class=\"bl\">superávit<\/span>, y la moneda nacional tiende a apreciarse.<\/li>\n<li>BP<sub>e<\/sub> &lt; 0: está por debajo de la curva BP, un <span class=\"hl\">déficit<\/span>, y la moneda nacional tiende a depreciarse.<\/li><\/ol>\n<p>Nada hace que BP<sub>e<\/sub> sea cero. El régimen de tipo de cambio decide qué variable se mueve para cerrar la brecha.<\/p><\/div><\/div><\/div>\n<div>[[fig:mf_eq]]<\/div><\/div>"},{"s":13,"t":{"en":"Multipliers of the Full Model","es":"Multiplicadores del modelo completo"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Fiscal policy<\/div><div class=\"bb\">\n<p>@o{G}, @o{T} and @o{TR} enter Y<sub>e<\/sub> and r<sub>e<\/sub> through @o{A}:<\/p>\n<div class=\"eq\"><span class=\"hl\">@f{ΔY<sub>e<\/sub>}{Δ@o{G}} = @f{h}{hσ + bd} = @f{1}{σ + bd/h}<\/span><\/div>\n<div class=\"eq\">@f{ΔY<sub>e<\/sub>}{Δ@o{T}} = @f{−c<sub>1<\/sub>h}{hσ + bd} &emsp; @f{ΔY<sub>e<\/sub>}{Δ@o{TR}} = @f{c<sub>1<\/sub>h}{hσ + bd}<\/div>\n<div class=\"eq\">@f{Δr<sub>e<\/sub>}{Δ@o{G}} = @f{b}{hσ + bd} &gt; 0<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Monetary policy<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"hl\">@f{ΔY<sub>e<\/sub>}{Δ(@o{M}/@o{P})} = @f{d}{hσ + bd}<\/span> &emsp; @f{Δr<sub>e<\/sub>}{Δ(@o{M}/@o{P})} = @f{−σ}{hσ + bd} &lt; 0<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Crowding out<\/div><div class=\"bb\">\n<p>In the goods market alone the multiplier is 1/σ, and the IS curve shifts right by Δ@o{G}/σ. In the full model the multiplier is 1/(σ + bd/h), which is smaller:<\/p>\n<div class=\"identity\">Y ↑ → M<sup>d<\/sup> ↑ (b) → r ↑ (1/h) → I ↓ (d)<\/div>\n<p>The term bd/h measures this <span class=\"hl\">crowding out<\/span> of investment.<\/p><\/div><\/div>\n[[fig:mf_crowd]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Política fiscal<\/div><div class=\"bb\">\n<p>@o{G}, @o{T} y @o{TR} entran en Y<sub>e<\/sub> y r<sub>e<\/sub> a través de @o{A}:<\/p>\n<div class=\"eq\"><span class=\"hl\">@f{ΔY<sub>e<\/sub>}{Δ@o{G}} = @f{h}{hσ + bd} = @f{1}{σ + bd/h}<\/span><\/div>\n<div class=\"eq\">@f{ΔY<sub>e<\/sub>}{Δ@o{T}} = @f{−c<sub>1<\/sub>h}{hσ + bd} &emsp; @f{ΔY<sub>e<\/sub>}{Δ@o{TR}} = @f{c<sub>1<\/sub>h}{hσ + bd}<\/div>\n<div class=\"eq\">@f{Δr<sub>e<\/sub>}{Δ@o{G}} = @f{b}{hσ + bd} &gt; 0<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Política monetaria<\/div><div class=\"bb\">\n<div class=\"eq\"><span class=\"hl\">@f{ΔY<sub>e<\/sub>}{Δ(@o{M}/@o{P})} = @f{d}{hσ + bd}<\/span> &emsp; @f{Δr<sub>e<\/sub>}{Δ(@o{M}/@o{P})} = @f{−σ}{hσ + bd} &lt; 0<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Efecto expulsión<\/div><div class=\"bb\">\n<p>En el mercado de bienes por sí solo el multiplicador es 1/σ, y la IS se desplaza a la derecha en Δ@o{G}/σ. En el modelo completo el multiplicador es 1/(σ + bd/h), que es menor:<\/p>\n<div class=\"identity\">Y ↑ → M<sup>d<\/sup> ↑ (b) → r ↑ (1/h) → I ↓ (d)<\/div>\n<p>El término bd/h mide este <span class=\"hl\">efecto expulsión<\/span> (crowding out) de la inversión.<\/p><\/div><\/div>\n[[fig:mf_crowd]]<\/div><\/div>"},{"s":13,"t":{"en":"Crowding Out: Special Cases","es":"Efecto expulsión: casos especiales"},"en":"<div class=\"blk\"><div class=\"bt\">The limits of the multipliers<\/div><div class=\"bb\">\n<table class=\"num txt\"><tr><th>Case<\/th><th>Fiscal multiplier, h/(hσ + bd)<\/th><th>Monetary-policy multiplier, d/(hσ + bd)<\/th><th>Why<\/th><\/tr>\n<tr><td>h → ∞: horizontal LM, the liquidity trap<\/td><td>1/σ: no crowding out<\/td><td>0<\/td><td>Money demand absorbs any change in the money supply, and r does not move.<\/td><\/tr>\n<tr><td>h → 0: vertical LM<\/td><td>0: full crowding out<\/td><td>1/b<\/td><td>Only income can clear the money market.<\/td><\/tr>\n<tr><td>d → 0: investment does not respond to r, vertical IS<\/td><td>1/σ<\/td><td>0<\/td><td>r changes, but spending does not.<\/td><\/tr>\n<tr><td>d → ∞: very flat IS<\/td><td>0<\/td><td>1/b<\/td><td>A tiny rise in r crowds out all the extra spending.<\/td><\/tr><\/table><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Reading the cases<\/div><div class=\"bb\"><ul>\n<li>Fiscal policy is strong when the LM curve is flat (large h) and the IS curve is steep (small d).<\/li>\n<li>Monetary policy is strong when the LM curve is steep (small h) and the IS curve is flat (large d).<\/li><\/ul><\/div><\/div>","es":"<div class=\"blk\"><div class=\"bt\">Los límites de los multiplicadores<\/div><div class=\"bb\">\n<table class=\"num txt\"><tr><th>Caso<\/th><th>Multiplicador fiscal, h/(hσ + bd)<\/th><th>Multiplicador de la política monetaria, d/(hσ + bd)<\/th><th>Por qué<\/th><\/tr>\n<tr><td>h → ∞: LM horizontal, la trampa de liquidez<\/td><td>1/σ: sin efecto expulsión<\/td><td>0<\/td><td>La demanda de dinero absorbe cualquier cambio de la cantidad de dinero, y r no se mueve.<\/td><\/tr>\n<tr><td>h → 0: LM vertical<\/td><td>0: efecto expulsión total<\/td><td>1/b<\/td><td>Solo la renta puede equilibrar el mercado de dinero.<\/td><\/tr>\n<tr><td>d → 0: la inversión no responde a r, IS vertical<\/td><td>1/σ<\/td><td>0<\/td><td>r cambia, pero el gasto no.<\/td><\/tr>\n<tr><td>d → ∞: IS muy plana<\/td><td>0<\/td><td>1/b<\/td><td>Una subida mínima de r expulsa todo el gasto adicional.<\/td><\/tr><\/table><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Cómo leer los casos<\/div><div class=\"bb\"><ul>\n<li>La política fiscal es potente cuando la LM es plana (h grande) y la IS es inclinada (d pequeña).<\/li>\n<li>La política monetaria es potente cuando la LM es inclinada (h pequeña) y la IS es plana (d grande).<\/li><\/ul><\/div><\/div>"},{"s":13,"t":{"en":"Policy and the Balance of Payments","es":"La política económica y la balanza de pagos"},"en":"<div class=\"blk\"><div class=\"bt\">How BP responds, with ER<sub>0<\/sub>, Y* and r* given<\/div><div class=\"bb\"><div class=\"eq\">ΔBP = −@f{m<sub>1<\/sub>}{ER<sub>0<\/sub>}ΔY + fΔr<\/div><\/div><\/div>\n<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Fiscal expansion<\/div><div class=\"bb\">\n<div class=\"eq\">@f{ΔBP}{Δ@o{G}} = @f{fb − (m<sub>1<\/sub>/ER<sub>0<\/sub>)h}{hσ + bd}<\/div><ul>\n<li>Y ↑ raises imports: the current account worsens.<\/li>\n<li>r ↑ attracts capital: the financial account improves.<\/li>\n<li>ΔBP &gt; 0 when fb &gt; (m<sub>1<\/sub>/ER<sub>0<\/sub>)h, that is, when @f{m<sub>1<\/sub>}{f·ER<sub>0<\/sub>} &lt; @f{b}{h}: <span class=\"bl\">the BP curve is flatter than the LM curve<\/span>.<\/li><\/ul><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Monetary expansion<\/div><div class=\"bb\">\n<div class=\"eq\">@f{ΔBP}{Δ(@o{M}/@o{P})} = −@f{(m<sub>1<\/sub>/ER<sub>0<\/sub>)d + fσ}{hσ + bd} &lt; 0<\/div><ul>\n<li>Y ↑ raises imports: the current account worsens.<\/li>\n<li>r ↓ drives capital out: the financial account worsens as well.<\/li>\n<li>A monetary expansion <span class=\"hl\">always<\/span> pushes the balance of payments towards a deficit.<\/li><\/ul><\/div><\/div><\/div><\/div>\n<div class=\"assume\">This is the algebra behind the three degrees of capital mobility: after a fiscal expansion, the comparison of the BP and LM slopes decides between a surplus and a deficit.<\/div>","es":"<div class=\"blk\"><div class=\"bt\">Cómo responde BP, con ER<sub>0<\/sub>, Y* y r* dados<\/div><div class=\"bb\"><div class=\"eq\">ΔBP = −@f{m<sub>1<\/sub>}{ER<sub>0<\/sub>}ΔY + fΔr<\/div><\/div><\/div>\n<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Expansión fiscal<\/div><div class=\"bb\">\n<div class=\"eq\">@f{ΔBP}{Δ@o{G}} = @f{fb − (m<sub>1<\/sub>/ER<sub>0<\/sub>)h}{hσ + bd}<\/div><ul>\n<li>Y ↑ eleva las importaciones: la cuenta corriente empeora.<\/li>\n<li>r ↑ atrae capital: la cuenta financiera mejora.<\/li>\n<li>ΔBP &gt; 0 cuando fb &gt; (m<sub>1<\/sub>/ER<sub>0<\/sub>)h, es decir, cuando @f{m<sub>1<\/sub>}{f·ER<sub>0<\/sub>} &lt; @f{b}{h}: <span class=\"bl\">la curva BP es más plana que la LM<\/span>.<\/li><\/ul><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Expansión monetaria<\/div><div class=\"bb\">\n<div class=\"eq\">@f{ΔBP}{Δ(@o{M}/@o{P})} = −@f{(m<sub>1<\/sub>/ER<sub>0<\/sub>)d + fσ}{hσ + bd} &lt; 0<\/div><ul>\n<li>Y ↑ eleva las importaciones: la cuenta corriente empeora.<\/li>\n<li>r ↓ hace salir el capital: la cuenta financiera también empeora.<\/li>\n<li>Una expansión monetaria <span class=\"hl\">siempre<\/span> lleva la balanza de pagos hacia el déficit.<\/li><\/ul><\/div><\/div><\/div><\/div>\n<div class=\"assume\">Aquí está el álgebra de los tres grados de movilidad del capital: tras una expansión fiscal, la comparación de las pendientes de la BP y la LM decide entre superávit y déficit.<\/div>"},{"s":14,"t":{"en":"Closing the Model: the Exchange-Rate Regime","es":"Cerrar el modelo: el régimen de tipo de cambio"},"en":"<div class=\"blk\"><div class=\"bt\">Who closes the balance-of-payments gap?<\/div><div class=\"bb\">IS and LM give Y<sub>e<\/sub> and r<sub>e<\/sub>. BP = 0 is a third condition, and it needs a third variable to adjust; the exchange-rate regime decides which one.<\/div><\/div>\n<table class=\"num txt\"><tr><th><\/th><th>Flexible exchange rate<\/th><th>Fixed exchange rate<\/th><\/tr>\n<tr><td>Who acts<\/td><td>The forex market: ER<sub>0<\/sub> moves<\/td><td>The central bank buys or sells foreign currency at the fixed ER<sub>0<\/sub><\/td><\/tr>\n<tr><td>Variable that adjusts<\/td><td>ER<sub>0<\/sub><\/td><td>The money supply, @o{M}<\/td><\/tr>\n<tr><td>Curves that move<\/td><td>IS and BP<\/td><td>LM<\/td><\/tr>\n<tr><td>Monetary policy<\/td><td>Independent: the central bank chooses @o{M}<\/td><td>Tied to the balance of payments<\/td><\/tr>\n<tr><td>Final equilibrium<\/td><td>On the original LM curve, where the shifted IS and BP curves meet<\/td><td>Where IS and BP cross; the LM curve moves there<\/td><\/tr><\/table>\n<div class=\"assume\">ER<sub>0<\/sub> is the price of the foreign currency: ER<sub>0<\/sub> ↑ is a depreciation and ER<sub>0<\/sub> ↓ an appreciation. A depreciation raises net exports, as the Marshall–Lerner condition requires.<\/div>","es":"<div class=\"blk\"><div class=\"bt\">¿Quién cierra la brecha de la balanza de pagos?<\/div><div class=\"bb\">IS y LM dan Y<sub>e<\/sub> y r<sub>e<\/sub>. BP = 0 es una tercera condición y necesita una tercera variable que se ajuste; el régimen de tipo de cambio decide cuál.<\/div><\/div>\n<table class=\"num txt\"><tr><th><\/th><th>Tipo de cambio flexible<\/th><th>Tipo de cambio fijo<\/th><\/tr>\n<tr><td>Quién actúa<\/td><td>El mercado de divisas: ER<sub>0<\/sub> se mueve<\/td><td>El banco central compra o vende divisas al ER<sub>0<\/sub> fijado<\/td><\/tr>\n<tr><td>Variable que se ajusta<\/td><td>ER<sub>0<\/sub><\/td><td>La cantidad de dinero, @o{M}<\/td><\/tr>\n<tr><td>Curvas que se mueven<\/td><td>IS y BP<\/td><td>LM<\/td><\/tr>\n<tr><td>Política monetaria<\/td><td>Independiente: el banco central elige @o{M}<\/td><td>Atada a la balanza de pagos<\/td><\/tr>\n<tr><td>Equilibrio final<\/td><td>Sobre la LM inicial, donde se cortan las IS y BP desplazadas<\/td><td>Donde se cortan IS y BP; la LM se desplaza hasta allí<\/td><\/tr><\/table>\n<div class=\"assume\">ER<sub>0<\/sub> es el precio de la moneda extranjera: ER<sub>0<\/sub> ↑ es una depreciación y ER<sub>0<\/sub> ↓ una apreciación. Una depreciación eleva las exportaciones netas, como exige la condición de Marshall-Lerner.<\/div>"},{"s":14,"t":{"en":"Flexible Exchange Rate: Adjustment","es":"Tipo de cambio flexible: ajuste"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">From a surplus, BP &gt; 0<\/div><div class=\"bb\"><ol>\n<li>The excess demand for the domestic currency appreciates it: ER<sub>0<\/sub> ↓.<\/li>\n<li>Exports fall and imports rise: the IS curve shifts left, to IS′.<\/li>\n<li>The appreciation also shifts the BP curve up, to BP′: at each income a higher r is needed.<\/li>\n<li>The money supply does not change, so the LM curve stays where it is. The economy moves down along it until IS′, LM and BP′ meet at E′: Y and r fall.<\/li><\/ol>\n<p>With a deficit the steps run the other way: ER<sub>0<\/sub> ↑, the IS and BP curves shift right and Y rises.<\/p><\/div><\/div>\n<div class=\"identity\">BP &gt; 0 → ER<sub>0<\/sub> ↓ → NX ↓ → IS left, BP up → Y ↓, r ↓<\/div><\/div>\n<div>[[fig:mf_flex]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Desde un superávit, BP &gt; 0<\/div><div class=\"bb\"><ol>\n<li>El exceso de demanda de moneda nacional la aprecia: ER<sub>0<\/sub> ↓.<\/li>\n<li>Las exportaciones caen y las importaciones suben: la IS se desplaza a la izquierda, a IS′.<\/li>\n<li>La apreciación también desplaza la BP hacia arriba, a BP′: para cada renta hace falta un r más alto.<\/li>\n<li>La cantidad de dinero no cambia, de modo que la LM se queda donde está. La economía baja a lo largo de ella hasta que IS′, LM y BP′ se cortan en E′: Y y r bajan.<\/li><\/ol>\n<p>Con un déficit los pasos van al revés: ER<sub>0<\/sub> ↑, las curvas IS y BP se desplazan a la derecha e Y sube.<\/p><\/div><\/div>\n<div class=\"identity\">BP &gt; 0 → ER<sub>0<\/sub> ↓ → NX ↓ → IS a la izquierda, BP arriba → Y ↓, r ↓<\/div><\/div>\n<div>[[fig:mf_flex]]<\/div><\/div>"},{"s":14,"t":{"en":"Real Data: the Euro, the Dollar and the Rate Gap, 2021–2026","es":"Datos reales: el euro, el dólar y la diferencia de tipos, 2021–2026"},"en":"<div class=\"two wide-l\"><div>[[fig:d_fx]]<p class=\"datasrc\">Sources: Federal Reserve G.5 via FRED (EXUSEU, monthly averages) and FOMC statements; ECB, key interest rates and euro reference rates.<\/p>[[data:d_fx]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the data show<\/div><div class=\"bb\"><ul>\n<li>For the euro area a higher US rate is a higher r*: capital flows towards dollar assets, the balance of payments moves into deficit and, with a flexible exchange rate, the euro depreciates.<\/li>\n<li><b>2022<\/b>: the Fed raised rates earlier and faster than the ECB. The gap rose from 0.75 to 2.50 points and the euro fell below one dollar; the ECB reference rate reached 0.9565 on 28 September 2022.<\/li>\n<li><b>2023–2024<\/b>: the ECB caught up, the gap narrowed to about 1.5–2 points and the euro stayed mostly between 1.05 and 1.11.<\/li>\n<li><b>2025<\/b>: the euro rose to about 1.17 although the gap widened again to 2.50 points. Capital flows also respond to risk, expectations and policy news; in the model these move the BP curve, as a change in r* does.<\/li><\/ul><\/div><\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_fx]]<p class=\"datasrc\">Fuentes: Reserva Federal G.5 a través de FRED (EXUSEU, medias mensuales) y comunicados del FOMC; BCE, tipos de interés oficiales y tipos de referencia del euro.<\/p>[[data:d_fx]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestran los datos<\/div><div class=\"bb\"><ul>\n<li>Para la zona del euro, un tipo de interés de EE. UU. más alto es un r* más alto: el capital se dirige a activos en dólares, la balanza de pagos pasa a déficit y, con tipo de cambio flexible, el euro se deprecia.<\/li>\n<li><b>2022<\/b>: la Fed subió tipos antes y más deprisa que el BCE. La diferencia pasó de 0,75 a 2,50 puntos y el euro cayó por debajo del dólar; el tipo de referencia del BCE llegó a 0,9565 el 28 de septiembre de 2022.<\/li>\n<li><b>2023–2024<\/b>: el BCE recortó distancias, la diferencia bajó a entre 1,5 y 2 puntos y el euro se movió casi siempre entre 1,05 y 1,11.<\/li>\n<li><b>2025<\/b>: el euro subió hasta cerca de 1,17 aunque la diferencia volvió a ampliarse hasta 2,50 puntos. Los flujos de capital también responden al riesgo, a las expectativas y a las noticias de política económica; en el modelo esto desplaza la curva BP, igual que un cambio de r*.<\/li><\/ul><\/div><\/div><\/div><\/div>","data":true},{"s":14,"t":{"en":"Fixed Exchange Rate: Adjustment","es":"Tipo de cambio fijo: ajuste"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">From a surplus, BP &gt; 0<\/div><div class=\"bb\"><ol>\n<li>The excess demand for the domestic currency would appreciate it. To hold ER<sub>0<\/sub>, the central bank buys the excess foreign currency and pays with domestic currency.<\/li>\n<li>Its foreign reserves rise, and so does the money supply: the LM curve shifts right, to LM′.<\/li>\n<li>r falls and Y rises along the IS curve: capital inflows shrink and imports grow.<\/li>\n<li>The process stops when LM′ passes through the crossing of IS and BP, at E′, where BP = 0.<\/li><\/ol>\n<p>With a deficit the central bank sells foreign currency: its reserves and the money supply fall, and the LM curve shifts left.<\/p><\/div><\/div>\n<div class=\"identity\">BP &gt; 0 → the central bank buys foreign currency → @o{M} ↑ → LM right → Y ↑, r ↓<\/div><\/div>\n<div>[[fig:mf_fixed]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">Desde un superávit, BP &gt; 0<\/div><div class=\"bb\"><ol>\n<li>El exceso de demanda de moneda nacional la apreciaría. Para mantener ER<sub>0<\/sub>, el banco central compra las divisas sobrantes y paga con moneda nacional.<\/li>\n<li>Sus reservas de divisas aumentan, y también la cantidad de dinero: la LM se desplaza a la derecha, a LM′.<\/li>\n<li>r baja e Y sube a lo largo de la IS: las entradas de capital se reducen y las importaciones crecen.<\/li>\n<li>El proceso termina cuando LM′ pasa por el corte de IS y BP, en E′, donde BP = 0.<\/li><\/ol>\n<p>Con un déficit el banco central vende divisas: sus reservas y la cantidad de dinero bajan, y la LM se desplaza a la izquierda.<\/p><\/div><\/div>\n<div class=\"identity\">BP &gt; 0 → el banco central compra divisas → @o{M} ↑ → LM a la derecha → Y ↑, r ↓<\/div><\/div>\n<div>[[fig:mf_fixed]]<\/div><\/div>"},{"s":14,"t":{"en":"Real Data: Switzerland's Floor, 2011–2015","es":"Datos reales: el suelo del franco suizo, 2011–2015"},"en":"<div class=\"two wide-l\"><div>[[fig:d_snb]]<p class=\"datasrc\">Sources: SNB press releases of 6 September 2011 and 15 January 2015; SNB annual results (balance sheet); Federal Reserve H.10 (exchange rates).<\/p>[[data:d_snb]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the data show<\/div><div class=\"bb\"><ul>\n<li>In 2011 capital sought safety in the Swiss franc. On 6 September the SNB set a minimum rate of CHF 1.20 per euro and said it was “prepared to buy foreign currency in unlimited quantities”.<\/li>\n<li>Holding the floor meant buying euros: the SNB's foreign currency investments rose from CHF 203.8 billion at the end of 2010 to 510.1 billion at the end of 2014.<\/li>\n<li>On 15 January 2015 the SNB discontinued the floor and lowered the rate on sight deposits above an exemption threshold to −0.75%. The franc jumped: the euro went from 1.20 francs to 0.98 the next day (Federal Reserve noon rates in New York).<\/li>\n<li>In the model: a fixed rate with a persistent surplus requires ever larger purchases of foreign currency and a growing money supply; the peg ends when the central bank stops buying and lets the currency appreciate.<\/li>\n<li>With a flexible franc the SNB kept buying currency to limit the appreciation: CHF 790.1 billion at the end of 2017.<\/li><\/ul><\/div><\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_snb]]<p class=\"datasrc\">Fuentes: notas de prensa del BNS del 6 de septiembre de 2011 y del 15 de enero de 2015; resultados anuales del BNS (balance); Reserva Federal H.10 (tipos de cambio).<\/p>[[data:d_snb]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestran los datos<\/div><div class=\"bb\"><ul>\n<li>En 2011 el capital buscó refugio en el franco suizo. El 6 de septiembre el BNS fijó un tipo mínimo de 1,20 francos por euro y se declaró «dispuesto a comprar divisas en cantidades ilimitadas».<\/li>\n<li>Mantener el suelo exigía comprar euros: las inversiones en divisas del BNS pasaron de 203,8 mil millones de CHF a finales de 2010 a 510,1 mil millones a finales de 2014.<\/li>\n<li>El 15 de enero de 2015 el BNS abandonó el suelo y bajó al −0,75% el tipo de los depósitos a la vista por encima de un umbral exento. El franco se disparó: el euro pasó de 1,20 francos a 0,98 al día siguiente (tipos de la Reserva Federal al mediodía en Nueva York).<\/li>\n<li>En el modelo: un tipo fijo con un superávit persistente exige compras de divisas cada vez mayores y una cantidad de dinero creciente; la paridad termina cuando el banco central deja de comprar y permite que la moneda se aprecie.<\/li>\n<li>Con el franco flexible, el BNS siguió comprando divisas para limitar la apreciación: 790,1 mil millones de CHF a finales de 2017.<\/li><\/ul><\/div><\/div><\/div><\/div>","data":true},{"s":14,"t":{"en":"The Final Equilibrium under Each Regime","es":"El equilibrio final en cada régimen"},"en":"<div class=\"two wide-l\"><div><div class=\"blk\"><div class=\"bt\">Fixed exchange rate: the final point is on IS and BP<\/div><div class=\"bb\">\n<p>The LM curve adjusts, so the BP curve takes its place. Substituting the BP curve into σY = @o{A} − dr gives the multipliers<\/p>\n<div class=\"eq\"><span class=\"hl\">@f{ΔY}{Δ@o{G}} = @f{1}{σ + d·m<sub>1<\/sub>/(f·ER<sub>0<\/sub>)}<\/span> &emsp; @f{ΔY}{Δ(@o{M}/@o{P})} = 0<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Flexible exchange rate: the final point is on LM, with BP = 0<\/div><div class=\"bb\">\n<p>With BP = 0, net exports equal minus the financial account, NX = −f(r − r*). Substituting this into Y = C + I + G + NX removes ER<sub>0<\/sub>:<\/p>\n<div class=\"eq\">(1 − c<sub>1<\/sub> − α)Y = c<sub>0<\/sub> + c<sub>1<\/sub>(@o{TR} − @o{T}) + @o{I} + @o{G} + fr* − (d + f)r<\/div>\n<p>Solving it together with the LM curve gives<\/p>\n<div class=\"eq\"><span class=\"hl\">@f{ΔY}{Δ@o{G}} = @f{h}{h(1 − c<sub>1<\/sub> − α) + b(d + f)}<\/span><\/div>\n<div class=\"eq\">@f{ΔY}{Δ(@o{M}/@o{P})} = @f{d + f}{h(1 − c<sub>1<\/sub> − α) + b(d + f)}<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">The limits<\/div><div class=\"bb\"><table class=\"num txt\"><tr><th><\/th><th>f → ∞<\/th><th>f → 0<\/th><\/tr>\n<tr><td>Fixed rate, fiscal<\/td><td>1/σ: fully effective<\/td><td>0: Y stays at Y<sub>TB<\/sub><\/td><\/tr>\n<tr><td>Flexible rate, fiscal<\/td><td>0: ineffective<\/td><td>h/[h(1 − c<sub>1<\/sub> − α) + bd], as in a closed economy<\/td><\/tr>\n<tr><td>Flexible rate, monetary<\/td><td>1/b: fully effective<\/td><td>d/[h(1 − c<sub>1<\/sub> − α) + bd], as in a closed economy<\/td><\/tr><\/table><\/div><\/div>\n<div class=\"assume\">The fixed-rate fiscal multiplier is larger than the IS–LM one, 1/(σ + bd/h), exactly when m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) &lt; b/h: the BP curve is flatter than the LM curve. The flexible-rate multiplier is then smaller.<\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div><div class=\"blk\"><div class=\"bt\">Tipo de cambio fijo: el punto final está sobre IS y BP<\/div><div class=\"bb\">\n<p>La LM se ajusta, de modo que la curva BP ocupa su lugar. Al sustituir la curva BP en σY = @o{A} − dr se obtienen los multiplicadores<\/p>\n<div class=\"eq\"><span class=\"hl\">@f{ΔY}{Δ@o{G}} = @f{1}{σ + d·m<sub>1<\/sub>/(f·ER<sub>0<\/sub>)}<\/span> &emsp; @f{ΔY}{Δ(@o{M}/@o{P})} = 0<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Tipo de cambio flexible: el punto final está sobre la LM, con BP = 0<\/div><div class=\"bb\">\n<p>Con BP = 0, las exportaciones netas son iguales a menos la cuenta financiera, NX = −f(r − r*). Al sustituir esta expresión en Y = C + I + G + NX desaparece ER<sub>0<\/sub>:<\/p>\n<div class=\"eq\">(1 − c<sub>1<\/sub> − α)Y = c<sub>0<\/sub> + c<sub>1<\/sub>(@o{TR} − @o{T}) + @o{I} + @o{G} + fr* − (d + f)r<\/div>\n<p>Al resolverla junto con la LM se obtiene<\/p>\n<div class=\"eq\"><span class=\"hl\">@f{ΔY}{Δ@o{G}} = @f{h}{h(1 − c<sub>1<\/sub> − α) + b(d + f)}<\/span><\/div>\n<div class=\"eq\">@f{ΔY}{Δ(@o{M}/@o{P})} = @f{d + f}{h(1 − c<sub>1<\/sub> − α) + b(d + f)}<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Los límites<\/div><div class=\"bb\"><table class=\"num txt\"><tr><th><\/th><th>f → ∞<\/th><th>f → 0<\/th><\/tr>\n<tr><td>Tipo fijo, fiscal<\/td><td>1/σ: plenamente eficaz<\/td><td>0: Y se queda en Y<sub>TB<\/sub><\/td><\/tr>\n<tr><td>Tipo flexible, fiscal<\/td><td>0: ineficaz<\/td><td>h/[h(1 − c<sub>1<\/sub> − α) + bd], como en una economía cerrada<\/td><\/tr>\n<tr><td>Tipo flexible, monetaria<\/td><td>1/b: plenamente eficaz<\/td><td>d/[h(1 − c<sub>1<\/sub> − α) + bd], como en una economía cerrada<\/td><\/tr><\/table><\/div><\/div>\n<div class=\"assume\">El multiplicador fiscal con tipo fijo es mayor que el de IS-LM, 1/(σ + bd/h), exactamente cuando m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) &lt; b/h: la curva BP es más plana que la LM. El multiplicador con tipo flexible es entonces menor.<\/div><\/div><\/div>"},{"s":15,"t":{"en":"Perfect Capital Mobility: the Mundell–Fleming Benchmark","es":"Movilidad perfecta del capital: el caso de referencia de Mundell-Fleming"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">f → ∞<\/div><div class=\"bb\"><ul>\n<li>The BP curve is horizontal at r = r*: any gap between r and r* sets off unlimited capital flows.<\/li>\n<li>In equilibrium the domestic interest rate equals the world rate.<\/li>\n<li>Policy changes Y only through the curve that the regime lets move: IS with a flexible rate, LM with a fixed rate.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">The two classic results<\/div><div class=\"bb\"><ol>\n<li>With a <b>flexible<\/b> exchange rate, monetary policy is fully effective and fiscal policy is ineffective.<\/li>\n<li>With a <b>fixed<\/b> exchange rate, fiscal policy is fully effective and monetary policy is ineffective.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:mf_pm]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">f → ∞<\/div><div class=\"bb\"><ul>\n<li>La curva BP es horizontal en r = r*: cualquier diferencia entre r y r* desencadena flujos de capital ilimitados.<\/li>\n<li>En equilibrio el tipo de interés nacional es igual al mundial.<\/li>\n<li>La política económica cambia Y solo a través de la curva que el régimen deja moverse: la IS con tipo flexible, la LM con tipo fijo.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Los dos resultados clásicos<\/div><div class=\"bb\"><ol>\n<li>Con tipo de cambio <b>flexible<\/b>, la política monetaria es plenamente eficaz y la política fiscal es ineficaz.<\/li>\n<li>Con tipo de cambio <b>fijo<\/b>, la política fiscal es plenamente eficaz y la política monetaria es ineficaz.<\/li><\/ol><\/div><\/div><\/div>\n<div>[[fig:mf_pm]]<\/div><\/div>"},{"s":15,"t":{"en":"Perfect Mobility, Flexible Rate: Fiscal Expansion","es":"Movilidad perfecta, tipo flexible: expansión fiscal"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">@o{G} ↑ with a flexible exchange rate<\/div><div class=\"bb\"><ol>\n<li>The IS curve shifts right, to IS′, and r tends to rise above r*.<\/li>\n<li>Capital flows in and the domestic currency appreciates: ER<sub>0<\/sub> ↓.<\/li>\n<li>Exports fall and imports rise: the IS curve shifts back.<\/li>\n<li>The process ends only when r = r* again. The LM curve has not moved, so Y returns to Y<sub>1<\/sub>.<\/li><\/ol>\n<p class=\"hl\">Fiscal policy is ineffective: net exports fall by as much as government spending rises. The crowding out works through the exchange rate.<\/p><\/div><\/div>\n<div class=\"identity\">Δ@o{G} = −ΔNX &emsp; ΔY = 0<\/div><\/div>\n<div>[[fig:mf_pf_flex]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">@o{G} ↑ con tipo de cambio flexible<\/div><div class=\"bb\"><ol>\n<li>La IS se desplaza a la derecha, a IS′, y r tiende a subir por encima de r*.<\/li>\n<li>Entra capital y la moneda nacional se aprecia: ER<sub>0<\/sub> ↓.<\/li>\n<li>Las exportaciones caen y las importaciones suben: la IS vuelve atrás.<\/li>\n<li>El proceso solo termina cuando r = r* de nuevo. La LM no se ha movido, de modo que Y vuelve a Y<sub>1<\/sub>.<\/li><\/ol>\n<p class=\"hl\">La política fiscal es ineficaz: las exportaciones netas caen tanto como sube el gasto público. El efecto expulsión actúa a través del tipo de cambio.<\/p><\/div><\/div>\n<div class=\"identity\">Δ@o{G} = −ΔNX &emsp; ΔY = 0<\/div><\/div>\n<div>[[fig:mf_pf_flex]]<\/div><\/div>"},{"s":15,"t":{"en":"Real Data: US Fiscal Expansion in the 1980s","es":"Datos reales: la expansión fiscal de EE. UU. en los años ochenta"},"en":"<div class=\"two wide-l\"><div>[[fig:d_us80]]<p class=\"datasrc\">Sources: OMB and BEA via FRED (FYFSDFYGDP, BOPBCAA, GDPA); Federal Reserve (TWEXMMTH, H.15).<\/p>[[data:d_us80]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the data show<\/div><div class=\"bb\"><ul>\n<li>Tax cuts and higher defence spending raised the federal deficit from 2.5% of GDP in fiscal 1981 to 5.9% in 1983, and it stayed near 5% until 1986.<\/li>\n<li>Monetary policy was tight: the federal funds rate averaged 16.4% in 1981 and was still about 8–10% in 1983–1985.<\/li>\n<li>Capital flowed in and the dollar rose 40% against the major currencies between 1980 and 1985 (annual averages, 95.4 to 133.6); the current account went from a small surplus to a deficit of 3.3% of GDP in 1987.<\/li>\n<li>This is the open-economy crowding out of the flexible-rate case: part of the fiscal stimulus leaked abroad through the appreciation and lower net exports, the “twin deficits”.<\/li>\n<li>After the 1985 peak the dollar fell back, to 89.9 in 1990.<\/li><\/ul><\/div><\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_us80]]<p class=\"datasrc\">Fuentes: OMB y BEA a través de FRED (FYFSDFYGDP, BOPBCAA, GDPA); Reserva Federal (TWEXMMTH, H.15).<\/p>[[data:d_us80]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestran los datos<\/div><div class=\"bb\"><ul>\n<li>Las rebajas de impuestos y el aumento del gasto en defensa elevaron el déficit federal del 2,5% del PIB en el año fiscal 1981 al 5,9% en 1983, y se mantuvo cerca del 5% hasta 1986.<\/li>\n<li>La política monetaria era restrictiva: el tipo de los fondos federales promedió un 16,4% en 1981 y seguía en torno al 8–10% en 1983–1985.<\/li>\n<li>Entró capital y el dólar se apreció un 40% frente a las principales monedas entre 1980 y 1985 (medias anuales, de 95,4 a 133,6); la cuenta corriente pasó de un pequeño superávit a un déficit del 3,3% del PIB en 1987.<\/li>\n<li>Es el efecto expulsión de la economía abierta con tipo de cambio flexible: parte del estímulo fiscal se fue al exterior a través de la apreciación y de unas exportaciones netas menores, los «déficits gemelos».<\/li>\n<li>Tras el máximo de 1985 el dólar volvió a caer, hasta 89,9 en 1990.<\/li><\/ul><\/div><\/div><\/div><\/div>","data":true},{"s":15,"t":{"en":"Perfect Mobility, Flexible Rate: Monetary Expansion","es":"Movilidad perfecta, tipo flexible: expansión monetaria"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">@o{M} ↑ with a flexible exchange rate<\/div><div class=\"bb\"><ol>\n<li>The LM curve shifts right, to LM′, and r tends to fall below r*.<\/li>\n<li>Capital flows out and the domestic currency depreciates: ER<sub>0<\/sub> ↑.<\/li>\n<li>Exports rise and imports fall: the IS curve shifts right, to IS′.<\/li>\n<li>The new equilibrium is E<sub>2<\/sub>, where LM′ meets the BP curve at r = r*: Y rises to Y<sub>2<\/sub>.<\/li><\/ol>\n<p class=\"bl\">Monetary policy is fully effective. With r = r*, the LM curve gives ΔY = Δ(@o{M}/@o{P})/b.<\/p><\/div><\/div>\n<div class=\"identity\">@o{M} ↑ → r ↓ → ER<sub>0<\/sub> ↑ → NX ↑ → Y ↑<\/div><\/div>\n<div>[[fig:mf_pm_flex]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">@o{M} ↑ con tipo de cambio flexible<\/div><div class=\"bb\"><ol>\n<li>La LM se desplaza a la derecha, a LM′, y r tiende a bajar por debajo de r*.<\/li>\n<li>Sale capital y la moneda nacional se deprecia: ER<sub>0<\/sub> ↑.<\/li>\n<li>Las exportaciones suben y las importaciones bajan: la IS se desplaza a la derecha, a IS′.<\/li>\n<li>El nuevo equilibrio es E<sub>2<\/sub>, donde LM′ corta a la curva BP en r = r*: Y sube hasta Y<sub>2<\/sub>.<\/li><\/ol>\n<p class=\"bl\">La política monetaria es plenamente eficaz. Con r = r*, la LM da ΔY = Δ(@o{M}/@o{P})/b.<\/p><\/div><\/div>\n<div class=\"identity\">@o{M} ↑ → r ↓ → ER<sub>0<\/sub> ↑ → NX ↑ → Y ↑<\/div><\/div>\n<div>[[fig:mf_pm_flex]]<\/div><\/div>"},{"s":15,"t":{"en":"Perfect Mobility, Fixed Rate: Fiscal Expansion","es":"Movilidad perfecta, tipo fijo: expansión fiscal"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">@o{G} ↑ with a fixed exchange rate<\/div><div class=\"bb\"><ol>\n<li>The IS curve shifts right, to IS′, and r tends to rise above r*.<\/li>\n<li>Capital flows in, and the domestic currency would appreciate. To hold ER<sub>0<\/sub>, the central bank buys the foreign currency, and the money supply rises.<\/li>\n<li>The LM curve shifts right, to LM′, until r = r*.<\/li>\n<li>Y rises to Y<sub>2<\/sub> by the full goods-market multiplier: ΔY = Δ@o{G}/σ.<\/li><\/ol>\n<p class=\"bl\">Fiscal policy is fully effective: the interest rate does not rise, so nothing is crowded out.<\/p><\/div><\/div>\n<div class=\"identity\">Δ@o{G} &gt; 0 → capital inflows → @o{M} ↑ → LM right → <span style=\"white-space:nowrap\">ΔY = Δ@o{G}/σ<\/span><\/div><\/div>\n<div>[[fig:mf_pf_fix]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">@o{G} ↑ con tipo de cambio fijo<\/div><div class=\"bb\"><ol>\n<li>La IS se desplaza a la derecha, a IS′, y r tiende a subir por encima de r*.<\/li>\n<li>Entra capital y la moneda nacional se apreciaría. Para mantener ER<sub>0<\/sub>, el banco central compra las divisas, y la cantidad de dinero aumenta.<\/li>\n<li>La LM se desplaza a la derecha, a LM′, hasta que r = r*.<\/li>\n<li>Y sube hasta Y<sub>2<\/sub> con el multiplicador completo del mercado de bienes: ΔY = Δ@o{G}/σ.<\/li><\/ol>\n<p class=\"bl\">La política fiscal es plenamente eficaz: el tipo de interés no sube, de modo que no hay efecto expulsión.<\/p><\/div><\/div>\n<div class=\"identity\">Δ@o{G} &gt; 0 → entradas de capital → @o{M} ↑ → LM a la derecha → <span style=\"white-space:nowrap\">ΔY = Δ@o{G}/σ<\/span><\/div><\/div>\n<div>[[fig:mf_pf_fix]]<\/div><\/div>"},{"s":15,"t":{"en":"Perfect Mobility, Fixed Rate: Monetary Expansion","es":"Movilidad perfecta, tipo fijo: expansión monetaria"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">@o{M} ↑ with a fixed exchange rate<\/div><div class=\"bb\"><ol>\n<li>The LM curve shifts right, to LM′, and r tends to fall below r*.<\/li>\n<li>Capital flows out, and the domestic currency would depreciate. To hold ER<sub>0<\/sub>, the central bank sells foreign currency, and the money supply falls.<\/li>\n<li>The LM curve shifts back to LM.<\/li>\n<li>Y and r return to E<sub>1<\/sub>. The only lasting effect is a loss of foreign reserves.<\/li><\/ol>\n<p class=\"hl\">Monetary policy is ineffective: with a fixed exchange rate and free capital movement, the central bank cannot choose the money supply.<\/p><\/div><\/div>\n<div class=\"identity\">@o{M} ↑ → capital outflows → reserves ↓, @o{M} ↓ → back to E<sub>1<\/sub><\/div><\/div>\n<div>[[fig:mf_pm_fix]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">@o{M} ↑ con tipo de cambio fijo<\/div><div class=\"bb\"><ol>\n<li>La LM se desplaza a la derecha, a LM′, y r tiende a bajar por debajo de r*.<\/li>\n<li>Sale capital y la moneda nacional se depreciaría. Para mantener ER<sub>0<\/sub>, el banco central vende divisas, y la cantidad de dinero disminuye.<\/li>\n<li>La LM vuelve a su posición inicial.<\/li>\n<li>Y y r vuelven a E<sub>1<\/sub>. El úni
