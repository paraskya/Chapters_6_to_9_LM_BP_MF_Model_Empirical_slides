<script>
const QUESTIONS = [{"id":1,"topic":"md","slides":[4,5],"correct":2,"en":{"stem":"Holding money instead of bonds has an opportunity cost equal to:","options":["The inflation target of the central bank.","The price of bonds.","The interest rate r that bonds pay.","The growth rate of income.","None of the above."],"steps":["Money can be used in transactions but pays no interest; bonds pay the interest rate r.","Each euro held as money gives up the interest that a bond would pay, so r is the opportunity cost of holding money.","This is why the demand for money falls when r rises."]},"es":{"stem":"Mantener dinero en lugar de bonos tiene un coste de oportunidad igual a:","options":["El objetivo de inflación del banco central.","El precio de los bonos.","El tipo de interés r que pagan los bonos.","La tasa de crecimiento de la renta.","Ninguna de las anteriores."],"steps":["El dinero sirve para hacer transacciones pero no paga intereses; los bonos pagan el tipo de interés r.","Cada euro que se mantiene en dinero renuncia al interés que pagaría un bono, de modo que r es el coste de oportunidad de mantener dinero.","Por eso la demanda de dinero cae cuando sube r."]}},{"id":2,"topic":"md","slides":[4],"correct":0,"en":{"stem":"In the money market model, wealth is held in two assets, money and bonds. Which statement describes them?","options":["Money is used in transactions but pays no interest; bonds pay r but cannot be used in transactions.","Both money and bonds can be used in transactions, but only bonds pay the interest rate r.","Money pays the interest rate r and bonds pay no interest, so bonds are held only for transactions.","Bonds can be used in transactions and money cannot, so money is held only as a store of value.","None of the above."],"steps":["Money, currency and checkable deposits, is accepted in transactions but earns no interest.","Bonds pay the interest rate r, but they must be sold before their value can be spent.","Liquidity preference is the choice between the two assets: liquidity against interest."]},"es":{"stem":"En el modelo del mercado de dinero, la riqueza se mantiene en dos activos, dinero y bonos. ¿Qué afirmación los describe?","options":["El dinero se usa en las transacciones pero no paga intereses; los bonos pagan r pero no pueden usarse en las transacciones.","Tanto el dinero como los bonos pueden usarse en las transacciones, pero solo los bonos pagan el tipo de interés r.","El dinero paga el tipo de interés r y los bonos no pagan intereses, de modo que los bonos solo se mantienen para las transacciones.","Los bonos pueden usarse en las transacciones y el dinero no, de modo que el dinero solo se mantiene como depósito de valor.","Ninguna de las anteriores."],"steps":["El dinero, efectivo y depósitos a la vista, se acepta en las transacciones pero no genera intereses.","Los bonos pagan el tipo de interés r, pero hay que venderlos para poder gastar su valor.","La preferencia por la liquidez es la elección entre los dos activos: liquidez frente a interés."]}},{"id":3,"topic":"md","slides":[6,7],"correct":1,"own":true,"en":{"stem":"Which of these factors would shift the entire money demand curve to the right in the (M/P, r) space, instead of moving along it?","options":["A lower interest rate r.","A persistent increase in real income Y.","An increase in the real money supply.","A decrease in the price level P.","None of the above."],"steps":["The interest rate is on the vertical axis of the money market graph, so a lower r is a movement along the money demand curve.","Income is not on the axes: a higher Y raises the number of transactions and the demand for money at every interest rate, so the curve shifts to the right.","A larger real money supply, whether it comes from the central bank or from a lower P, moves the money supply line, not the demand curve."]},"es":{"stem":"¿Cuál de estos factores desplazaría toda la curva de demanda de dinero a la derecha en el espacio (M/P, r), en lugar de producir un movimiento a lo largo de ella?","options":["Un tipo de interés r más bajo.","Un aumento persistente de la renta real Y.","Un aumento de la oferta monetaria real.","Una caída del nivel de precios P.","Ninguna de las anteriores."],"steps":["El tipo de interés está en el eje vertical del gráfico del mercado de dinero, de modo que un r más bajo es un movimiento a lo largo de la curva de demanda de dinero.","La renta no está en los ejes: una Y mayor eleva el número de transacciones y la demanda de dinero para cada tipo de interés, de modo que la curva se desplaza a la derecha.","Una oferta monetaria real mayor, venga del banco central o de un P más bajo, mueve la recta de oferta de dinero, no la curva de demanda."]}},{"id":4,"topic":"md","slides":[6,74],"correct":2,"en":{"stem":"Money demand is M<sup>d<\/sup> = 100 + 0.5Y − 20r, with r in percent. At Y = 1,000 and r = 5, the demand for real balances is:","options":["400","450","500","550","600"],"steps":["Substitute the values: M<sup>d<\/sup> = 100 + 0.5 × 1,000 − 20 × 5.","The transactions term adds 500 and the interest term subtracts 100, so M<sup>d<\/sup> = 100 + 500 − 100 = 500.","Forgetting the interest term gives 600, and forgetting the constant gives 400."]},"es":{"stem":"La demanda de dinero es M<sup>d<\/sup> = 100 + 0,5Y − 20r, con r en porcentaje. Con Y = 1.000 y r = 5, la demanda de saldos reales es:","options":["400","450","500","550","600"],"steps":["Se sustituyen los valores: M<sup>d<\/sup> = 100 + 0,5 × 1.000 − 20 × 5.","El término de transacciones suma 500 y el del tipo de interés resta 100, de modo que M<sup>d<\/sup> = 100 + 500 − 100 = 500.","Olvidar el término del tipo de interés da 600, y olvidar la constante da 400."]}},{"id":5,"topic":"md","slides":[9],"correct":4,"en":{"stem":"The real money supply curve is vertical in the (M/P, r) graph because:","options":["Households demand the same amount of money at every interest rate.","The price level falls when the interest rate rises, which keeps real balances constant.","Income is fixed in the short run, so the demand for money cannot change.","Both A and C.","The central bank sets the money supply, which does not depend on the interest rate."],"steps":["The money supply is decided by the central bank and is treated as exogenous: it does not depend on r.","With P fixed in the short run, the real money supply is the same at every interest rate, so its graph is a vertical line.","A describes money demand, not money supply, and the price level does not respond to r in the short run."]},"es":{"stem":"La curva de oferta monetaria real es vertical en el gráfico (M/P, r) porque:","options":["Los hogares demandan la misma cantidad de dinero a cualquier tipo de interés.","El nivel de precios cae cuando sube el tipo de interés, lo que mantiene constantes los saldos reales.","La renta está fija a corto plazo, de modo que la demanda de dinero no puede cambiar.","Tanto A como C.","El banco central fija la oferta monetaria, que no depende del tipo de interés."],"steps":["La oferta monetaria la decide el banco central y se trata como exógena: no depende de r.","Con P fijo a corto plazo, la oferta monetaria real es la misma para cualquier tipo de interés, de modo que su gráfico es una recta vertical.","A describe la demanda de dinero, no la oferta, y el nivel de precios no responde a r a corto plazo."]}},{"id":6,"topic":"md","slides":[6],"correct":4,"en":{"stem":"In the money demand function M<sup>d<\/sup> = a + bY − hr, the parameters measure:","options":["b: the sensitivity of money demand to the interest rate.","h: the sensitivity of money demand to income.","a: the speculative motive.","Both A and B.","None of the above."],"steps":["b multiplies income: it measures how much the demand for money rises with income, the transactions motive.","h multiplies the interest rate: it measures how much the demand for money falls when r rises, the speculative motive.","The constant a captures the precautionary motive. A, B and C mix up the roles, so none of them is right."]},"es":{"stem":"En la función de demanda de dinero M<sup>d<\/sup> = a + bY − hr, los parámetros miden:","options":["b: la sensibilidad de la demanda de dinero al tipo de interés.","h: la sensibilidad de la demanda de dinero a la renta.","a: el motivo especulación.","Tanto A como B.","Ninguna de las anteriores."],"steps":["b multiplica a la renta: mide cuánto aumenta la demanda de dinero con la renta, el motivo transacción.","h multiplica al tipo de interés: mide cuánto cae la demanda de dinero cuando sube r, el motivo especulación.","La constante a recoge el motivo precaución. A, B y C confunden los papeles, de modo que ninguna es correcta."]}},{"id":7,"topic":"mp","slides":[10],"correct":3,"en":{"stem":"At an interest rate above its equilibrium level, the money market adjusts because:","options":["There is excess demand for money, so people sell bonds and r rises further.","The central bank must sell bonds until the interest rate returns to equilibrium.","Income falls until the demand for money equals the money supply at the higher rate.","There is excess supply of money: people buy bonds, bond prices rise and r falls.","None of the above."],"steps":["Above the equilibrium rate the demand for money is smaller than the supply: people hold more money than they want.","They use the extra money to buy bonds, which raises bond prices.","Bond prices and interest rates move in opposite directions, so r falls until the demand for money equals the supply."]},"es":{"stem":"Con un tipo de interés por encima de su nivel de equilibrio, el mercado de dinero se ajusta porque:","options":["Hay exceso de demanda de dinero, de modo que la gente vende bonos y r sube aún más.","El banco central debe vender bonos hasta que el tipo de interés vuelva al equilibrio.","La renta cae hasta que la demanda de dinero iguala a la oferta monetaria al tipo más alto.","Hay exceso de oferta de dinero: la gente compra bonos, su precio sube y r baja.","Ninguna de las anteriores."],"steps":["Por encima del tipo de equilibrio, la demanda de dinero es menor que la oferta: la gente mantiene más dinero del que desea.","Usa el dinero sobrante para comprar bonos, lo que eleva su precio.","El precio de los bonos y el tipo de interés se mueven en sentidos opuestos, de modo que r baja hasta que la demanda de dinero iguala a la oferta."]}},{"id":8,"topic":"mp","slides":[12,14],"correct":0,"own":true,"en":{"stem":"Suppose the central bank implements an open market purchase of government bonds. If everything else stays constant, which of the following outcomes is the most standard prediction in the short run?","options":["The money supply rises, the money supply curve shifts to the right and the interest rate falls.","Money demand immediately rises because people prefer to hold fewer bonds at lower rates.","The price level P drops sharply, since more money is in circulation.","The interest rate r moves upward to restore equilibrium.","All of the above."],"steps":["An open market purchase raises the money supply, so its curve shifts to the right.","At the old interest rate there is now excess supply of money, and r falls until people are willing to hold the larger money stock.","Money demand does not shift, since a lower r is a movement along it, and the price level is fixed in the short run."]},"es":{"stem":"Supongamos que el banco central realiza una compra de bonos públicos en el mercado abierto. Si todo lo demás permanece constante, ¿cuál de los siguientes resultados es la predicción habitual a corto plazo?","options":["La oferta monetaria aumenta, la curva de oferta de dinero se desplaza a la derecha y el tipo de interés baja.","La demanda de dinero aumenta de inmediato porque la gente prefiere mantener menos bonos con tipos más bajos.","El nivel de precios P cae bruscamente, ya que hay más dinero en circulación.","El tipo de interés r sube para restablecer el equilibrio.","Todas las anteriores."],"steps":["Una compra en el mercado abierto eleva la oferta monetaria, de modo que su curva se desplaza a la derecha.","Al tipo de interés anterior hay ahora exceso de oferta de dinero, y r baja hasta que la gente está dispuesta a mantener la mayor cantidad de dinero.","La demanda de dinero no se desplaza, porque un r más bajo es un movimiento a lo largo de ella, y el nivel de precios está fijo a corto plazo."]}},{"id":9,"topic":"mp","slides":[15],"correct":1,"own":true,"en":{"stem":"If the discount rate charged to commercial banks is lowered while the reserve requirement and open market operations remain unchanged, what is the most direct predicted effect?","options":["The money supply decreases, putting upward pressure on interest rates.","Commercial banks borrow more cheaply from the central bank, the money supply rises and interest rates fall.","The LM curve shifts to the left.","The exchange rate appreciates as domestic investment becomes more attractive.","None of the above."],"steps":["The discount rate is the interest rate of the central bank's standing facilities, its short-term loans to commercial banks; a lower rate makes this borrowing cheaper.","Banks borrow more from the central bank, the money supply rises and the interest rate falls.","The LM curve shifts to the right, and a lower r tends to depreciate the currency, not to appreciate it."]},"es":{"stem":"Si se reduce el tipo de descuento que se cobra a los bancos comerciales mientras el coeficiente de reservas y las operaciones de mercado abierto no cambian, ¿cuál es el efecto previsto más directo?","options":["La oferta monetaria disminuye, lo que presiona al alza los tipos de interés.","Los bancos comerciales se endeudan más barato con el banco central, la oferta monetaria aumenta y los tipos de interés bajan.","La curva LM se desplaza a la izquierda.","El tipo de cambio se aprecia porque la inversión nacional resulta más atractiva.","Ninguna de las anteriores."],"steps":["El tipo de descuento es el tipo de interés de las facilidades permanentes del banco central, sus préstamos a corto plazo a los bancos comerciales; un tipo más bajo abarata ese endeudamiento.","Los bancos se endeudan más con el banco central, la oferta monetaria aumenta y el tipo de interés baja.","La curva LM se desplaza a la derecha, y un r más bajo tiende a depreciar la moneda, no a apreciarla."]}},{"id":10,"topic":"mp","slides":[14,18],"correct":4,"own":true,"en":{"stem":"When the central bank sells bonds through open market operations, which of the following is the most direct outcome?","options":["It injects money into the economy, raising the money supply and lowering the interest rate.","It shifts the LM curve to the right and raises income at every interest rate.","It raises bond prices, which is the same as a lower interest rate.","Both A and B.","It reduces the money supply and puts upward pressure on interest rates."],"steps":["A sale of bonds withdraws money from circulation: the money supply falls.","At the old interest rate there is excess demand for money, and r rises until equilibrium is restored; the LM curve shifts to the left.","The extra bonds on the market lower bond prices, which is the same as a higher r."]},"es":{"stem":"Cuando el banco central vende bonos mediante operaciones de mercado abierto, ¿cuál de los siguientes es el resultado más directo?","options":["Inyecta dinero en la economía, eleva la oferta monetaria y reduce el tipo de interés.","Desplaza la curva LM a la derecha y eleva la renta para cada tipo de interés.","Eleva el precio de los bonos, que es lo mismo que un tipo de interés más bajo.","Tanto A como B.","Reduce la oferta monetaria y presiona al alza los tipos de interés."],"steps":["La venta de bonos retira dinero de la circulación: la oferta monetaria cae.","Al tipo de interés anterior hay exceso de demanda de dinero, y r sube hasta restablecer el equilibrio; la curva LM se desplaza a la izquierda.","Los bonos adicionales en el mercado reducen su precio, que es lo mismo que un r más alto."]}},{"id":11,"topic":"mp","slides":[13,15],"correct":2,"own":true,"en":{"stem":"Which of the following would a policymaker consider an expansionary monetary policy instrument if the central bank wants to boost aggregate output Y?","options":["Increasing the reserve requirement k.","Selling government bonds in open market operations.","Lowering the discount rate at which commercial banks borrow from the central bank.","Reducing real income by raising taxes.","All of the above."],"steps":["A higher reserve requirement and a sale of bonds both reduce the money supply: they are contractionary.","A lower discount rate raises the money supply and lowers r, which raises consumption, investment and output.","Raising taxes is fiscal policy, and it is contractionary."]},"es":{"stem":"¿Cuál de los siguientes consideraría un responsable de política económica un instrumento de política monetaria expansiva si el banco central quiere impulsar la producción agregada Y?","options":["Aumentar el coeficiente de reservas k.","Vender bonos públicos en operaciones de mercado abierto.","Reducir el tipo de descuento al que los bancos comerciales se endeudan con el banco central.","Reducir la renta real subiendo los impuestos.","Todas las anteriores."],"steps":["Un coeficiente de reservas más alto y una venta de bonos reducen la oferta monetaria: son contractivos.","Un tipo de descuento más bajo eleva la oferta monetaria y reduce r, lo que eleva el consumo, la inversión y la producción.","Subir los impuestos es política fiscal, y además contractiva."]}},{"id":12,"topic":"mp","slides":[15,22],"correct":2,"own":true,"en":{"stem":"The reserve requirement k can be used as a monetary policy instrument. Which of the following describes the expansionary effect of lowering k?","options":["Lower k means more reserves must be held, reducing the money supply.","Lower k shifts the LM curve to the left.","Lower k raises the money supply, shifts the LM curve to the right and lowers r.","Lower k eliminates the need for currency, resulting in immediate currency depreciation.","All of the above."],"steps":["k is the share of deposits that banks must hold as reserves; a lower k raises the money supply.","At the old interest rate there is excess supply of money, so r falls and the LM curve shifts to the right.","A lower k means fewer reserves, not more, and it does not eliminate currency."]},"es":{"stem":"El coeficiente de reservas k puede usarse como instrumento de política monetaria. ¿Cuál de las siguientes describe el efecto expansivo de reducir k?","options":["Un k menor obliga a mantener más reservas, lo que reduce la oferta monetaria.","Un k menor desplaza la curva LM a la izquierda.","Un k menor eleva la oferta monetaria, desplaza la curva LM a la derecha y reduce r.","Un k menor elimina la necesidad de efectivo y provoca una depreciación inmediata de la moneda.","Todas las anteriores."],"steps":["k es la proporción de los depósitos que los bancos deben mantener como reservas; un k menor eleva la oferta monetaria.","Al tipo de interés anterior hay exceso de oferta de dinero, de modo que r baja y la curva LM se desplaza a la derecha.","Un k menor supone menos reservas, no más, y no elimina el efectivo."]}},{"id":13,"topic":"mp","slides":[11,26],"correct":1,"own":true,"en":{"stem":"Consider a productivity shock that raises real output Y while the central bank holds the money supply fixed and P is constant. Which of the following best explains why the interest rate r typically rises?","options":["Higher productivity lowers money demand, forcing interest rates up by reducing bond supply.","More transactions in the economy raise money demand at the same money supply, creating upward pressure on r.","The central bank intervenes immediately to raise the reserve requirement k, pushing r higher.","The LM curve shifts to the right in standard IS–LM diagrams, leading to an immediate drop in r.","None of the above."],"steps":["Higher output means more transactions, so the demand for money shifts to the right.","With a fixed money supply there is excess demand for money at the old rate; people sell bonds and r rises.","In the IS–LM graph this is a movement along the LM curve, which does not shift."]},"es":{"stem":"Consideremos una perturbación de productividad que eleva la producción real Y mientras el banco central mantiene fija la oferta monetaria y P es constante. ¿Cuál de las siguientes explica mejor por qué el tipo de interés r suele subir?","options":["Una mayor productividad reduce la demanda de dinero y empuja al alza los tipos de interés al reducir la oferta de bonos.","Más transacciones en la economía elevan la demanda de dinero con la misma oferta monetaria, lo que presiona r al alza.","El banco central interviene de inmediato para subir el coeficiente de reservas k, lo que eleva r.","La curva LM se desplaza a la derecha en los diagramas IS-LM habituales, lo que reduce r de inmediato.","Ninguna de las anteriores."],"steps":["Una producción mayor supone más transacciones, de modo que la demanda de dinero se desplaza a la derecha.","Con la oferta monetaria fija hay exceso de demanda de dinero al tipo anterior; la gente vende bonos y r sube.","En el gráfico IS-LM es un movimiento a lo largo de la curva LM, que no se desplaza."]}},{"id":14,"topic":"lm","slides":[3],"correct":2,"en":{"stem":"The LM curve represents:","options":["Combinations of the interest rate and income that keep the balance of payments in equilibrium.","Combinations of the interest rate and income that keep the goods market in equilibrium.","Combinations of the interest rate and income that keep the money market in equilibrium.","Both A and B.","None of the above."],"steps":["LM stands for Liquidity preference–Money supply: it is the equilibrium condition of the money market, M/P = M<sup>d<\/sup>(Y, r).","Goods-market equilibrium is the IS curve, and balance-of-payments equilibrium is the BP curve."]},"es":{"stem":"La curva LM representa:","options":["Las combinaciones del tipo de interés y la renta que mantienen en equilibrio la balanza de pagos.","Las combinaciones del tipo de interés y la renta que mantienen en equilibrio el mercado de bienes.","Las combinaciones del tipo de interés y la renta que mantienen en equilibrio el mercado de dinero.","Tanto A como B.","Ninguna de las anteriores."],"steps":["LM significa preferencia por la liquidez–oferta monetaria (Liquidity preference–Money supply): es la condición de equilibrio del mercado de dinero, M/P = M<sup>d<\/sup>(Y, r).","El equilibrio del mercado de bienes es la curva IS, y el de la balanza de pagos es la curva BP."]}},{"id":15,"topic":"lm","slides":[16,17],"correct":0,"en":{"stem":"The LM curve slopes upward because:","options":["Higher income raises money demand; with a fixed money supply, r must rise to clear the market.","A higher interest rate raises investment, and with it income, along the IS curve.","A higher income raises the money supply and lowers the demand for bonds at every interest rate.","Both B and C.","None of the above."],"steps":["At a higher income people need more money for transactions, so the demand for money rises.","The money supply is fixed, so the interest rate must rise until the demand for money falls back to the money supply.","Along the LM curve a higher income therefore goes with a higher interest rate. A higher r reduces investment, and the money supply is set by the central bank, so B and C are wrong."]},"es":{"stem":"La curva LM tiene pendiente positiva porque:","options":["Una renta mayor eleva la demanda de dinero; con la oferta monetaria fija, r debe subir para equilibrar el mercado.","Un tipo de interés más alto eleva la inversión, y con ella la renta, a lo largo de la curva IS.","Una renta mayor eleva la oferta monetaria y reduce la demanda de bonos para cada tipo de interés.","Tanto B como C.","Ninguna de las anteriores."],"steps":["Con una renta mayor la gente necesita más dinero para sus transacciones, de modo que la demanda de dinero aumenta.","La oferta monetaria está fija, de modo que el tipo de interés debe subir hasta que la demanda de dinero vuelva a igualar a la oferta.","A lo largo de la curva LM una renta mayor va, por tanto, con un tipo de interés más alto. Un r más alto reduce la inversión, y la oferta monetaria la fija el banco central, de modo que B y C son incorrectas."]}},{"id":16,"topic":"lm","slides":[20],"correct":4,"en":{"stem":"If the demand for money becomes more sensitive to the interest rate (h rises), the LM curve:","options":["Becomes steeper.","Shifts to the left.","Becomes vertical.","Does not change.","Becomes flatter."],"steps":["The slope of the LM curve is b/h.","With a larger h, a small change in r changes the demand for money a lot, so a given rise in income needs a smaller rise in r to restore equilibrium.","The slope b/h falls and the LM curve becomes flatter. As h grows without limit the curve becomes horizontal, which is the case of the liquidity trap."]},"es":{"stem":"Si la demanda de dinero se vuelve más sensible al tipo de interés (h aumenta), la curva LM:","options":["Se vuelve más inclinada.","Se desplaza a la izquierda.","Se vuelve vertical.","No cambia.","Se vuelve más plana."],"steps":["La pendiente de la curva LM es b/h.","Con una h mayor, un pequeño cambio de r cambia mucho la demanda de dinero, de modo que un aumento dado de la renta necesita una subida menor de r para restablecer el equilibrio.","La pendiente b/h disminuye y la curva LM se vuelve más plana. Cuando h crece sin límite la curva se vuelve horizontal, que es el caso de la trampa de liquidez."]}},{"id":17,"topic":"lm","slides":[21],"correct":3,"en":{"stem":"Money demand is M<sup>d<\/sup> = 50 + 0.4Y − 10r, with r in percent, and the real money supply is 330. The LM curve and the interest rate at Y = 800 are:","options":["r = 0.4Y − 280 and r = 40.","r = 28 − 0.04Y and r = −4.","r = 0.04Y − 28 and r = 8.","r = 0.04Y − 28 and r = 4.","None of the above."],"steps":["Equilibrium requires 330 = 50 + 0.4Y − 10r, so 10r = 0.4Y − 280.","Dividing by 10: r = 0.04Y − 28, with slope b/h = 0.4/10 = 0.04.","At Y = 800: r = 32 − 28 = 4. Option C gives the rate at Y = 900."]},"es":{"stem":"La demanda de dinero es M<sup>d<\/sup> = 50 + 0,4Y − 10r, con r en porcentaje, y la oferta monetaria real es 330. La curva LM y el tipo de interés con Y = 800 son:","options":["r = 0,4Y − 280 y r = 40.","r = 28 − 0,04Y y r = −4.","r = 0,04Y − 28 y r = 8.","r = 0,04Y − 28 y r = 4.","Ninguna de las anteriores."],"steps":["El equilibrio exige 330 = 50 + 0,4Y − 10r, de modo que 10r = 0,4Y − 280.","Dividiendo por 10: r = 0,04Y − 28, con pendiente b/h = 0,4/10 = 0,04.","Con Y = 800: r = 32 − 28 = 4. La opción C da el tipo con Y = 900."]}},{"id":18,"topic":"lm","slides":[17,20],"correct":2,"en":{"stem":"With the money supply fixed, an increase in income:","options":["Shifts the LM curve to the right, because more transactions need more money at every rate.","Shifts the money supply curve to the left, which raises the interest rate in the money market.","Shifts money demand to the right and moves the economy along the LM curve.","Lowers the interest rate, because people want to hold fewer bonds when they earn more.","None of the above."],"steps":["Income is not on the axes of the money market graph, so a higher Y shifts money demand to the right and raises r.","Income is on the horizontal axis of the IS–LM graph, so the same change is a movement along the LM curve to a point with a higher Y and a higher r.","The LM curve shifts only when something that is not on its axes changes, such as the real money supply."]},"es":{"stem":"Con la oferta monetaria fija, un aumento de la renta:","options":["Desplaza la curva LM a la derecha, porque más transacciones necesitan más dinero para cada tipo.","Desplaza la curva de oferta de dinero a la izquierda, lo que eleva el tipo de interés en el mercado de dinero.","Desplaza la demanda de dinero a la derecha y mueve la economía a lo largo de la curva LM.","Reduce el tipo de interés, porque la gente quiere mantener menos bonos cuando gana más.","Ninguna de las anteriores."],"steps":["La renta no está en los ejes del gráfico del mercado de dinero, de modo que una Y mayor desplaza la demanda de dinero a la derecha y eleva r.","La renta está en el eje horizontal del gráfico IS-LM, de modo que el mismo cambio es un movimiento a lo largo de la curva LM hasta un punto con mayor Y y mayor r.","La curva LM solo se desplaza cuando cambia algo que no está en sus ejes, como la oferta monetaria real."]}},{"id":19,"topic":"lm","slides":[19,20],"correct":3,"en":{"stem":"Which change shifts the LM curve to the right?","options":["An increase in the real money supply.","A purchase of bonds by the central bank.","An increase in income.","Both A and B.","None of the above."],"steps":["In r = (a + bY − M/P)/h, a larger M/P lowers r at every income: the curve shifts down and to the right.","A purchase of bonds raises the money supply, so it has the same effect.","Income is on the horizontal axis of the LM graph: a change in Y is a movement along the curve."]},"es":{"stem":"¿Qué cambio desplaza la curva LM a la derecha?","options":["Un aumento de la oferta monetaria real.","Una compra de bonos por el banco central.","Un aumento de la renta.","Tanto A como B.","Ninguna de las anteriores."],"steps":["En r = (a + bY − M/P)/h, un M/P mayor reduce r para cada renta: la curva se desplaza hacia abajo y a la derecha.","Una compra de bonos eleva la oferta monetaria, de modo que tiene el mismo efecto.","La renta está en el eje horizontal del gráfico LM: un cambio de Y es un movimiento a lo largo de la curva."]}},{"id":20,"topic":"lm","slides":[21],"correct":4,"en":{"stem":"Money demand is M<sup>d<\/sup> = 50 + 0.4Y − 10r and the real money supply rises from 330 to 350. At every level of income, the new LM curve shows an interest rate that is:","options":["20 points lower.","2 points higher.","0.04 points lower.","50 points lower.","2 points lower."],"steps":["The LM curve is r = (50 + 0.4Y − M/P)/10.","An increase of 20 in M/P lowers r by 20/10 = 2 points at every income.","At a given interest rate, income is 20/0.4 = 50 higher: the curve shifts down by 2 and to the right by 50."]},"es":{"stem":"La demanda de dinero es M<sup>d<\/sup> = 50 + 0,4Y − 10r y la oferta monetaria real aumenta de 330 a 350. Para cada nivel de renta, la nueva curva LM indica un tipo de interés:","options":["20 puntos más bajo.","2 puntos más alto.","0,04 puntos más bajo.","50 puntos más bajo.","2 puntos más bajo."],"steps":["La curva LM es r = (50 + 0,4Y − M/P)/10.","Un aumento de 20 en M/P reduce r en 20/10 = 2 puntos para cada renta.","Para un tipo de interés dado, la renta es 20/0,4 = 50 mayor: la curva se desplaza 2 hacia abajo y 50 a la derecha."]}},{"id":21,"topic":"islm","slides":[25],"correct":1,"own":true,"en":{"stem":"An expansionary monetary policy in a large open economy that lowers the domestic interest rate would most likely generate which short-run chain of events?","options":["Currency appreciation → net exports rise → output Y increases.","Currency depreciation → net exports increase → aggregate demand increases.","Money supply decreases → interest rates fall → net exports fall.","Domestic bonds become more attractive to foreign investors, increasing capital inflows and lowering r.","None of the above."],"steps":["A lower domestic interest rate makes domestic assets less attractive: capital flows out and the currency depreciates.","A depreciation makes domestic goods cheaper abroad, so net exports rise, provided the Marshall–Lerner condition holds.","Higher net exports add to the effect of the lower r on consumption and investment: aggregate demand and output rise."]},"es":{"stem":"Una política monetaria expansiva en una economía abierta grande que reduce el tipo de interés nacional generaría, con mayor probabilidad, ¿qué cadena de efectos a corto plazo?","options":["Apreciación de la moneda → aumentan las exportaciones netas → aumenta la producción Y.","Depreciación de la moneda → aumentan las exportaciones netas → aumenta la demanda agregada.","Disminuye la oferta monetaria → bajan los tipos de interés → caen las exportaciones netas.","Los bonos nacionales resultan más atractivos para los inversores extranjeros, lo que aumenta las entradas de capital y reduce r.","Ninguna de las anteriores."],"steps":["Un tipo de interés nacional más bajo hace menos atractivos los activos nacionales: sale capital y la moneda se deprecia.","Una depreciación abarata los bienes nacionales en el exterior, de modo que las exportaciones netas aumentan, siempre que se cumpla la condición de Marshall-Lerner.","Unas exportaciones netas mayores se suman al efecto del menor r sobre el consumo y la inversión: la demanda agregada y la producción aumentan."]}},{"id":22,"topic":"islm","slides":[25],"correct":3,"own":true,"en":{"stem":"In the IS–LM model for an open economy, a major monetary expansion that lowers domestic interest rates is least likely to cause which immediate result?","options":["The LM curve shifts right, reducing interest rates.","The domestic currency depreciates in foreign exchange markets.","Net exports potentially increase due to the currency depreciation.","The IS curve shifts left in (Y, r) space, contracting aggregate output.","All of the above."],"steps":["A monetary expansion shifts the LM curve to the right and lowers r.","The lower r makes domestic assets less attractive, the currency depreciates and net exports can rise.","Nothing in this chain reduces autonomous spending, so the IS curve does not shift to the left; if anything, higher net exports shift it to the right."]},"es":{"stem":"En el modelo IS-LM de una economía abierta, ¿cuál de estos resultados inmediatos es el menos probable tras una fuerte expansión monetaria que reduce los tipos de interés nacionales?","options":["La curva LM se desplaza a la derecha y reduce los tipos de interés.","La moneda nacional se deprecia en el mercado de divisas.","Las exportaciones netas pueden aumentar por la depreciación de la moneda.","La curva IS se desplaza a la izquierda en el espacio (Y, r) y contrae la producción agregada.","Todas las anteriores."],"steps":["Una expansión monetaria desplaza la curva LM a la derecha y reduce r.","El menor r hace menos atractivos los activos nacionales, la moneda se deprecia y las exportaciones netas pueden aumentar.","Nada en esta cadena reduce el gasto autónomo, de modo que la curva IS no se desplaza a la izquierda; en todo caso, unas exportaciones netas mayores la desplazan a la derecha."]}},{"id":23,"topic":"islm","slides":[26],"correct":0,"own":true,"en":{"stem":"A positive productivity shock in an open economy can increase Y and raise r in the short run, if the money supply and P are fixed. How might this affect the exchange rate?","options":["A higher domestic interest rate attracts foreign capital, which can appreciate the domestic currency.","The exchange rate collapses to zero immediately because foreign investors fear inflation.","The shock reduces expected returns on domestic assets, leading to a depreciation.","Currency demand plummets as soon as Y increases.","None of the above."],"steps":["The higher interest rate makes domestic assets more attractive, so foreign capital flows in.","The productivity gain also raises exports. Both raise the demand for the domestic currency.","The supply of the currency rises by less, through higher imports, so the domestic currency appreciates."]},"es":{"stem":"Una perturbación positiva de productividad en una economía abierta puede aumentar Y y elevar r a corto plazo, si la oferta monetaria y P están fijos. ¿Cómo podría afectar al tipo de cambio?","options":["Un tipo de interés nacional más alto atrae capital extranjero, lo que puede apreciar la moneda nacional.","El tipo de cambio se desploma a cero de inmediato porque los inversores extranjeros temen la inflación.","La perturbación reduce la rentabilidad esperada de los activos nacionales, lo que provoca una depreciación.","La demanda de la moneda se hunde en cuanto aumenta Y.","Ninguna de las anteriores."],"steps":["El tipo de interés más alto hace más atractivos los activos nacionales, de modo que entra capital extranjero.","La mejora de productividad también eleva las exportaciones. Ambas cosas aumentan la demanda de moneda nacional.","La oferta de la moneda aumenta menos, a través de las mayores importaciones, de modo que la moneda nacional se aprecia."]}},{"id":24,"topic":"islm","slides":[27,28],"correct":0,"own":true,"en":{"stem":"Which statement best captures the mechanics of a liquidity trap?","options":["Interest rates are near zero, so increases in the money supply do not reduce r any further.","The reserve requirement k becomes zero, inducing banks to hold no cash.","Households prefer holding bonds to holding cash because bond yields are very high.","It arises when government spending permanently fixes the interest rate.","All of the above."],"steps":["When r is close to zero, bonds pay almost nothing and people are indifferent between money and bonds.","Any extra money is simply held: money demand is flat at that rate, so a larger money supply does not lower r.","With r unchanged, consumption, investment and output do not respond to monetary policy."]},"es":{"stem":"¿Qué afirmación recoge mejor el funcionamiento de una trampa de liquidez?","options":["Los tipos de interés están cerca de cero, de modo que los aumentos de la oferta monetaria ya no reducen más r.","El coeficiente de reservas k pasa a ser cero, lo que lleva a los bancos a no mantener efectivo.","Los hogares prefieren mantener bonos antes que efectivo porque la rentabilidad de los bonos es muy alta.","Surge cuando el gasto público fija de forma permanente el tipo de interés.","Todas las anteriores."],"steps":["Cuando r está cerca de cero, los bonos no pagan casi nada y la gente es indiferente entre dinero y bonos.","Cualquier dinero adicional simplemente se mantiene: la demanda de dinero es plana a ese tipo, de modo que una oferta monetaria mayor no reduce r.","Con r sin cambios, el consumo, la inversión y la producción no responden a la política monetaria."]}},{"id":25,"topic":"islm","slides":[27],"correct":1,"own":true,"en":{"stem":"In the context of a standard IS–LM model, if the economy is caught in a liquidity trap, which of the following is most consistent with theory?","options":["Open market purchases by the central bank continue to lower interest rates sharply.","Households and firms are indifferent between holding money and holding bonds at very low interest rates.","The demand for money collapses, forcing output Y to grow exponentially.","Interest rates approach infinity, causing consumption to plummet.","None of the above."],"steps":["At very low interest rates the return on bonds is almost zero, so holding money costs nothing.","People become indifferent between money and bonds and hold any extra money the central bank supplies.","This is why open market purchases no longer lower r."]},"es":{"stem":"En el contexto de un modelo IS-LM estándar, si la economía está atrapada en una trampa de liquidez, ¿cuál de las siguientes afirmaciones es más coherente con la teoría?","options":["Las compras en el mercado abierto del banco central siguen reduciendo con fuerza los tipos de interés.","Los hogares y las empresas son indiferentes entre mantener dinero y mantener bonos con tipos de interés muy bajos.","La demanda de dinero se hunde, lo que obliga a la producción Y a crecer de forma exponencial.","Los tipos de interés tienden a infinito, lo que hunde el consumo.","Ninguna de las anteriores."],"steps":["Con tipos de interés muy bajos la rentabilidad de los bonos es casi nula, de modo que mantener dinero no cuesta nada.","La gente se vuelve indiferente entre dinero y bonos y mantiene todo el dinero adicional que ofrece el banco central.","Por eso las compras en el mercado abierto ya no reducen r."]}},{"id":26,"topic":"islm","slides":[22,23],"correct":3,"en":{"stem":"China cuts its reserve requirement and Chinese income rises. In the United States, with the money supply fixed, we expect:","options":["Higher US exports and income.","A higher US interest rate, as the US economy moves along its LM curve.","A depreciation of the dollar against the yuan.","Both A and B.","None of the above."],"steps":["Higher income in China raises its imports, which are US exports: the US IS curve shifts to the right and US income rises.","More transactions raise US money demand; with the US money supply fixed, the US interest rate rises along the US LM curve.","Higher US rates and lower Chinese rates move capital towards the United States, so the dollar appreciates against the yuan: C is wrong."]},"es":{"stem":"China reduce su coeficiente de reservas y la renta china aumenta. En Estados Unidos, con la oferta monetaria fija, cabe esperar:","options":["Mayores exportaciones y renta en Estados Unidos.","Un tipo de interés estadounidense más alto, mientras la economía estadounidense se mueve a lo largo de su curva LM.","Una depreciación del dólar frente al yuan.","Tanto A como B.","Ninguna de las anteriores."],"steps":["Una renta mayor en China eleva sus importaciones, que son exportaciones estadounidenses: la curva IS de Estados Unidos se desplaza a la derecha y su renta aumenta.","Más transacciones elevan la demanda de dinero en Estados Unidos; con su oferta monetaria fija, el tipo de interés estadounidense sube a lo largo de su curva LM.","Unos tipos más altos en Estados Unidos y más bajos en China mueven el capital hacia Estados Unidos, de modo que el dólar se aprecia frente al yuan: C es incorrecta."]}},{"id":27,"topic":"islm","slides":[28],"correct":2,"en":{"stem":"The economy is in a liquidity trap. Which policy raises output?","options":["An open market purchase of bonds.","A cut in the reserve requirement.","A rise in government spending.","Both A and B.","None of the above."],"steps":["In the trap the LM curve is flat at an interest rate close to zero: a larger money supply only lengthens the flat segment of the LM curve, and r does not fall.","A purchase of bonds and a lower reserve requirement both raise the money supply, so neither of them raises output.","Higher government spending shifts the IS curve to the right; along the flat LM curve output rises without any increase in r."]},"es":{"stem":"La economía está en una trampa de liquidez. ¿Qué política eleva la producción?","options":["Una compra de bonos en el mercado abierto.","Una reducción del coeficiente de reservas.","Un aumento del gasto público.","Tanto A como B.","Ninguna de las anteriores."],"steps":["En la trampa la curva LM es plana a un tipo de interés cercano a cero: una oferta monetaria mayor solo alarga el tramo plano de la curva LM, y r no baja.","Una compra de bonos y un coeficiente de reservas menor elevan la oferta monetaria, de modo que ninguna de las dos eleva la producción.","Un mayor gasto público desplaza la curva IS a la derecha; sobre el tramo plano de la LM la producción aumenta sin que suba r."]}},{"id":28,"topic":"bp","slides":[30],"correct":4,"en":{"stem":"The BP curve shows:","options":["The combinations of income and the interest rate at which the current account is zero.","The combinations of income and the interest rate at which the money market and the bond market are both in equilibrium.","The combinations of the exchange rate and income at which exports equal imports.","Both A and B.","The combinations of income and the interest rate at which capital flows offset the current account."],"steps":["The balance of payments is BP = CA + FA, and external equilibrium requires BP = 0.","Along the BP curve a current account deficit is financed by net capital inflows, and a surplus is matched by net outflows.","The current account is zero at only one point of the curve, the trade-balance output Y<sub>TB<\/sub>, where r = r*."]},"es":{"stem":"La curva BP muestra:","options":["Las combinaciones de renta y tipo de interés en las que la cuenta corriente es cero.","Las combinaciones de renta y tipo de interés en las que el mercado de dinero y el de bonos están a la vez en equilibrio.","Las combinaciones de tipo de cambio y renta en las que las exportaciones igualan a las importaciones.","Tanto A como B.","Las combinaciones de renta y tipo de interés en las que los flujos de capital compensan la cuenta corriente."],"steps":["La balanza de pagos es BP = CC + CF, y el equilibrio externo exige BP = 0.","A lo largo de la curva BP, un déficit por cuenta corriente se financia con entradas netas de capital, y un superávit se compensa con salidas netas.","La cuenta corriente solo es cero en un punto de la curva, la producción de equilibrio comercial Y<sub>TB<\/sub>, donde r = r*."]}},{"id":29,"topic":"bp","slides":[32,35],"correct":0,"own":true,"en":{"stem":"If the BP curve has a positive slope, this suggests that:","options":["Capital mobility is imperfect: higher income raises imports, so a higher r is needed to finance them.","The current account balance is irrelevant to the BP, because only capital flows enter it.","Exports depend more on domestic interest rates than on foreign demand, so the slope is positive.","High capital mobility leads to a steeper BP curve.","The BP is always balanced regardless of domestic output."],"steps":["The slope of the BP curve is m<sub>1<\/sub>/(f·ER<sub>0<\/sub>), positive whenever capital mobility f is finite.","A higher income raises imports and worsens the current account; only a higher interest rate attracts the capital inflows that keep BP = 0.","Higher capital mobility makes the curve flatter, and with perfect mobility it becomes horizontal."]},"es":{"stem":"Si la curva BP tiene pendiente positiva, esto indica que:","options":["La movilidad del capital es imperfecta: una renta mayor eleva las importaciones, y hace falta un r más alto para financiarlas.","El saldo de la cuenta corriente es irrelevante para la BP, porque en ella solo entran los flujos de capital.","Las exportaciones dependen más del tipo de interés nacional que de la demanda exterior, de modo que la pendiente es positiva.","Una alta movilidad del capital hace más inclinada la curva BP.","La BP siempre está equilibrada, sea cual sea la producción nacional."],"steps":["La pendiente de la curva BP es m<sub>1<\/sub>/(f·ER<sub>0<\/sub>), positiva siempre que la movilidad del capital f sea finita.","Una renta mayor eleva las importaciones y empeora la cuenta corriente; solo un tipo de interés más alto atrae las entradas de capital que mantienen BP = 0.","Una mayor movilidad del capital hace la curva más plana, y con movilidad perfecta se vuelve horizontal."]}},{"id":30,"topic":"bp","slides":[35],"correct":1,"own":true,"en":{"stem":"When m<sub>1<\/sub> &gt; f, with ER<sub>0<\/sub> = 1, it implies that:","options":["Capital mobility is high, and the financial account dominates the BP curve.","The current account dominates, creating a steeper BP curve.","The BP curve is flat, showing high sensitivity to foreign interest rates.","Import demand is highly elastic to income changes abroad.","The BP is independent of domestic production levels."],"steps":["With ER<sub>0<\/sub> = 1 the slope of the BP curve is m<sub>1<\/sub>/f, so m<sub>1<\/sub> &gt; f means a slope above 1.","Imports respond strongly to income and capital responds weakly to the interest rate: a rise in Y needs a large rise in r to keep BP = 0.","The current account dominates and the BP curve is steep."]},"es":{"stem":"Cuando m<sub>1<\/sub> &gt; f, con ER<sub>0<\/sub> = 1, esto implica que:","options":["La movilidad del capital es alta y la cuenta financiera domina la curva BP.","Domina la cuenta corriente, lo que da una curva BP más inclinada.","La curva BP es plana y muestra una alta sensibilidad al tipo de interés extranjero.","La demanda de importaciones es muy elástica a los cambios de la renta en el exterior.","La BP no depende del nivel de producción nacional."],"steps":["Con ER<sub>0<\/sub> = 1 la pendiente de la curva BP es m<sub>1<\/sub>/f, de modo que m<sub>1<\/sub> &gt; f supone una pendiente mayor que 1.","Las importaciones responden mucho a la renta y el capital responde poco al tipo de interés: un aumento de Y necesita una subida grande de r para mantener BP = 0.","Domina la cuenta corriente y la curva BP es inclinada."]}},{"id":31,"topic":"bp","slides":[35,45],"correct":0,"own":true,"en":{"stem":"In the BP model, if the slope of the BP curve decreases, it is most likely due to:","options":["A rise in f, indicating greater capital mobility.","An increase in the marginal propensity to import.","Reduced sensitivity of exports to foreign income.","Smaller capital flows in response to interest rate changes.","An increase in foreign income Y*."],"steps":["The slope is m<sub>1<\/sub>/(f·ER<sub>0<\/sub>): it falls when f rises or when m<sub>1<\/sub> falls.","A higher marginal propensity to import and weaker capital responses, a lower f, make the curve steeper.","Export conditions and foreign income enter the intercept, not the slope: they shift the curve."]},"es":{"stem":"En el modelo BP, si la pendiente de la curva BP disminuye, lo más probable es que se deba a:","options":["Un aumento de f, que indica una mayor movilidad del capital.","Un aumento de la propensión marginal a importar.","Una menor sensibilidad de las exportaciones a la renta extranjera.","Unos flujos de capital menores en respuesta a los cambios del tipo de interés.","Un aumento de la renta extranjera Y*."],"steps":["La pendiente es m<sub>1<\/sub>/(f·ER<sub>0<\/sub>): disminuye cuando f aumenta o cuando m<sub>1<\/sub> disminuye.","Una propensión marginal a importar mayor y unas respuestas del capital más débiles, una f más baja, hacen la curva más inclinada.","Las condiciones de exportación y la renta extranjera entran en la ordenada en el origen, no en la pendiente: desplazan la curva."]}},{"id":32,"topic":"bp","slides":[36,37],"correct":1,"own":true,"en":{"stem":"With a steep BP curve, the balance of payments is most likely influenced by:","options":["High capital mobility and low sensitivity to foreign income.","Low capital mobility, which makes the current account more dominant.","High sensitivity of the financial account to interest rate changes.","Strong responses of export demand to changes in the exchange rate.","Low sensitivity of imports to domestic income changes."],"steps":["A steep curve has a large slope m<sub>1<\/sub>/(f·ER<sub>0<\/sub>): f is small or m<sub>1<\/sub> is large.","With low capital mobility, capital hardly responds to r, so the current account drives the balance of payments.","High capital mobility or a low sensitivity of imports to income would make the curve flat."]},"es":{"stem":"Con una curva BP inclinada, lo más probable es que en la balanza de pagos influya:","options":["Una alta movilidad del capital y una baja sensibilidad a la renta extranjera.","Una baja movilidad del capital, que hace que domine la cuenta corriente.","Una alta sensibilidad de la cuenta financiera a los cambios del tipo de interés.","Una fuerte respuesta de la demanda de exportaciones a los cambios del tipo de cambio.","Una baja sensibilidad de las importaciones a los cambios de la renta nacional."],"steps":["Una curva inclinada tiene una pendiente m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) grande: f es pequeña o m<sub>1<\/sub> es grande.","Con baja movilidad del capital, el capital apenas responde a r, de modo que la cuenta corriente determina la balanza de pagos.","Una alta movilidad del capital o una baja sensibilidad de las importaciones a la renta harían la curva plana."]}},{"id":33,"topic":"bp","slides":[36],"correct":3,"en":{"stem":"With perfect capital mobility (f → ∞), the BP curve:","options":["Is horizontal at r = r*.","Reflects that any difference between r and r* would trigger unlimited capital flows.","Is vertical at the trade-balance output.","Both A and B.","None of the above."],"steps":["The slope m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) tends to zero as f grows without limit.","The smallest difference between r and r* would cause unlimited capital flows, so external balance requires r = r* at every income: the curve is horizontal.","A vertical curve corresponds to the opposite case, zero capital mobility."]},"es":{"stem":"Con movilidad perfecta del capital (f → ∞), la curva BP:","options":["Es horizontal en r = r*.","Refleja que cualquier diferencia entre r y r* provocaría flujos de capital ilimitados.","Es vertical en la producción de equilibrio comercial.","Tanto A como B.","Ninguna de las anteriores."],"steps":["La pendiente m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) tiende a cero cuando f crece sin límite.","La menor diferencia entre r y r* provocaría flujos de capital ilimitados, de modo que el equilibrio externo exige r = r* para cualquier renta: la curva es horizontal.","Una curva vertical corresponde al caso opuesto, movilidad del capital nula."]}},{"id":34,"topic":"bp","slides":[32,51,74],"correct":4,"en":{"stem":"Imports are M = 0.2Y/ER<sub>0<\/sub>, exports are X = 0.1Y*·ER<sub>0<\/sub> with Y* = 2,000, FA = 20(r − r*) and ER<sub>0<\/sub> = 1. The slope of the BP curve and the trade-balance output Y<sub>TB<\/sub> are:","options":["0.2 and 1,000.","100 and 1,000.","0.01 and 2,000.","0.1 and 1,000.","0.01 and 1,000."],"steps":["The slope is m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) = 0.2/(20 × 1) = 0.01.","Trade is balanced when X = M: 0.1 × 2,000 = 0.2Y, so Y<sub>TB<\/sub> = 1,000.","At Y<sub>TB<\/sub> the BP curve passes through r = r*."]},"es":{"stem":"Las importaciones son M = 0,2Y/ER<sub>0<\/sub>, las exportaciones X = 0,1Y*·ER<sub>0<\/sub> con Y* = 2.000, CF = 20(r − r*) y ER<sub>0<\/sub> = 1. La pendiente de la curva BP y la producción de equilibrio comercial Y<sub>TB<\/sub> son:","options":["0,2 y 1.000.","100 y 1.000.","0,01 y 2.000.","0,1 y 1.000.","0,01 y 1.000."],"steps":["La pendiente es m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) = 0,2/(20 × 1) = 0,01.","El comercio está equilibrado cuando X = M: 0,1 × 2.000 = 0,2Y, de modo que Y<sub>TB<\/sub> = 1.000.","En Y<sub>TB<\/sub> la curva BP pasa por r = r*."]}},{"id":35,"topic":"bpuse","slides":[39,40],"correct":3,"own":true,"en":{"stem":"Which of the following best explains why a point below the BP curve represents a balance of payments deficit?","options":["Interest rates are too high, attracting excessive capital inflows into the domestic economy.","The current account is in surplus while the financial account is balanced.","Exports are high, but capital inflows create an excessive surplus.","r is too low for that income, so capital flows do not offset the current account.","None of the above."],"steps":["Points on the BP curve give, for each income, the interest rate that keeps BP = 0.","Below the curve the interest rate is lower than that: capital inflows are too small, or outflows too large, for the current account at that income.","The financial account no longer offsets the current account, so BP &lt; 0."]},"es":{"stem":"¿Cuál de las siguientes explica mejor por qué un punto por debajo de la curva BP representa un déficit de la balanza de pagos?","options":["Los tipos de interés son demasiado altos y atraen entradas de capital excesivas hacia la economía nacional.","La cuenta corriente tiene superávit y la cuenta financiera está equilibrada.","Las exportaciones son altas, pero las entradas de capital crean un superávit excesivo.","r es demasiado bajo para esa renta, de modo que los flujos de capital no compensan la cuenta corriente.","Ninguna de las anteriores."],"steps":["Los puntos de la curva BP dan, para cada renta, el tipo de interés que mantiene BP = 0.","Por debajo de la curva el tipo de interés es menor: las entradas de capital son demasiado pequeñas, o las salidas demasiado grandes, para la cuenta corriente a esa renta.","La cuenta financiera ya no compensa la cuenta corriente, de modo que BP &lt; 0."]}},{"id":36,"topic":"bpuse","slides":[39],"correct":0,"own":true,"en":{"stem":"If a point lies above the BP curve, this indicates:","options":["A balance of payments surplus, as capital inflows exceed what the current account needs.","A balance of payments deficit, with capital outflows exceeding exports.","A current account deficit, offset by a reduction in exports.","An equilibrium in the BP, as capital inflows match the trade balance.","No effect on the BP, as capital mobility is low."],"steps":["Above the curve the interest rate is higher than the one that keeps BP = 0 at that income.","The higher interest rate attracts more capital than the current account requires, so BP &gt; 0.","A surplus puts upward pressure on the value of the domestic currency."]},"es":{"stem":"Si un punto está por encima de la curva BP, esto indica:","options":["Un superávit de la balanza de pagos, porque las entradas de capital superan lo que necesita la cuenta corriente.","Un déficit de la balanza de pagos, con salidas de capital superiores a las exportaciones.","Un déficit por cuenta corriente, compensado con una reducción de las exportaciones.","Un equilibrio de la BP, porque las entradas de capital igualan el saldo comercial.","Ningún efecto sobre la BP, porque la movilidad del capital es baja."],"steps":["Por encima de la curva el tipo de interés es mayor que el que mantiene BP = 0 a esa renta.","El tipo de interés más alto atrae más capital del que requiere la cuenta corriente, de modo que BP &gt; 0.","Un superávit presiona al alza el valor de la moneda nacional."]}},{"id":37,"topic":"bpuse","slides":[45,46],"correct":1,"own":true,"en":{"stem":"If the BP is driven mainly by the financial account, an increase in the foreign interest rate r* would likely:","options":["Improve the BP by attracting foreign capital inflows.","Worsen the BP as capital outflows increase.","Have little effect on the BP, as only domestic output matters.","Lead to a surplus in the current account.","Reduce export demand, balancing the BP curve."],"steps":["A higher r* makes foreign assets more attractive: at the same domestic interest rate, capital flows out.","The financial account worsens, so at each income a higher domestic r is needed to keep BP = 0.","The BP curve shifts up, and the effect is large when capital mobility is high."]},"es":{"stem":"Si la BP depende sobre todo de la cuenta financiera, un aumento del tipo de interés extranjero r* probablemente:","options":["Mejoraría la BP al atraer entradas de capital extranjero.","Empeoraría la BP al aumentar las salidas de capital.","Apenas afectaría a la BP, porque solo importa la producción nacional.","Generaría un superávit por cuenta corriente.","Reduciría la demanda de exportaciones y equilibraría la curva BP."],"steps":["Un r* más alto hace más atractivos los activos extranjeros: con el mismo tipo de interés nacional, sale capital.","La cuenta financiera empeora, de modo que para cada renta hace falta un r nacional más alto para mantener BP = 0.","La curva BP se desplaza hacia arriba, y el efecto es grande cuando la movilidad del capital es alta."]}},{"id":38,"topic":"bpuse","slides":[45,46],"correct":2,"own":true,"en":{"stem":"If the BP curve shifts upward, it could indicate that:","options":["Foreign income has increased, raising demand for exports.","Domestic interest rates have fallen, attracting capital inflows.","Export demand has fallen because of lower foreign income.","Domestic income has risen.","Capital outflows have exceeded domestic savings."],"steps":["Lower foreign income reduces exports and worsens the current account at every domestic income.","To keep BP = 0 the economy needs more capital inflows, that is, a higher interest rate at each income: the curve shifts up.","Higher foreign income shifts it down, and changes in Y or r are movements along the curve."]},"es":{"stem":"Si la curva BP se desplaza hacia arriba, podría indicar que:","options":["La renta extranjera ha aumentado y eleva la demanda de exportaciones.","Los tipos de interés nacionales han bajado y atraen entradas de capital.","La demanda de exportaciones ha caído por una menor renta extranjera.","La renta nacional ha aumentado.","Las salidas de capital han superado al ahorro nacional."],"steps":["Una renta extranjera menor reduce las exportaciones y empeora la cuenta corriente para cada renta nacional.","Para mantener BP = 0 la economía necesita más entradas de capital, es decir, un tipo de interés más alto para cada renta: la curva se desplaza hacia arriba.","Una renta extranjera mayor la desplaza hacia abajo, y los cambios de Y o de r son movimientos a lo largo de la curva."]}},{"id":39,"topic":"bpuse","slides":[43,44],"correct":4,"en":{"stem":"The government raises spending. Capital mobility is high and the BP curve is flatter than the LM curve. At the new IS–LM equilibrium:","options":["The balance of payments is in deficit and the currency depreciates.","The BP curve shifts to the right.","Income falls and the interest rate rises.","The balance of payments is balanced, because the current account worsens.","The balance of payments is in surplus and the currency appreciates."],"steps":["The IS curve shifts to the right: income and the interest rate both rise along the LM curve.","With high capital mobility the rise in r attracts more capital than the extra imports require, so the new point lies above the BP curve.","The balance of payments is in surplus and the domestic currency appreciates. With a BP curve steeper than the LM curve the result is the opposite: a deficit and a depreciation."]},"es":{"stem":"El Gobierno aumenta el gasto. La movilidad del capital es alta y la curva BP es más plana que la curva LM. En el nuevo equilibrio IS-LM:","options":["La balanza de pagos tiene déficit y la moneda se deprecia.","La curva BP se desplaza a la derecha.","La renta cae y el tipo de interés sube.","La balanza de pagos está equilibrada, porque la cuenta corriente empeora.","La balanza de pagos tiene superávit y la moneda se aprecia."],"steps":["La curva IS se desplaza a la derecha: la renta y el tipo de interés suben a lo largo de la curva LM.","Con alta movilidad del capital, la subida de r atrae más capital del que requieren las importaciones adicionales, de modo que el nuevo punto queda por encima de la curva BP.","La balanza de pagos tiene superávit y la moneda nacional se aprecia. Con una curva BP más inclinada que la LM el resultado es el contrario: déficit y depreciación."]}},{"id":40,"topic":"bpuse","slides":[39,75],"correct":3,"en":{"stem":"At the IS–LM equilibrium, Y = 1,000 and r = 5. Exports are 200, imports are M = 0.2Y and FA = 20(r − r*) with r* = 3. The balance of payments is:","options":["BP = 0: the economy is on the BP curve.","BP = −40: a deficit.","BP = 200: a surplus.","BP = 40: a surplus.","None of the above."],"steps":["The current account is CA = 200 − 0.2 × 1,000 = 0.","The financial account is FA = 20 × (5 − 3) = 40.","BP = 0 + 40 = 40 &gt; 0: the point lies above the BP curve, the balance of payments is in surplus and the domestic currency tends to appreciate."]},"es":{"stem":"En el equilibrio IS-LM, Y = 1.000 y r = 5. Las exportaciones son 200, las importaciones M = 0,2Y y CF = 20(r − r*) con r* = 3. La balanza de pagos es:","options":["BP = 0: la economía está sobre la curva BP.","BP = −40: un déficit.","BP = 200: un superávit.","BP = 40: un superávit.","Ninguna de las anteriores."],"steps":["La cuenta corriente es CC = 200 − 0,2 × 1.000 = 0.","La cuenta financiera es CF = 20 × (5 − 3) = 40.","BP = 0 + 40 = 40 &gt; 0: el punto está por encima de la curva BP, la balanza de pagos tiene superávit y la moneda nacional tiende a apreciarse."]}},{"id":41,"topic":"mf","slides":[49,50],"correct":0,"en":{"stem":"The goods market is Y = C + I + G + NX, with C = c<sub>0<\/sub> + c<sub>1<\/sub>Y<sub>D<\/sub>, Y<sub>D<\/sub> = Y + @o{TR} − @o{T}, I = @o{I} + αY − dr and NX = xY*·ER<sub>0<\/sub> − m<sub>1<\/sub>Y/ER<sub>0<\/sub>. The IS curve is:","options":["r = @o{A}/d − (σ/d)Y, with σ = 1 − c<sub>1<\/sub> − α + m<sub>1<\/sub>/ER<sub>0<\/sub>.","r = @o{A}/d + (σ/d)Y, with σ = 1 − c<sub>1<\/sub> − α + m<sub>1<\/sub>/ER<sub>0<\/sub>.","r = @o{A}/d − (σ/d)Y, with σ = 1 − c<sub>1<\/sub> − α − m<sub>1<\/sub>/ER<sub>0<\/sub>.","Y = @o{A} − dr, because the multiplier appears only in the LM curve.","None of the above."],"steps":["Substitute the functions into Y = C + I + G + NX and collect the autonomous terms: @o{A} = c<sub>0<\/sub> + c<sub>1<\/sub>(@o{TR} − @o{T}) + @o{I} + @o{G} + xY*·ER<sub>0<\/sub>.","Move the terms in Y to the left: (1 − c<sub>1<\/sub> − α + m<sub>1<\/sub>/ER<sub>0<\/sub>)Y = @o{A} − dr, that is, σY = @o{A} − dr. Imports are a leakage, so m<sub>1<\/sub>/ER<sub>0<\/sub> enters σ with a plus sign.","Divide by d and solve for r: r = @o{A}/d − (σ/d)Y, a downward-sloping line."]},"es":{"stem":"El mercado de bienes es Y = C + I + G + NX, con C = c<sub>0<\/sub> + c<sub>1<\/sub>Y<sub>D<\/sub>, Y<sub>D<\/sub> = Y + @o{TR} − @o{T}, I = @o{I} + αY − dr y NX = xY*·ER<sub>0<\/sub> − m<sub>1<\/sub>Y/ER<sub>0<\/sub>. La curva IS es:","options":["r = @o{A}/d − (σ/d)Y, con σ = 1 − c<sub>1<\/sub> − α + m<sub>1<\/sub>/ER<sub>0<\/sub>.","r = @o{A}/d + (σ/d)Y, con σ = 1 − c<sub>1<\/sub> − α + m<sub>1<\/sub>/ER<sub>0<\/sub>.","r = @o{A}/d − (σ/d)Y, con σ = 1 − c<sub>1<\/sub> − α − m<sub>1<\/sub>/ER<sub>0<\/sub>.","Y = @o{A} − dr, porque el multiplicador solo aparece en la curva LM.","Ninguna de las anteriores."],"steps":["Se sustituyen las funciones en Y = C + I + G + NX y se reúnen los términos autónomos: @o{A} = c<sub>0<\/sub> + c<sub>1<\/sub>(@o{TR} − @o{T}) + @o{I} + @o{G} + xY*·ER<sub>0<\/sub>.","Se pasan los términos en Y a la izquierda: (1 − c<sub>1<\/sub> − α + m<sub>1<\/sub>/ER<sub>0<\/sub>)Y = @o{A} − dr, es decir, σY = @o{A} − dr. Las importaciones son una fuga, de modo que m<sub>1<\/sub>/ER<sub>0<\/sub> entra en σ con signo positivo.","Se divide por d y se despeja r: r = @o{A}/d − (σ/d)Y, una recta con pendiente negativa."]}},{"id":42,"topic":"mf","slides":[52,54],"correct":1,"en":{"stem":"In the full model, equilibrium income is Y<sub>e<\/sub> = [h@o{A} + d(@o{M}/@o{P} − a)]/(hσ + bd). The effect of government spending, ΔY<sub>e<\/sub>/Δ@o{G}, is:","options":["1/σ, the same as in the goods market, because the IS curve shifts by Δ@o{G}/σ.","h/(hσ + bd), smaller than 1/σ because the rise in r crowds out investment.","d/(hσ + bd), the same as the effect of the real money supply.","b/(hσ + bd), because the rise in income raises money demand and the interest rate.","Zero, because the money supply does not change and the LM curve does not move."],"steps":["@o{G} enters Y<sub>e<\/sub> only through @o{A}, which is multiplied by h/(hσ + bd).","Dividing numerator and denominator by h gives 1/(σ + bd/h): the extra term bd/h makes the multiplier smaller than 1/σ.","The term bd/h is crowding out: a higher Y raises money demand (b), the interest rate rises (1/h) and investment falls (d)."]},"es":{"stem":"En el modelo completo, la renta de equilibrio es Y<sub>e<\/sub> = [h@o{A} + d(@o{M}/@o{P} − a)]/(hσ + bd). El efecto del gasto público, ΔY<sub>e<\/sub>/Δ@o{G}, es:","options":["1/σ, igual que en el mercado de bienes, porque la IS se desplaza Δ@o{G}/σ.","h/(hσ + bd), menor que 1/σ porque la subida de r expulsa inversión.","d/(hσ + bd), igual que el efecto de la oferta monetaria real.","b/(hσ + bd), porque la subida de la renta eleva la demanda de dinero y el tipo de interés.","Cero, porque la cantidad de dinero no cambia y la curva LM no se mueve."],"steps":["@o{G} entra en Y<sub>e<\/sub> solo a través de @o{A}, que está multiplicado por h/(hσ + bd).","Al dividir numerador y denominador por h se obtiene 1/(σ + bd/h): el término adicional bd/h hace el multiplicador menor que 1/σ.","El término bd/h es el efecto expulsión: una Y mayor eleva la demanda de dinero (b), el tipo de interés sube (1/h) y la inversión cae (d)."]}},{"id":43,"topic":"mf","slides":[54,55],"correct":2,"en":{"stem":"With ER<sub>0<\/sub> and the money supply given, which change makes the fiscal multiplier h/(hσ + bd) larger?","options":["A smaller h: money demand less sensitive to the interest rate.","A larger d: investment more sensitive to the interest rate.","A larger h: money demand more sensitive to the interest rate.","A larger b: money demand more sensitive to income.","A larger m<sub>1<\/sub>: a higher propensity to import."],"steps":["The multiplier is 1/(σ + bd/h): it is larger when the crowding-out term bd/h or the leakage σ is smaller.","A larger h lowers bd/h: when money demand responds strongly to r, a small rise in r clears the money market, and little investment is crowded out.","A smaller h, a larger d or a larger b raise bd/h, and a larger m<sub>1<\/sub> raises σ: all of them lower the multiplier. With h → ∞, the liquidity trap, it reaches 1/σ."]},"es":{"stem":"Con ER<sub>0<\/sub> y la cantidad de dinero dados, ¿qué cambio hace mayor el multiplicador fiscal h/(hσ + bd)?","options":["Una h menor: demanda de dinero menos sensible al tipo de interés.","Una d mayor: inversión más sensible al tipo de interés.","Una h mayor: demanda de dinero más sensible al tipo de interés.","Una b mayor: demanda de dinero más sensible a la renta.","Una m<sub>1<\/sub> mayor: una propensión a importar más alta."],"steps":["El multiplicador es 1/(σ + bd/h): es mayor cuando el término de expulsión bd/h o la fuga σ son menores.","Una h mayor reduce bd/h: cuando la demanda de dinero responde mucho a r, una pequeña subida de r equilibra el mercado de dinero, y se expulsa poca inversión.","Una h menor, una d mayor o una b mayor elevan bd/h, y una m<sub>1<\/sub> mayor eleva σ: todas reducen el multiplicador. Con h → ∞, la trampa de liquidez, llega a 1/σ."]}},{"id":44,"topic":"mf","slides":[52,74,75],"correct":3,"en":{"stem":"Autonomous spending is @o{A} = 750, σ = 0.5 and d = 50, so that IS is 0.5Y = 750 − 50r. Money demand is M<sup>d<\/sup> = 100 + 0.5Y − 20r and @o{M}/@o{P} = 500. The equilibrium is:","options":["Y = 1,500 and r = 0.","Y = 1,100 and r = 4.","Y = 1,000 and r = 3.","Y = 1,000 and r = 5.","None of the above."],"steps":["IS: 0.5Y = 750 − 50r, so r = 15 − 0.01Y. LM: 500 = 100 + 0.5Y − 20r, so r = 0.025Y − 20.","Equating the two: 0.035Y = 35, so Y = 1,000 and r = 0.025 × 1,000 − 20 = 5.","The formula gives the same result: (20 × 750 + 50 × 400)/(20 × 0.5 + 0.5 × 50) = 35,000/35 = 1,000."]},"es":{"stem":"El gasto autónomo es @o{A} = 750, σ = 0,5 y d = 50, de modo que la IS es 0,5Y = 750 − 50r. La demanda de dinero es M<sup>d<\/sup> = 100 + 0,5Y − 20r y @o{M}/@o{P} = 500. El equilibrio es:","options":["Y = 1.500 y r = 0.","Y = 1.100 y r = 4.","Y = 1.000 y r = 3.","Y = 1.000 y r = 5.","Ninguna de las anteriores."],"steps":["IS: 0,5Y = 750 − 50r, de modo que r = 15 − 0,01Y. LM: 500 = 100 + 0,5Y − 20r, de modo que r = 0,025Y − 20.","Al igualarlas: 0,035Y = 35, de modo que Y = 1.000 y r = 0,025 × 1.000 − 20 = 5.","La fórmula da el mismo resultado: (20 × 750 + 50 × 400)/(20 × 0,5 + 0,5 × 50) = 35.000/35 = 1.000."]}},{"id":45,"topic":"mf","slides":[56],"correct":4,"en":{"stem":"With ER<sub>0<\/sub>, Y* and r* given, a monetary expansion moves the balance of payments:","options":["Towards a surplus, because the lower interest rate attracts capital.","Towards a surplus if the BP curve is flatter than the LM curve.","Towards a deficit only if capital mobility is low, because then the BP curve is steeper than the LM curve.","Nowhere, because the money supply does not enter the BP equation.","Towards a deficit, always: imports rise with Y and capital leaves as r falls."],"steps":["ΔBP = −(m<sub>1<\/sub>/ER<sub>0<\/sub>)ΔY + fΔr.","A monetary expansion raises Y and lowers r, so both terms are negative: the current account and the financial account worsen together.","ΔBP/Δ(@o{M}/@o{P}) = −[(m<sub>1<\/sub>/ER<sub>0<\/sub>)d + fσ]/(hσ + bd) &lt; 0, whatever the slopes of the BP and LM curves."]},"es":{"stem":"Con ER<sub>0<\/sub>, Y* y r* dados, una expansión monetaria lleva la balanza de pagos:","options":["Hacia el superávit, porque el tipo de interés más bajo atrae capital.","Hacia el superávit si la curva BP es más plana que la LM.","Hacia el déficit solo si la movilidad del capital es baja, porque entonces la BP es más inclinada que la LM.","A ninguna parte, porque la cantidad de dinero no entra en la ecuación BP.","Hacia el déficit, siempre: las importaciones suben con Y y el capital sale al bajar r."],"steps":["ΔBP = −(m<sub>1<\/sub>/ER<sub>0<\/sub>)ΔY + fΔr.","Una expansión monetaria eleva Y y reduce r, de modo que los dos términos son negativos: la cuenta corriente y la cuenta financiera empeoran a la vez.","ΔBP/Δ(@o{M}/@o{P}) = −[(m<sub>1<\/sub>/ER<sub>0<\/sub>)d + fσ]/(hσ + bd) &lt; 0, sean cuales sean las pendientes de las curvas BP y LM."]}},{"id":46,"topic":"mfreg","slides":[64,70],"correct":1,"en":{"stem":"With perfect capital mobility and a flexible exchange rate, a fiscal expansion:","options":["Raises Y by the full multiplier 1/σ, because the interest rate stays at r*.","Leaves Y unchanged: the currency appreciates and net exports fall by as much as G rises.","Raises Y and keeps r permanently above r*, which attracts capital inflows every period.","Lowers Y, because the appreciation reduces net exports by more than G rises.","Both A and C."],"steps":["The IS curve shifts right and r tends to rise above r*: capital flows in and the domestic currency appreciates.","The appreciation lowers net exports and shifts the IS curve back, until r = r* again.","The LM curve has not moved, so with r = r* income is the same as before: ΔNX = −Δ@o{G}."]},"es":{"stem":"Con movilidad perfecta del capital y tipo de cambio flexible, una expansión fiscal:","options":["Eleva Y con el multiplicador completo 1/σ, porque el tipo de interés se queda en r*.","Deja Y sin cambios: la moneda se aprecia y las exportaciones netas caen tanto como sube G.","Eleva Y y mantiene r por encima de r* de forma permanente, lo que atrae entradas de capital en cada periodo.","Reduce Y, porque la apreciación reduce las exportaciones netas más de lo que sube G.","Tanto A como C."],"steps":["La IS se desplaza a la derecha y r tiende a subir por encima de r*: entra capital y la moneda nacional se aprecia.","La apreciación reduce las exportaciones netas y hace retroceder la IS, hasta que r = r* de nuevo.","La LM no se ha movido, de modo que con r = r* la renta es la misma que antes: ΔNX = −Δ@o{G}."]}},{"id":47,"topic":"mfreg","slides":[68,70],"correct":2,"en":{"stem":"With perfect capital mobility and a fixed exchange rate, a monetary expansion:","options":["Raises Y, because the lower interest rate stimulates investment and consumption.","Depreciates the currency, which raises net exports and shifts the IS curve right.","Leaves Y and r unchanged, and the central bank loses foreign reserves.","Raises Y by Δ(@o{M}/@o{P})/b, as with a flexible exchange rate.","Both A and B."],"steps":["The LM curve shifts right and r tends to fall below r*: capital flows out.","To hold the exchange rate, the central bank sells foreign currency, and the money supply falls.","The LM curve returns to its initial position: Y and r do not change, and reserves are lower."]},"es":{"stem":"Con movilidad perfecta del capital y tipo de cambio fijo, una expansión monetaria:","options":["Eleva Y, porque el tipo de interés más bajo estimula la inversión y el consumo.","Deprecia la moneda, lo que eleva las exportaciones netas y desplaza la IS a la derecha.","Deja Y y r sin cambios, y el banco central pierde reservas de divisas.","Eleva Y en Δ(@o{M}/@o{P})/b, como con tipo de cambio flexible.","Tanto A como B."],"steps":["La LM se desplaza a la derecha y r tiende a bajar por debajo de r*: sale capital.","Para mantener el tipo de cambio, el banco central vende divisas, y la cantidad de dinero baja.","La LM vuelve a su posición inicial: Y y r no cambian, y las reservas son menores."]}},{"id":48,"topic":"mfreg","slides":[60,76],"correct":3,"en":{"stem":"Under a fixed exchange rate, the IS–LM equilibrium lies above the BP curve. The adjustment is:","options":["The currency appreciates, which shifts the IS curve to the left and the BP curve up until the three curves meet.","The central bank sells foreign currency to defend the rate, so the money supply falls and the LM curve shifts left.","The currency depreciates, which raises net exports and shifts the IS curve to the right.","The central bank buys foreign currency, the money supply rises and the LM curve shifts right.","None of the above."],"steps":["Above the BP curve there is a surplus: an excess demand for the domestic currency.","To stop the appreciation, the central bank buys the foreign currency and pays with domestic currency: its reserves and the money supply rise.","The LM curve shifts right, r falls and Y rises, until BP = 0 where IS and BP cross. Option A describes the flexible exchange rate."]},"es":{"stem":"Con tipo de cambio fijo, el equilibrio IS-LM está por encima de la curva BP. El ajuste es:","options":["La moneda se aprecia, lo que desplaza la IS a la izquierda y la BP hacia arriba hasta que las tres curvas se cortan.","El banco central vende divisas para defender el tipo, de modo que la cantidad de dinero baja y la LM se desplaza a la izquierda.","La moneda se deprecia, lo que eleva las exportaciones netas y desplaza la IS a la derecha.","El banco central compra divisas, la cantidad de dinero aumenta y la LM se desplaza a la derecha.","Ninguna de las anteriores."],"steps":["Por encima de la curva BP hay superávit: un exceso de demanda de moneda nacional.","Para frenar la apreciación, el banco central compra las divisas y paga con moneda nacional: sus reservas y la cantidad de dinero aumentan.","La LM se desplaza a la derecha, r baja e Y sube, hasta que BP = 0 donde se cortan IS y BP. La opción A describe el tipo de cambio flexible."]}},{"id":49,"topic":"mfreg","slides":[70],"correct":0,"en":{"stem":"Which statement about the policy t
