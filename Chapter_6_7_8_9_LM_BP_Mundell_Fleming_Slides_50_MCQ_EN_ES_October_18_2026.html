co efecto duradero es la pérdida de reservas de divisas.<\/li><\/ol>\n<p class=\"hl\">La política monetaria es ineficaz: con tipo de cambio fijo y libre movimiento de capitales, el banco central no puede elegir la cantidad de dinero.<\/p><\/div><\/div>\n<div class=\"identity\">@o{M} ↑ → salidas de capital → reservas ↓, @o{M} ↓ → vuelta a E<sub>1<\/sub><\/div><\/div>\n<div>[[fig:mf_pm_fix]]<\/div><\/div>"},{"s":15,"t":{"en":"Real Data: Denmark's Peg to the Euro","es":"Datos reales: la paridad de Dinamarca con el euro"},"en":"<div class=\"two wide-l\"><div>[[fig:d_dk]]<p class=\"datasrc\">Sources: Danmarks Nationalbank (official interest rates; foreign-exchange reserve releases for December 2014 to March 2015); ECB; HKMA (Base Rate).<\/p>[[data:d_dk]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the data show<\/div><div class=\"bb\"><ul>\n<li>Denmark fixes the krone to the euro and allows free capital movement, so it gives up its own monetary policy: the Nationalbank's rate moves with the ECB's.<\/li>\n<li>It departs from the ECB's rate only to defend the peg: up to 5.50% in October 2008, when the krone came under selling pressure, and down to −0.75% in February 2015, when capital flowed in after Switzerland abandoned its floor.<\/li>\n<li>In 2015 it also bought foreign currency: reserves rose from DKK 457.6 billion at the end of 2014 to 564.1 billion in January and 737.1 billion in February 2015.<\/li>\n<li>In the model: a surplus under a fixed rate makes the central bank buy foreign currency and lower r, the LM curve moving right until BP = 0.<\/li>\n<li>Hong Kong follows the same rule against the dollar: its Base Rate is set 50 basis points above the lower end of the US federal funds target range, or at a HIBOR-based rate if that is higher.<\/li><\/ul><\/div><\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_dk]]<p class=\"datasrc\">Fuentes: Danmarks Nationalbank (tipos oficiales; notas sobre las reservas de divisas de diciembre de 2014 a marzo de 2015); BCE; HKMA (Base Rate).<\/p>[[data:d_dk]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestran los datos<\/div><div class=\"bb\"><ul>\n<li>Dinamarca fija la corona al euro y permite la libre circulación de capitales, de modo que renuncia a su propia política monetaria: el tipo del Nationalbank se mueve con el del BCE.<\/li>\n<li>Solo se separa del tipo del BCE para defender la paridad: subió al 5,50% en octubre de 2008, cuando la corona sufrió presiones vendedoras, y bajó al −0,75% en febrero de 2015, cuando entró capital tras el abandono del suelo suizo.<\/li>\n<li>En 2015 también compró divisas: las reservas pasaron de 457,6 mil millones de coronas a finales de 2014 a 564,1 mil millones en enero y 737,1 mil millones en febrero de 2015.<\/li>\n<li>En el modelo: un superávit con tipo fijo obliga al banco central a comprar divisas y bajar r; la LM se desplaza a la derecha hasta que BP = 0.<\/li>\n<li>Hong Kong sigue la misma regla frente al dólar: su Base Rate se fija 50 puntos básicos por encima del límite inferior de la banda de los fondos federales, o en un tipo basado en el HIBOR si este es más alto.<\/li><\/ul><\/div><\/div><\/div><\/div>","data":true},{"s":15,"t":{"en":"Policy Effectiveness: Summary","es":"Eficacia de la política económica: resumen"},"en":"<div class=\"blk\"><div class=\"bt\">Perfect capital mobility<\/div><div class=\"bb\">\n<table class=\"num txt\"><tr><th><\/th><th>Flexible exchange rate<\/th><th>Fixed exchange rate<\/th><\/tr>\n<tr><td><b>Fiscal expansion<\/b><\/td><td><span class=\"hl\">Ineffective<\/span>: the currency appreciates and ΔNX = −Δ@o{G}; Y does not change<\/td><td><span class=\"bl\">Fully effective<\/span>: the money supply rises and ΔY = Δ@o{G}/σ<\/td><\/tr>\n<tr><td><b>Monetary expansion<\/b><\/td><td><span class=\"bl\">Fully effective<\/span>: the currency depreciates and ΔY = Δ(@o{M}/@o{P})/b<\/td><td><span class=\"hl\">Ineffective<\/span>: reserves fall and the money supply returns to its initial level<\/td><\/tr><\/table><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">The policy trilemma<\/div><div class=\"bb\">A country cannot have free capital movement, a fixed exchange rate and an independent monetary policy at the same time: it can choose two of the three. With free capital movement, a fixed exchange rate gives up monetary policy, and an independent monetary policy needs a flexible exchange rate.<\/div><\/div>\n<div class=\"assume\">Under a fixed exchange rate the instrument that works is fiscal policy; under a flexible exchange rate, monetary policy.<\/div>","es":"<div class=\"blk\"><div class=\"bt\">Movilidad perfecta del capital<\/div><div class=\"bb\">\n<table class=\"num txt\"><tr><th><\/th><th>Tipo de cambio flexible<\/th><th>Tipo de cambio fijo<\/th><\/tr>\n<tr><td><b>Expansión fiscal<\/b><\/td><td><span class=\"hl\">Ineficaz<\/span>: la moneda se aprecia y ΔNX = −Δ@o{G}; Y no cambia<\/td><td><span class=\"bl\">Plenamente eficaz<\/span>: la cantidad de dinero aumenta y ΔY = Δ@o{G}/σ<\/td><\/tr>\n<tr><td><b>Expansión monetaria<\/b><\/td><td><span class=\"bl\">Plenamente eficaz<\/span>: la moneda se deprecia y ΔY = Δ(@o{M}/@o{P})/b<\/td><td><span class=\"hl\">Ineficaz<\/span>: las reservas caen y la cantidad de dinero vuelve a su nivel inicial<\/td><\/tr><\/table><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">El trilema de la política económica<\/div><div class=\"bb\">Un país no puede tener a la vez libre movimiento de capitales, un tipo de cambio fijo y una política monetaria independiente: puede elegir dos de los tres. Con libre movimiento de capitales, un tipo de cambio fijo renuncia a la política monetaria, y una política monetaria independiente necesita un tipo de cambio flexible.<\/div><\/div>\n<div class=\"assume\">Con tipo de cambio fijo el instrumento que funciona es la política fiscal; con tipo de cambio flexible, la política monetaria.<\/div>"},{"s":15,"t":{"en":"Real Data: China Defends the Yuan, 2014–2016","es":"Datos reales: China defiende el yuan, 2014–2016"},"en":"<div class=\"two wide-l\"><div>[[fig:d_cn]]<p class=\"datasrc\">Sources: SAFE (official foreign-exchange reserves; Annual Report 2015); Federal Reserve H.10 (USD/CNY noon rates).<\/p>[[data:d_cn]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the data show<\/div><div class=\"bb\"><ul>\n<li>China manages the yuan against the dollar and limits capital movements: in the trilemma it keeps some room for its own monetary policy by restricting capital flows.<\/li>\n<li>In 2014–2016 capital flowed out. To support the yuan the People's Bank sold dollars, and reserves fell from a record USD 3.99 trillion in June 2014 to USD 3,010.5 billion at the end of 2016.<\/li>\n<li>On 11 August 2015 China reformed how the yuan's central parity is set, and the yuan fell about 3% against the dollar in three days.<\/li>\n<li>In the model: a deficit under a fixed rate costs reserves and reduces the money supply; the central bank can resist only while its reserves last, or by limiting f.<\/li>\n<li>From February 2017 reserves rose again for eleven months in a row.<\/li><\/ul><\/div><\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_cn]]<p class=\"datasrc\">Fuentes: SAFE (reservas oficiales de divisas; informe anual de 2015); Reserva Federal H.10 (tipos USD/CNY al mediodía).<\/p>[[data:d_cn]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestran los datos<\/div><div class=\"bb\"><ul>\n<li>China gestiona el yuan frente al dólar y limita los movimientos de capital: en el trilema conserva algo de margen para su política monetaria restringiendo los flujos de capital.<\/li>\n<li>En 2014–2016 salió capital. Para sostener el yuan, el Banco Popular vendió dólares, y las reservas cayeron de un máximo histórico de 3,99 billones de USD en junio de 2014 a 3.010,5 mil millones de USD a finales de 2016.<\/li>\n<li>El 11 de agosto de 2015 China reformó la fijación de la paridad central del yuan, y el yuan cayó cerca de un 3% frente al dólar en tres días.<\/li>\n<li>En el modelo: un déficit con tipo fijo cuesta reservas y reduce la cantidad de dinero; el banco central solo puede resistir mientras le duran las reservas, o limitando f.<\/li>\n<li>Desde febrero de 2017 las reservas volvieron a subir once meses seguidos.<\/li><\/ul><\/div><\/div><\/div><\/div>","data":true},{"s":16,"t":{"en":"Imperfect Capital Mobility: Policy under Both Regimes","es":"Movilidad imperfecta del capital: la política en los dos regímenes"},"en":"<div class=\"blk\"><div class=\"bt\">0 &lt; f &lt; ∞: the results are less extreme<\/div><div class=\"bb\">A policy first moves the economy along the curves to the IS–LM point, E<sub>2<\/sub>. The sign of BP at E<sub>2<\/sub>, and then the regime, decide what follows; the final point is E<sub>3<\/sub>.<\/div><\/div>\n<table class=\"num txt\"><tr><th>Policy<\/th><th>BP at E<sub>2<\/sub><\/th><th>Flexible exchange rate<\/th><th>Fixed exchange rate<\/th><\/tr>\n<tr><td>Fiscal expansion, BP flatter than LM<\/td><td>Surplus<\/td><td>Appreciation: IS and BP shift back part of the way; Y rises less than at E<sub>2<\/sub><\/td><td>@o{M} rises: LM shifts right; Y rises more than at E<sub>2<\/sub><\/td><\/tr>\n<tr><td>Fiscal expansion, BP steeper than LM<\/td><td>Deficit<\/td><td>Depreciation: IS and BP shift right; Y rises more than at E<sub>2<\/sub><\/td><td>@o{M} falls: LM shifts left; Y rises less than at E<sub>2<\/sub><\/td><\/tr>\n<tr><td>Monetary expansion<\/td><td>Deficit, always<\/td><td>Depreciation: IS and BP shift right; Y rises more than at E<sub>2<\/sub><\/td><td>@o{M} falls back: LM returns; no lasting effect<\/td><\/tr><\/table>\n[[fig:mf_imp]]","es":"<div class=\"blk\"><div class=\"bt\">0 &lt; f &lt; ∞: los resultados son menos extremos<\/div><div class=\"bb\">Una medida lleva primero la economía, a lo largo de las curvas, al punto IS-LM, E<sub>2<\/sub>. El signo de BP en E<sub>2<\/sub>, y después el régimen, deciden lo que sigue; el punto final es E<sub>3<\/sub>.<\/div><\/div>\n<table class=\"num txt\"><tr><th>Medida<\/th><th>BP en E<sub>2<\/sub><\/th><th>Tipo de cambio flexible<\/th><th>Tipo de cambio fijo<\/th><\/tr>\n<tr><td>Expansión fiscal, BP más plana que la LM<\/td><td>Superávit<\/td><td>Apreciación: la IS y la BP retroceden en parte; Y sube menos que en E<sub>2<\/sub><\/td><td>@o{M} aumenta: la LM se desplaza a la derecha; Y sube más que en E<sub>2<\/sub><\/td><\/tr>\n<tr><td>Expansión fiscal, BP más inclinada que la LM<\/td><td>Déficit<\/td><td>Depreciación: la IS y la BP se desplazan a la derecha; Y sube más que en E<sub>2<\/sub><\/td><td>@o{M} disminuye: la LM se desplaza a la izquierda; Y sube menos que en E<sub>2<\/sub><\/td><\/tr>\n<tr><td>Expansión monetaria<\/td><td>Déficit, siempre<\/td><td>Depreciación: la IS y la BP se desplazan a la derecha; Y sube más que en E<sub>2<\/sub><\/td><td>@o{M} vuelve atrás: la LM vuelve; sin efecto duradero<\/td><\/tr><\/table>\n[[fig:mf_imp]]"},{"s":17,"t":{"en":"Worked Exercise: the Full Model","es":"Ejercicio resuelto: el modelo completo"},"en":"<div class=\"blk\"><div class=\"bt\">Data and questions<\/div><div class=\"bb\">\n<p><b>Use this data<\/b>, with r in percent and ER<sub>0<\/sub> = 1 at the start:<\/p><ul>\n<li>Consumption: C = 100 + 0.7Y<sub>D<\/sub>, with Y<sub>D<\/sub> = Y + @o{TR} − @o{T}, @o{TR} = 50 and @o{T} = 150.<\/li>\n<li>Investment: I = 400 − 50r. Government spending: @o{G} = 120.<\/li>\n<li>Exports: X = 0.1Y*·ER<sub>0<\/sub>, with Y* = 2,000. Imports: M = 0.2Y/ER<sub>0<\/sub>.<\/li>\n<li>Money demand: M<sup>d<\/sup> = 100 + 0.5Y − 20r; real money supply: @o{M}/@o{P} = 500.<\/li>\n<li>Financial account: FA = 20(r − r*), with r* = 3.<\/li><\/ul>\n<ol><li><span class=\"hl\">Derive the IS curve from Y = C + I + G + NX.<\/span><\/li>\n<li><span class=\"hl\">Derive the LM curve.<\/span><\/li>\n<li><span class=\"hl\">Solve for the equilibrium Y and r,<\/span> and compute C, I, G and NX there.<\/li>\n<li><span class=\"hl\">Find the BP curve and Y<sub>TB<\/sub>,<\/span> and compute CA, FA and BP at the equilibrium.<\/li>\n<li><span class=\"hl\">Fixed exchange rate:<\/span> how does the central bank react, and where does the economy end up?<\/li>\n<li><span class=\"hl\">Flexible exchange rate:<\/span> what happens to ER<sub>0<\/sub>, and which curves shift?<\/li>\n<li><span class=\"hl\">Fiscal expansion:<\/span> use the multipliers to find the effect of Δ@o{G} = 35 on Y, r and BP, with @o{M}/@o{P} = 500 and ER<sub>0<\/sub> = 1.<\/li><\/ol>\n<p class=\"note\">M without a bar is imports; @o{M} is the stock of money.<\/p><\/div><\/div>","es":"<div class=\"blk\"><div class=\"bt\">Datos y preguntas<\/div><div class=\"bb\">\n<p><b>Usa estos datos<\/b>, con r en porcentaje y ER<sub>0<\/sub> = 1 al principio:<\/p><ul>\n<li>Consumo: C = 100 + 0,7Y<sub>D<\/sub>, con Y<sub>D<\/sub> = Y + @o{TR} − @o{T}, @o{TR} = 50 y @o{T} = 150.<\/li>\n<li>Inversión: I = 400 − 50r. Gasto público: @o{G} = 120.<\/li>\n<li>Exportaciones: X = 0,1Y*·ER<sub>0<\/sub>, con Y* = 2.000. Importaciones: M = 0,2Y/ER<sub>0<\/sub>.<\/li>\n<li>Demanda de dinero: M<sup>d<\/sup> = 100 + 0,5Y − 20r; oferta monetaria real: @o{M}/@o{P} = 500.<\/li>\n<li>Cuenta financiera: CF = 20(r − r*), con r* = 3.<\/li><\/ul>\n<ol><li><span class=\"hl\">Deriva la curva IS a partir de Y = C + I + G + NX.<\/span><\/li>\n<li><span class=\"hl\">Deriva la curva LM.<\/span><\/li>\n<li><span class=\"hl\">Halla el equilibrio de Y y r,<\/span> y calcula C, I, G y NX en ese punto.<\/li>\n<li><span class=\"hl\">Halla la curva BP e Y<sub>TB<\/sub>,<\/span> y calcula CC, CF y BP en el equilibrio.<\/li>\n<li><span class=\"hl\">Tipo de cambio fijo:<\/span> ¿cómo reacciona el banco central y dónde termina la economía?<\/li>\n<li><span class=\"hl\">Tipo de cambio flexible:<\/span> ¿qué ocurre con ER<sub>0<\/sub> y qué curvas se desplazan?<\/li>\n<li><span class=\"hl\">Expansión fiscal:<\/span> usa los multiplicadores para hallar el efecto de Δ@o{G} = 35 sobre Y, r y BP, con @o{M}/@o{P} = 500 y ER<sub>0<\/sub> = 1.<\/li><\/ol>\n<p class=\"note\">M sin barra son las importaciones; @o{M} es la cantidad de dinero.<\/p><\/div><\/div>"},{"s":17,"t":{"en":"Solution I: the IS, LM and BP Curves","es":"Solución I: las curvas IS, LM y BP"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">1. IS curve<\/div><div class=\"bb\">\n<div class=\"eq left\">Y = 100 + 0.7(Y + 50 − 150) + 400 − 50r + 120 + 200 − 0.2Y<br>Y = 750 + 0.5Y − 50r<br>@o{A} = 750 and σ = 1 − 0.7 + 0.2 = 0.5<br>0.5Y = 750 − 50r → <b>Y = 1,500 − 100r<\/b><br>IS: r = 15 − 0.01Y, slope −σ/d = −0.01<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">2. LM curve<\/div><div class=\"bb\">\n<div class=\"eq left\">500 = 100 + 0.5Y − 20r<br><b>LM: r = 0.025Y − 20<\/b>, slope b/h = 0.5/20 = 0.025<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">4. BP curve<\/div><div class=\"bb\">\n<div class=\"eq left\">BP = 200 − 0.2Y + 20(r − 3) = 0<br><b>BP: r = 0.01Y − 7<\/b>, slope m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) = 0.2/20 = 0.01<br>X = M: 200 = 0.2Y → <b>Y<sub>TB<\/sub> = 1,000<\/b>, where r = r* = 3<\/div>\n<p>The BP curve, with slope 0.01, is flatter than the LM curve, with slope 0.025: capital mobility is high.<\/p><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Autonomous spending in detail<\/div><div class=\"bb\"><div class=\"eq left\">@o{A} = c<sub>0<\/sub> + c<sub>1<\/sub>(@o{TR} − @o{T}) + @o{I} + @o{G} + X<br>@o{A} = 100 + 0.7(50 − 150) + 400 + 120 + 200 = 750<\/div><\/div><\/div><\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">1. Curva IS<\/div><div class=\"bb\">\n<div class=\"eq left\">Y = 100 + 0,7(Y + 50 − 150) + 400 − 50r + 120 + 200 − 0,2Y<br>Y = 750 + 0,5Y − 50r<br>@o{A} = 750 y σ = 1 − 0,7 + 0,2 = 0,5<br>0,5Y = 750 − 50r → <b>Y = 1.500 − 100r<\/b><br>IS: r = 15 − 0,01Y, pendiente −σ/d = −0,01<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">2. Curva LM<\/div><div class=\"bb\">\n<div class=\"eq left\">500 = 100 + 0,5Y − 20r<br><b>LM: r = 0,025Y − 20<\/b>, pendiente b/h = 0,5/20 = 0,025<\/div><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">4. Curva BP<\/div><div class=\"bb\">\n<div class=\"eq left\">BP = 200 − 0,2Y + 20(r − 3) = 0<br><b>BP: r = 0,01Y − 7<\/b>, pendiente m<sub>1<\/sub>/(f·ER<sub>0<\/sub>) = 0,2/20 = 0,01<br>X = M: 200 = 0,2Y → <b>Y<sub>TB<\/sub> = 1.000<\/b>, donde r = r* = 3<\/div>\n<p>La curva BP, con pendiente 0,01, es más plana que la LM, con pendiente 0,025: la movilidad del capital es alta.<\/p><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">El gasto autónomo en detalle<\/div><div class=\"bb\"><div class=\"eq left\">@o{A} = c<sub>0<\/sub> + c<sub>1<\/sub>(@o{TR} − @o{T}) + @o{I} + @o{G} + X<br>@o{A} = 100 + 0,7(50 − 150) + 400 + 120 + 200 = 750<\/div><\/div><\/div><\/div><\/div>"},{"s":17,"t":{"en":"Solution II: Equilibrium and the Balance of Payments","es":"Solución II: el equilibrio y la balanza de pagos"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">3. Equilibrium<\/div><div class=\"bb\">\n<div class=\"eq left\">IS = LM: 15 − 0.01Y = 0.025Y − 20<br>0.035Y = 35 → <b>Y = 1,000<\/b> and <b>r = 5<\/b><\/div>\n<p>The general formula gives the same result:<\/p>\n<div class=\"eq\">Y<sub>e<\/sub> = @f{h@o{A} + d(@o{M}/@o{P} − a)}{hσ + bd}<\/div>\n<div class=\"eq\">Y<sub>e<\/sub> = @f{20 × 750 + 50 × 400}{20 × 0.5 + 0.5 × 50} = @f{35,000}{35} = 1,000<\/div>\n<div class=\"eq left\">Y<sub>D<\/sub> = 1,000 + 50 − 150 = 900 and C = 100 + 0.7 × 900 = 730<br>I = 400 − 50 × 5 = 150, G = 120, NX = 200 − 200 = 0<br>C + I + G + NX = 730 + 150 + 120 + 0 = 1,000 = Y<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">4. Balance of payments<\/div><div class=\"bb\">\n<div class=\"eq left\">CA = 200 − 0.2 × 1,000 = 0<br>FA = 20(5 − 3) = 40<br><b>BP = +40: surplus<\/b><\/div>\n<p>At Y = 1,000 the BP curve requires r = 3. The equilibrium rate is 5, so E lies above the BP curve and the domestic currency tends to appreciate.<\/p><\/div><\/div><\/div>\n<div>[[fig:ex_mf1]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">3. Equilibrio<\/div><div class=\"bb\">\n<div class=\"eq left\">IS = LM: 15 − 0,01Y = 0,025Y − 20<br>0,035Y = 35 → <b>Y = 1.000<\/b> y <b>r = 5<\/b><\/div>\n<p>La fórmula general da el mismo resultado:<\/p>\n<div class=\"eq\">Y<sub>e<\/sub> = @f{h@o{A} + d(@o{M}/@o{P} − a)}{hσ + bd}<\/div>\n<div class=\"eq\">Y<sub>e<\/sub> = @f{20 × 750 + 50 × 400}{20 × 0,5 + 0,5 × 50} = @f{35.000}{35} = 1.000<\/div>\n<div class=\"eq left\">Y<sub>D<\/sub> = 1.000 + 50 − 150 = 900 y C = 100 + 0,7 × 900 = 730<br>I = 400 − 50 × 5 = 150, G = 120, NX = 200 − 200 = 0<br>C + I + G + NX = 730 + 150 + 120 + 0 = 1.000 = Y<\/div><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">4. Balanza de pagos<\/div><div class=\"bb\">\n<div class=\"eq left\">CC = 200 − 0,2 × 1.000 = 0<br>CF = 20(5 − 3) = 40<br><b>BP = +40: superávit<\/b><\/div>\n<p>Con Y = 1.000 la curva BP exige r = 3. El tipo de equilibrio es 5, de modo que E está por encima de la curva BP y la moneda nacional tiende a apreciarse.<\/p><\/div><\/div><\/div>\n<div>[[fig:ex_mf1]]<\/div><\/div>"},{"s":17,"t":{"en":"Solution III: Fixed and Flexible Exchange Rates","es":"Solución III: tipo de cambio fijo y flexible"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">5. Fixed exchange rate<\/div><div class=\"bb\">\n<p>The surplus pushes the currency up. The central bank buys foreign currency to hold ER<sub>0<\/sub> = 1, and the money supply rises until the LM curve passes through the crossing of IS and BP:<\/p>\n<div class=\"eq left\">IS = BP: 15 − 0.01Y = 0.01Y − 7 → <b>Y = 1,100<\/b> and <b>r = 4<\/b><br>@o{M}/@o{P} = 100 + 0.5 × 1,100 − 20 × 4 = <b>570<\/b><br>CA = 200 − 220 = −20, FA = 20(4 − 3) = 20, BP = 0<\/div>\n<p>The money supply rises by 70 and income by 100: the monetary-policy multiplier, d/(hσ + bd) = 50/35, times 70.<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">6. Flexible exchange rate<\/div><div class=\"bb\">\n<p>The currency appreciates and ER<sub>0<\/sub> falls below 1: exports fall and imports rise, so the IS curve shifts left and the BP curve shifts up. The money supply stays at 500 and the LM curve does not move.<\/p>\n<p>With BP = 0, NX = −FA = −20(r − 3), and the goods market becomes 0.3Y = 610 − 70r. With the LM curve, Y ≈ 980 and r ≈ 4.5, which needs an appreciation to ER<sub>0<\/sub> ≈ 0.92.<\/p><\/div><\/div><\/div><\/div>\n[[fig:ex_mf2]]","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">5. Tipo de cambio fijo<\/div><div class=\"bb\">\n<p>El superávit empuja la moneda al alza. El banco central compra divisas para mantener ER<sub>0<\/sub> = 1, y la cantidad de dinero aumenta hasta que la LM pasa por el corte de IS y BP:<\/p>\n<div class=\"eq left\">IS = BP: 15 − 0,01Y = 0,01Y − 7 → <b>Y = 1.100<\/b> y <b>r = 4<\/b><br>@o{M}/@o{P} = 100 + 0,5 × 1.100 − 20 × 4 = <b>570<\/b><br>CC = 200 − 220 = −20, CF = 20(4 − 3) = 20, BP = 0<\/div>\n<p>La cantidad de dinero aumenta en 70 y la renta en 100: el multiplicador de la política monetaria, d/(hσ + bd) = 50/35, por 70.<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">6. Tipo de cambio flexible<\/div><div class=\"bb\">\n<p>La moneda se aprecia y ER<sub>0<\/sub> baja de 1: las exportaciones caen y las importaciones suben, de modo que la IS se desplaza a la izquierda y la BP hacia arriba. La cantidad de dinero se queda en 500 y la LM no se mueve.<\/p>\n<p>Con BP = 0, NX = −CF = −20(r − 3), y el mercado de bienes queda 0,3Y = 610 − 70r. Con la LM, Y ≈ 980 y r ≈ 4,5, lo que exige una apreciación hasta ER<sub>0<\/sub> ≈ 0,92.<\/p><\/div><\/div><\/div><\/div>\n[[fig:ex_mf2]]"},{"s":17,"t":{"en":"Solution IV: a Fiscal Expansion","es":"Solución IV: una expansión fiscal"},"en":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">7. Δ@o{G} = 35, with @o{M}/@o{P} = 500 and ER<sub>0<\/sub> = 1<\/div><div class=\"bb\">\n<div class=\"eq left\">ΔY = @f{h}{hσ + bd}Δ@o{G} = @f{20}{35} × 35 = 20 → Y = 1,020<br>Δr = @f{b}{hσ + bd}Δ@o{G} = @f{0.5}{35} × 35 = 0.5 → r = 5.5<br>CA = 200 − 204 = −4, FA = 20(5.5 − 3) = 50, BP = +46<\/div><ul>\n<li>In the goods market alone, the multiplier 1/σ = 2 would give ΔY = 70: the IS curve shifts right by 70.<\/li>\n<li>The rise in r lowers investment by 50 × 0.5 = 25, and the multiplier 2 takes 50 off income: Y rises by 20, not 70.<\/li>\n<li>BP improves from 40 to 46, because the BP curve is flatter than the LM curve: the extra capital inflows, 20 × 0.5 = 10, exceed the extra imports, 0.2 × 20 = 4.<\/li><\/ul>\n<p>With a fixed exchange rate the surplus would raise the money supply further; with a flexible exchange rate the currency would appreciate.<\/p><\/div><\/div><\/div>\n<div>[[fig:ex_mf3]]<\/div><\/div>","es":"<div class=\"two\"><div><div class=\"blk\"><div class=\"bt\">7. Δ@o{G} = 35, con @o{M}/@o{P} = 500 y ER<sub>0<\/sub> = 1<\/div><div class=\"bb\">\n<div class=\"eq left\">ΔY = @f{h}{hσ + bd}Δ@o{G} = @f{20}{35} × 35 = 20 → Y = 1.020<br>Δr = @f{b}{hσ + bd}Δ@o{G} = @f{0,5}{35} × 35 = 0,5 → r = 5,5<br>CC = 200 − 204 = −4, CF = 20(5,5 − 3) = 50, BP = +46<\/div><ul>\n<li>En el mercado de bienes por sí solo, el multiplicador 1/σ = 2 daría ΔY = 70: la IS se desplaza 70 a la derecha.<\/li>\n<li>La subida de r reduce la inversión en 50 × 0,5 = 25, y el multiplicador 2 resta 50 a la renta: Y sube 20, no 70.<\/li>\n<li>BP mejora de 40 a 46, porque la curva BP es más plana que la LM: las entradas de capital adicionales, 20 × 0,5 = 10, superan a las importaciones adicionales, 0,2 × 20 = 4.<\/li><\/ul>\n<p>Con tipo de cambio fijo el superávit elevaría aún más la cantidad de dinero; con tipo de cambio flexible la moneda se apreciaría.<\/p><\/div><\/div><\/div>\n<div>[[fig:ex_mf3]]<\/div><\/div>"},{"s":18,"t":{"en":"The Empirical IS–LM–BP: Calibrating the Euro Area","es":"El IS-LM-BP empírico: calibración de la zona del euro"},"en":"<p>Each curve is a straight line through the observed point of 2025, (Y<sub>0<\/sub>, r<sub>0<\/sub>). The data fix the point; national accounts, money demand and an ECB estimate fix the slopes of IS and LM, and free capital movement makes the BP curve flat. ER<sub>0<\/sub> = 1 in 2025 and α = 0. Y and M1 are in € trillion and r in percentage points.<\/p>\n<div class=\"tbl-wrap\"><table class=\"num txt cal\"><tr><th>Symbol<\/th><th>Value<\/th><th>What it measures and how it is obtained<\/th><th>Source<\/th><\/tr>\n<tr><td>Y<sub>0<\/sub><\/td><td>[[emp:Y0:2]]<\/td><td>GDP of 2025 at current prices; at 2025 prices it is also real GDP<\/td><td>Eurostat<\/td><\/tr>\n<tr><td>r<sub>0<\/sub><\/td><td>[[emp:r0:2]]%<\/td><td>ECB deposit facility rate, average of 2025<\/td><td>ECB<\/td><\/tr>\n<tr><td>r*<\/td><td>[[emp:rs:2]]%<\/td><td>Federal funds target range, upper bound, average of 2025<\/td><td>Federal Reserve<\/td><\/tr>\n<tr><td>c<sub>1<\/sub><\/td><td>[[emp:c1:3]]<\/td><td>1 − household saving rate, 14.4% of disposable income in the fourth quarter of 2025<\/td><td>Eurostat<\/td><\/tr>\n<tr><td>t<\/td><td>[[emp:t:3]]<\/td><td>General government revenue, 46.9% of GDP in 2025<\/td><td>Eurostat<\/td><\/tr>\n<tr><td>m<sub>1<\/sub><\/td><td>[[emp:m1:3]]<\/td><td>Imports of goods and services from outside the euro area, 24.8% of GDP in 2025<\/td><td>Eurostat<\/td><\/tr>\n<tr><td>σ<\/td><td>[[emp:sigma:3]]<\/td><td>1 − c<sub>1<\/sub>(1 − t) − α + m<sub>1<\/sub>; the goods-market multiplier 1/σ is [[emp:kG:2]]<\/td><td>computed<\/td><\/tr>\n<tr><td>d<\/td><td>[[emp:d:3]]<\/td><td>ECB models: the 2022–23 tightening lowers GDP growth by 2 points a year on average in 2022–25; four such years add up to about 8% of GDP, which we attribute to the 4.5-point rise in the deposit rate, from −0.50% to 4.00%. Along the IS curve ΔY/Δr = d/σ = [[emp:dyPct:2]]% of GDP per point<\/td><td>ECB, Economic Bulletin 3/2023<\/td><\/tr>\n<tr><td>b<\/td><td>[[emp:b:3]]<\/td><td>M1/Y<sub>0<\/sub>, with M1 = €[[emp:M1:2]] trillion in December 2025: money demand proportional to income<\/td><td>ECB<\/td><\/tr>\n<tr><td>h<\/td><td>[[emp:h:3]]<\/td><td>λ·M1, with λ = [[emp:lamPct:1]]% per point: from December 2021 to December 2023 M1 relative to GDP fell by [[emp:vel:0]] log points while the deposit rate rose from −0.50% to 4.00%<\/td><td>ECB, Eurostat<\/td><\/tr>\n<tr><td>f<\/td><td>→ ∞<\/td><td>Perfect capital mobility, the benchmark for an economy with free capital movement and deep financial markets: the BP curve is horizontal at r<sub>0<\/sub>. Dividing the 2025 current-account surplus by the gap with the Fed's rate, 0.255/[[emp:gap:2]], gives only €[[emp:fCABn:0]] billion per point, because it treats the whole capital outflow as a response to that gap; most of it reflects saving and portfolio decisions, which the model treats as exogenous capital flows<\/td><td>ECB; calibration choice<\/td><\/tr>\n<\/table><\/div>\n<div class=\"identity\">Slopes, in points of r per € trillion of Y: IS −σ/d = −[[emp:sISabs:2]]; LM b/h = [[emp:sLM:2]]; BP m<sub>1<\/sub>/f → 0, horizontal at r<sub>0<\/sub> = [[emp:r0:2]]%.<\/div>\n<p class=\"datasrc\">Sources: Eurostat (national accounts, balance of payments, government finance, sector accounts); ECB (key interest rates, monetary developments, balance of payments release of 19 February 2026, Economic Bulletin 3/2023); Federal Reserve (FOMC statements). M1 is seasonally adjusted, as first published; December 2021 covers 19 countries, before Croatia joined.<\/p>","es":"<p>Cada curva es una recta que pasa por el punto observado de 2025, (Y<sub>0<\/sub>, r<sub>0<\/sub>). Los datos fijan el punto; la contabilidad nacional, la demanda de dinero y una estimación del BCE fijan las pendientes de la IS y la LM, y la libre circulación de capitales hace horizontal la curva BP. ER<sub>0<\/sub> = 1 en 2025 y α = 0. Y y M1 están en billones de euros y r en puntos porcentuales.<\/p>\n<div class=\"tbl-wrap\"><table class=\"num txt cal\"><tr><th>Símbolo<\/th><th>Valor<\/th><th>Qué mide y cómo se obtiene<\/th><th>Fuente<\/th><\/tr>\n<tr><td>Y<sub>0<\/sub><\/td><td>[[emp:Y0:2]]<\/td><td>PIB de 2025 a precios corrientes; a precios de 2025 es también el PIB real<\/td><td>Eurostat<\/td><\/tr>\n<tr><td>r<sub>0<\/sub><\/td><td>[[emp:r0:2]]%<\/td><td>Tipo de la facilidad de depósito del BCE, media de 2025<\/td><td>BCE<\/td><\/tr>\n<tr><td>r*<\/td><td>[[emp:rs:2]]%<\/td><td>Banda objetivo de los fondos federales, límite superior, media de 2025<\/td><td>Reserva Federal<\/td><\/tr>\n<tr><td>c<sub>1<\/sub><\/td><td>[[emp:c1:3]]<\/td><td>1 − tasa de ahorro de los hogares, 14,4% de la renta disponible en el cuarto trimestre de 2025<\/td><td>Eurostat<\/td><\/tr>\n<tr><td>t<\/td><td>[[emp:t:3]]<\/td><td>Ingresos de las administraciones públicas, 46,9% del PIB en 2025<\/td><td>Eurostat<\/td><\/tr>\n<tr><td>m<sub>1<\/sub><\/td><td>[[emp:m1:3]]<\/td><td>Importaciones de bienes y servicios de fuera de la zona del euro, 24,8% del PIB en 2025<\/td><td>Eurostat<\/td><\/tr>\n<tr><td>σ<\/td><td>[[emp:sigma:3]]<\/td><td>1 − c<sub>1<\/sub>(1 − t) − α + m<sub>1<\/sub>; el multiplicador del mercado de bienes, 1/σ, es [[emp:kG:2]]<\/td><td>cálculo propio<\/td><\/tr>\n<tr><td>d<\/td><td>[[emp:d:3]]<\/td><td>Modelos del BCE: el endurecimiento de 2022–23 reduce el crecimiento del PIB en 2 puntos al año de media en 2022–25; cuatro años así suman cerca de un 8% del PIB, que atribuimos a la subida de 4,5 puntos de la facilidad de depósito, del −0,50% al 4,00%. A lo largo de la IS, ΔY/Δr = d/σ = [[emp:dyPct:2]]% del PIB por punto<\/td><td>BCE, Boletín Económico 3/2023<\/td><\/tr>\n<tr><td>b<\/td><td>[[emp:b:3]]<\/td><td>M1/Y<sub>0<\/sub>, con M1 = [[emp:M1:2]] billones de euros en diciembre de 2025: demanda de dinero proporcional a la renta<\/td><td>BCE<\/td><\/tr>\n<tr><td>h<\/td><td>[[emp:h:3]]<\/td><td>λ·M1, con λ = [[emp:lamPct:1]]% por punto: de diciembre de 2021 a diciembre de 2023 M1 en relación con el PIB cayó [[emp:vel:0]] puntos logarítmicos mientras la facilidad de depósito subía del −0,50% al 4,00%<\/td><td>BCE, Eurostat<\/td><\/tr>\n<tr><td>f<\/td><td>→ ∞<\/td><td>Movilidad perfecta del capital, el caso de referencia para una economía con libre circulación de capitales y mercados financieros profundos: la curva BP es horizontal en r<sub>0<\/sub>. Dividir el superávit por cuenta corriente de 2025 entre la diferencia con el tipo de la Fed, 0,255/[[emp:gap:2]], da solo [[emp:fCABn:0]] mil millones de euros por punto, porque atribuye toda la salida de capital a esa diferencia; la mayor parte responde a decisiones de ahorro y de cartera, que el modelo trata como flujos de capital exógenos<\/td><td>BCE; elección de calibración<\/td><\/tr>\n<\/table><\/div>\n<div class=\"identity\">Pendientes, en puntos de r por billón de euros de Y: IS −σ/d = −[[emp:sISabs:2]]; LM b/h = [[emp:sLM:2]]; BP m<sub>1<\/sub>/f → 0, horizontal en r<sub>0<\/sub> = [[emp:r0:2]]%.<\/div>\n<p class=\"datasrc\">Fuentes: Eurostat (contabilidad nacional, balanza de pagos, finanzas públicas, cuentas sectoriales); BCE (tipos de interés oficiales, evolución monetaria, nota de balanza de pagos del 19 de febrero de 2026, Boletín Económico 3/2023); Reserva Federal (comunicados del FOMC). M1 está desestacionalizado, en su primera publicación; diciembre de 2021 abarca 19 países, antes de la entrada de Croacia.<\/p>","data":true},{"s":18,"t":{"en":"The Empirical IS–LM–BP: the Euro Area in 2025","es":"El IS-LM-BP empírico: la zona del euro en 2025"},"en":"<div class=\"two wide-l\"><div>[[fig:d_emp]]<p class=\"datasrc\">Sources: Eurostat (GDP, balance of payments); ECB (deposit facility rate, M1, current account); Federal Reserve (FOMC statements). The curves use the calibration in the table.<\/p>[[data:d_emp]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">What the figure shows<\/div><div class=\"bb\"><ul>\n<li><b>E<\/b> is the observed point of 2025: real GDP of €[[emp:Y0:2]] trillion and an average deposit rate of [[emp:r0:2]]%. With a floating euro the exchange rate keeps the balance of payments in equilibrium, so E lies on the BP curve and the three curves cross there.<\/li>\n<li><b>IS<\/b>, slope −[[emp:sISabs:2]]: a cut of 1 point in r raises demand by [[emp:dyPct:2]]% of GDP, about €[[emp:dYdrBn:0]] billion.<\/li>\n<li><b>LM<\/b>, slope [[emp:sLM:2]]: with M1 given, a rise of 1% in GDP, €[[emp:dGbn:0]] billion, requires r to rise by [[emp:lm1:2]] points.<\/li>\n<li><b>BP<\/b>, horizontal: perfect capital mobility. The economy is very sensitive to slight changes in r: the smallest gap between r and [[emp:r0:2]]% moves capital without limit, so through the exchange rate small changes in rates produce large movements in Y. Above the curve the balance of payments is in surplus, below it in deficit.<\/li>\n<li>The BP curve lies [[emp:gap:2]] points below the Fed's rate because r* is not only the Fed's rate and capital also responds to risk and portfolio preferences; at r<sub>0<\/sub> the capital outflow matches the current-account surplus of €255 billion.<\/li>\n<li>The grey points are the observed (Y, r) of 2019–2024, where the curves of each year crossed. In 2020 output fell [[emp:fall20:1]]% with r at −0.50%; from 2022 to 2024 the average rate rose from [[emp:r22:2]]% to [[emp:r24:2]]% while real GDP grew [[emp:g2224:1]]%: the LM curve moved up as real M1 fell.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">IS: r = [[emp:r0:2]] − [[emp:sISabs:2]](Y − [[emp:Y0:2]])<br>LM: r = [[emp:r0:2]] + [[emp:sLM:2]](Y − [[emp:Y0:2]])<br>BP: r = [[emp:r0:2]]<\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_emp]]<p class=\"datasrc\">Fuentes: Eurostat (PIB, balanza de pagos); BCE (facilidad de depósito, M1, cuenta corriente); Reserva Federal (comunicados del FOMC). Las curvas usan la calibración de la tabla.<\/p>[[data:d_emp]]<\/div>\n<div><div class=\"blk\"><div class=\"bt\">Qué muestra el gráfico<\/div><div class=\"bb\"><ul>\n<li><b>E<\/b> es el punto observado de 2025: un PIB real de [[emp:Y0:2]] billones de euros y una facilidad de depósito media del [[emp:r0:2]]%. Con el euro flotando, el tipo de cambio mantiene la balanza de pagos en equilibrio, de modo que E está sobre la curva BP y las tres curvas se cortan ahí.<\/li>\n<li><b>IS<\/b>, pendiente −[[emp:sISabs:2]]: una bajada de 1 punto de r eleva la demanda un [[emp:dyPct:2]]% del PIB, unos [[emp:dYdrBn:0]] mil millones de euros.<\/li>\n<li><b>LM<\/b>, pendiente [[emp:sLM:2]]: con M1 dado, un aumento del PIB del 1%, [[emp:dGbn:0]] mil millones de euros, exige que r suba [[emp:lm1:2]] puntos.<\/li>\n<li><b>BP<\/b>, horizontal: movilidad perfecta del capital. La economía es muy sensible a pequeños cambios de r: la menor diferencia entre r y el [[emp:r0:2]]% mueve capital sin límite, de modo que, a través del tipo de cambio, pequeños cambios en los tipos producen grandes movimientos de Y. Por encima de la curva la balanza de pagos tiene superávit; por debajo, déficit.<\/li>\n<li>La curva BP está [[emp:gap:2]] puntos por debajo del tipo de la Fed porque r* no es solo el tipo de la Fed y el capital responde también al riesgo y a las preferencias de cartera; en r<sub>0<\/sub> la salida de capital iguala el superávit por cuenta corriente de 255 mil millones de euros.<\/li>\n<li>Los puntos grises son los (Y, r) observados de 2019–2024, donde se cortaban las curvas de cada año. En 2020 la producción cayó un [[emp:fall20:1]]% con r en −0,50%; de 2022 a 2024 el tipo medio subió del [[emp:r22:2]]% al [[emp:r24:2]]% mientras el PIB real crecía un [[emp:g2224:1]]%: la LM se desplazó hacia arriba al caer M1 en términos reales.<\/li><\/ul><\/div><\/div>\n<div class=\"identity\">IS: r = [[emp:r0:2]] − [[emp:sISabs:2]](Y − [[emp:Y0:2]])<br>LM: r = [[emp:r0:2]] + [[emp:sLM:2]](Y − [[emp:Y0:2]])<br>BP: r = [[emp:r0:2]]<\/div><\/div><\/div>","data":true},{"s":18,"t":{"en":"The Empirical IS–LM–BP: a Fiscal Expansion","es":"El IS-LM-BP empírico: una expansión fiscal"},"en":"<div class=\"two wide-l\"><div>[[fig:d_empg]]<p class=\"datasrc\">Sources: the calibration table; ECB, Economic Bulletin 6/2025 (multiplier); Börse Frankfurt, 7 March 2025 (Bund yields); Bloomberg, 8 March 2025 (euro).<\/p>[[data:d_empg]]<div class=\"blk\"><div class=\"bt\">Markets in March 2025<\/div><div class=\"bb\"><p>Germany's incoming coalition proposed a €500 billion infrastructure fund over 12 years and an exemption from the debt brake for defence spending above 1% of GDP; the Bundestag and the Bundesrat approved both on 18 and 21 March. Within a week the 10-year Bund yield rose from 2.37% to 2.93%, the sharpest rise since 1990, and the euro gained almost 5% against the dollar.<\/p><p>A higher r together with an appreciation means that the new crossing lay above the BP curve: a surplus, as a flat BP curve predicts.<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">A rise of 1% of GDP in government spending<\/div><div class=\"bb\"><ul>\n<li>Δ@o{G} = €[[emp:dGbn:0]] billion shifts the IS curve right by Δ@o{G}/σ = €[[emp:dYgBn:0]] billion, to IS′.<\/li>\n<li>The new IS–LM crossing, <b>E′<\/b>, has Y €[[emp:dY1Bn:0]] billion higher and r [[emp:dr1:2]] points higher. E′ lies <b>above the BP curve<\/b>: with perfect capital mobility even this slight rise in r draws in capital without limit, and the balance of payments moves into surplus.<\/li>\n<li><b>Flexible euro<\/b>: the surplus appreciates the euro by [[emp:apprPct:2]]%, net exports fall by €[[emp:dGbn:0]] billion and IS′ shifts back to IS. The economy returns to E: the fiscal multiplier is [[emp:kFlex:0]].<\/li>\n<li><b>Fixed rate<\/b>, for comparison: the central bank buys the incoming foreign currency, the money supply rises by €[[emp:dMxBn:0]] billion and LM shifts to LM′, through <b>E″<\/b> on the BP curve: Y rises by €[[emp:dYxBn:0]] billion, a multiplier of 1/σ = [[emp:kFix:2]].<\/li>\n<li>The ECB's models give [[emp:mult:2]] over two years, with monetary policy active (Economic Bulletin 6/2025). The euro area is a large economy: its fiscal expansion also pushes up interest rates abroad, which moves the BP curve up and leaves part of the stimulus in place.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">What decides: where E′ lies relative to BP<\/div><div class=\"bb\">[[tab:d_sens]]<p>Above BP the euro appreciates and the float takes back part of the stimulus; below BP it depreciates and the float adds to it. For this shock E′ lies above BP whenever f exceeds €[[emp:fEqBn:0]] billion per point.<\/p><\/div><\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_empg]]<p class=\"datasrc\">Fuentes: la tabla de calibración; BCE, Boletín Económico 6/2025 (multiplicador); Börse Frankfurt, 7 de marzo de 2025 (rentabilidad del Bund); Bloomberg, 8 de marzo de 2025 (euro).<\/p>[[data:d_empg]]<div class=\"blk\"><div class=\"bt\">Los mercados en marzo de 2025<\/div><div class=\"bb\"><p>Los partidos de la nueva coalición alemana propusieron un fondo de infraestructuras de 500 mil millones de euros a 12 años y la exclusión del freno de la deuda del gasto en defensa por encima del 1% del PIB; el Bundestag y el Bundesrat lo aprobaron el 18 y el 21 de marzo. En una semana la rentabilidad del Bund a 10 años pasó del 2,37% al 2,93%, la mayor subida desde 1990, y el euro ganó casi un 5% frente al dólar.<\/p><p>Un r más alto junto con una apreciación indica que el nuevo corte quedó por encima de la curva BP: un superávit, como predice una BP horizontal.<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Un aumento del gasto público del 1% del PIB<\/div><div class=\"bb\"><ul>\n<li>Δ@o{G} = [[emp:dGbn:0]] mil millones de euros desplaza la IS a la derecha Δ@o{G}/σ = [[emp:dYgBn:0]] mil millones, hasta IS′.<\/li>\n<li>El nuevo corte IS-LM, <b>E′<\/b>, tiene Y [[emp:dY1Bn:0]] mil millones más alto y r [[emp:dr1:2]] puntos más alto. E′ queda <b>por encima de la curva BP<\/b>: con movilidad perfecta del capital, incluso esta ligera subida de r atrae capital sin límite, y la balanza de pagos pasa a superávit.<\/li>\n<li><b>Euro flexible<\/b>: el superávit aprecia el euro un [[emp:apprPct:2]]%, las exportaciones netas caen [[emp:dGbn:0]] mil millones e IS′ vuelve a IS. La economía regresa a E: el multiplicador fiscal es [[emp:kFlex:0]].<\/li>\n<li><b>Tipo fijo<\/b>, para comparar: el banco central compra las divisas que entran, la cantidad de dinero sube [[emp:dMxBn:0]] mil millones y la LM pasa a LM′, por <b>E″<\/b> sobre la curva BP: Y sube [[emp:dYxBn:0]] mil millones, un multiplicador de 1/σ = [[emp:kFix:2]].<\/li>\n<li>Los modelos del BCE dan [[emp:mult:2]] a dos años, con la política monetaria activa (Boletín Económico 6/2025). La zona del euro es una economía grande: su expansión fiscal también eleva los tipos de interés en el exterior, lo que desplaza la BP hacia arriba y deja en pie parte del estímulo.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Lo que decide: dónde queda E′ respecto a la BP<\/div><div class=\"bb\">[[tab:d_sens]]<p>Por encima de la BP el euro se aprecia y el tipo flexible resta parte del estímulo; por debajo se deprecia y el tipo flexible lo amplía. Con esta perturbación E′ queda por encima de la BP siempre que f supere los [[emp:fEqBn:0]] mil millones de euros por punto.<\/p><\/div><\/div><\/div><\/div>","data":true},{"s":18,"t":{"en":"The Empirical IS–LM–BP: a Monetary Expansion","es":"El IS-LM-BP empírico: una expansión monetaria"},"en":"<div class=\"two wide-l\"><div>[[fig:d_empm]]<p class=\"datasrc\">Sources: the calibration table; Federal Reserve G.5 (EUR/USD).<\/p>[[data:d_empm]]<div class=\"blk\"><div class=\"bt\">The same mechanism in the data<\/div><div class=\"bb\"><p>In 2022 the Fed raised its rate faster than the ECB: r* rose, the BP curve moved up and the euro area was left below it. Capital flowed to dollar assets and the euro fell below one dollar, to 0.9853 in October 2022 (monthly average).<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">A rise of 1% in M1<\/div><div class=\"bb\"><ul>\n<li>The ECB raises M1 by 1%, €[[emp:dMbn:0]] billion: the LM curve shifts right by Δ@o{M}/b = €[[emp:shLMbn:0]] billion, to LM′.<\/li>\n<li>At the new IS–LM crossing, <b>E′<\/b>, r is only [[emp:drm1Abs:2]] points lower and Y €[[emp:dYm1Bn:0]] billion higher, the closed-economy effect. E′ lies <b>below the BP curve<\/b>: with perfect capital mobility even this slight fall in r sends capital out without limit, and the balance of payments moves into deficit.<\/li>\n<li><b>Flexible euro<\/b>: the deficit depreciates the euro by [[emp:dERmPct:2]]%, net exports rise and IS shifts right to IS′, until it meets LM′ on the BP curve at <b>E″<\/b>: Y rises by €[[emp:dYmBn:0]] billion, [[emp:dYmPct:0]]% of GDP and [[emp:mRatio:1]] times the closed-economy effect, and r is back at [[emp:r0:2]]%.<\/li>\n<li><b>Fixed rate<\/b>, for comparison: to stop the depreciation the central bank sells foreign currency, the money supply falls back and LM′ returns to LM: Y stays at E, as in Denmark.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">What decides: how mobile capital is<\/div><div class=\"bb\">[[tab:d_msens]]<p>The more mobile capital is, the smaller the change in r that remains and the larger the change in Y: with a flat BP curve, small changes in rates produce large movements in Y.<\/p><\/div><\/div><\/div><\/div>","es":"<div class=\"two wide-l\"><div>[[fig:d_empm]]<p class=\"datasrc\">Fuentes: la tabla de calibración; Reserva Federal G.5 (EUR/USD).<\/p>[[data:d_empm]]<div class=\"blk\"><div class=\"bt\">El mismo mecanismo en los datos<\/div><div class=\"bb\"><p>En 2022 la Fed subió su tipo más deprisa que el BCE: r* subió, la curva BP se desplazó hacia arriba y la zona del euro quedó por debajo. El capital se dirigió a activos en dólares y el euro cayó por debajo del dólar, hasta 0,9853 en octubre de 2022 (media mensual).<\/p><\/div><\/div><\/div>\n<div><div class=\"blk\"><div class=\"bt\">Un aumento de M1 del 1%<\/div><div class=\"bb\"><ul>\n<li>El BCE aumenta M1 un 1%, [[emp:dMbn:0]] mil millones de euros: la LM se desplaza a la derecha Δ@o{M}/b = [[emp:shLMbn:0]] mil millones, hasta LM′.<\/li>\n<li>En el nuevo corte IS-LM, <b>E′<\/b>, r es solo [[emp:drm1Abs:2]] puntos más bajo e Y [[emp:dYm1Bn:0]] mil millones más alto, el efecto de una economía cerrada. E′ queda <b>por debajo de la curva BP<\/b>: con movilidad perfecta del capital, incluso esta ligera bajada de r provoca salidas de capital sin límite, y la balanza de pagos pasa a déficit.<\/li>\n<li><b>Euro flexible<\/b>: el déficit deprecia el euro un [[emp:dERmPct:2]]%, las exportaciones netas suben y la IS se desplaza a la derecha hasta IS′, hasta cortar a LM′ sobre la curva BP en <b>E″<\/b>: Y sube [[emp:dYmBn:0]] mil millones, un [[emp:dYmPct:0]]% del PIB y [[emp:mRatio:1]] veces el efecto de una economía cerrada, y r vuelve al [[emp:r0:2]]%.<\/li>\n<li><b>Tipo fijo<\/b>, para comparar: para frenar la depreciación el banco central vende divisas, la cantidad de dinero vuelve a bajar y LM′ regresa a LM: Y se queda en E, como en Dinamarca.<\/li><\/ul><\/div><\/div>\n<div class=\"blk\"><div class=\"bt\">Lo que decide: la movilidad del capital<\/div><div class=\"bb\">[[tab:d_msens]]<p>Cuanto más móvil es el capital, menor es el cambio de r que queda y mayor el cambio de Y: con una curva BP horizontal, pequeños cambios en los tipos producen grandes movimientos de Y.<\/p><\/div><\/div><\/div><\/div>","data":true}];

const r1 = v => Math.round(v*10)/10;
const escS = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function tl(s){
  s = String(s); const re = /([_^])(?:\{([^}]*)\}|(.))/g; let out = "", last = 0, pend = 0, m;
  const seg = (t, dy) => dy ? `<tspan dy="${dy}">${escS(t)}</tspan>` : escS(t);
  while ((m = re.exec(s))) {
    if (m.index > last) { out += seg(s.slice(last, m.index), pend); pend = 0; }
    const dy = m[1] === "_" ? 3.5 : -5;
    out += `<tspan dy="${dy + pend}" font-size="72%">${escS(m[2] !== undefined ? m[2] : m[3])}</tspan>`;
    pend = -dy; last = re.lastIndex;
  }
  if (last < s.length) out += seg(s.slice(last), pend);
  return out;
}
function ah(x, y, ux, uy, c, sz){
  sz = sz || 7; const n = Math.hypot(ux, uy) || 1; ux /= n; uy /= n;
  const bx = x - ux*sz, by = y - uy*sz, px = -uy*sz*.42, py = ux*sz*.42;
  return `<polygon points="${r1(x)},${r1(y)} ${r1(bx+px)},${r1(by+py)} ${r1(bx-px)},${r1(by-py)}" fill="${c}"/>`;
}

    ln(x1, y1, x2, y2, c, q){ q = q || {};

  const d = tsData(svg), m = svg.getScreenCTM && svg.getScreenCTM(); if (!d || !m) return;

  if (pt.x < d.px0 - 2 || pt.x > d.px1 + 2 || pt.y < d.py0 - 4 || pt.y > d.py1 + 4) { tsHide(); return; }
  let t = d.x0 + (pt.x - d.px0) / (d.px1 - d.px0) * (d.x1 - d.x0);

  t = Math.max(d.x0, Math.min(d.x1, t));

    if (se.st) q = stepAt(se.p, t);
    else { const tol = d.f === "y" ? 0.5 : 0.5 / 12; for (const r of se.p) if (Math.abs(r[0] - t) <= tol + 1e-6) { q = r; break; } }
    const dot = svg.querySelector(".fd" + k);

    const P = d.P[se.pi], yy = P.top + (P.y1 - q[1]) / (P.y1 - P.y0) * (P.bot - P.top);

/* saved progress */
function validSaved(s){
  if (!s || typeof s !== "object") return false;
  if (!["en","es"].includes(s.lang) || !["slides","quiz"].includes(s.view) || !["folder","built"].includes(s.figMode)) return false;
  if (!Number.isInteger(s.slideIndex) || s.slideIndex < 0 || s.slideIndex >= SLIDES.length) return false;
  if (!["setup","active","graded"].includes(s.phase) || !["exam","practice"].includes(s.mode) || typeof s.name !== "string") return false;
  const ok = a => Array.isArray(a) && a.every(id => byId.has(id)) && new Set(a).size === a.length;
  if (!ok(s.pool) || !ok(s.order) || s.pool.length === 0) return false;
  if (s.phase !== "setup" && (s.order.length === 0 || !Number.isInteger(s.current) || s.current < 0 || s.current >= s.order.length)) return false;
  if (!s.answers || typeof s.answers !== "object" || !s.checked || typeof s.checked !== "object") return false;
  for (const k in s.answers) { const q = byId.get(Number(k)), a = s.answers[k]; if (!q || !Number.isInteger(a) || a < 0 || a >= q.en.options.length) return false; }
  return true;
}

function slideLinks(q){ if (!q.slides || !q.slides.length) return ""; return `<p class="rel">${t("related")} ${q.slides.map(n => `<button class="link" data-action="goto-slide" data-slide="${n - 1}">${fill(t("slideN"), {n})}</button>`).join(" ")}</p>`; }
function setupHtml(){
  const n = state.pool.length;
  const partial = n < QUESTIONS.length ? `<p class="assume">${fill(t("partial"), {n})} <button class="link" data-action="use-all">${t("useAll")}</button></p>` : "";
  return `<section class="quiz"><div class="card setup"><div class="title-top"><h2>${t("assessment")}</h2></div><p>${t("subtitle")}</p><ul class="facts"><li class="fact">${fill(t("factQ"), {n})}</li><li class="fact">${fill(t("factT"), {n:TOPICS.length})}</li><li class="fact">${t("factG")}</li></ul>${partial}<label class="field" for="student-name">${t("name")}</label><input id="student-name" type="text" autocomplete="name" maxlength="80" value="${esc(state.name)}"><fieldset class="modes"><legend>${t("modeLegend")}</legend><label><input type="radio" name="mode" value="exam"${state.mode === "exam" ? " checked" : ""}><span><b>${t("modeExam")}</b> ${t("modeExamD")}</span></label><label><input type="radio" name="mode" value="practice"${state.mode === "practice" ? " checked" : ""}><span><b>${t("modePractice")}</b> ${t("modePracticeD")}</span></label></fieldset><button class="btn" data-action="start">${t("start")}</button><p class="note">${t("hypothetical")}</p></div></section>`;
}
function feedbackHtml(q, ans){ const ok = ans === q.correct; return `<div id="feedback" class="feedback ${ok ? "ok" : "bad"}" role="status"><h3>${ok ? t("fbOk") : t("fbBad")}</h3><p>${t("correctAnswer")}: <b>${LETTERS[q.correct]}</b></p>${stepsHtml(q, state.lang)}${slideLinks(q)}</div>`; }
function activeHtml(){
  const n = state.order.length, i = state.current, id = state.order[i], q = byId.get(id), d = q[state.lang];
  const ans = state.answers[id], chk = state.mode === "practice" && !!state.checked[id];
  const opts = d.options.map((o, k) => { let c = "option"; if (ans === k) c += " sel"; if (chk) { if (k === q.correct) c += " correct"; else if (ans === k) c += " wrong"; }
    return `<label class="${c}"><input type="radio" name="response" value="${k}"${ans === k ? " checked" : ""}${chk ? " disabled" : ""}><span class="letter">${LETTERS[k]}</span><span class="otext">${o}</span></label>`; }).join("");
  const checkBtn = state.mode === "practice" && !chk ? `<button class="btn amb" id="check-button" data-action="check"${ans === undefined ? " disabled" : ""}>${t("check")}</button>` : "";
  const foot = `<div class="question-foot"><button class="btn sec" data-action="prev"${i === 0 ? " disabled" : ""}>${t("prevQ")}</button>${i === n - 1 ? `<button class="btn" data-action="submit">${t("submit")}</button>` : `<button class="btn sec" data-action="next">${t("nextQ")}</button>`}</div>`;
  const nav = state.order.map((qid, k) => { let c = "nav-q"; if (k === i) c += " current"; if (state.answers[qid] !== undefined) c += " answered"; if (state.mode === "practice" && state.checked[qid]) c += state.answers[qid] === byId.get(qid).correct ? " ok" : " bad";
    return `<button class="${c}" data-index="${k}" aria-label="${esc(fill(t("goQ"), {n:k + 1}))}"${k === i ? ' aria-current="true"' : ""}>${k + 1}</button>`; }).join("");
  const done = answeredCount();
  const confirm = state.confirm ? `<div class="confirm" role="alert"><p>${fill(t("unanswered"), {n:n - done})}</p><button class="btn" data-action="submit-yes">${t("submitAnyway")}</button><button class="btn sec" data-action="submit-no">${t("keepAnswering")}</button></div>` : "";
  return `<section class="quiz"><div class="score"><span>${fill(t("answered"), {k:done, n})}</span><span>${state.mode === "exam" ? t("labelExam") : t("labelPractice")}</span><button class="btn amb" data-action="submit">${t("submit")}</button></div>${confirm}<div class="quiz-grid"><article class="question-card card" data-qid="${id}"><div class="q-meta"><span>${fill(t("qOf"), {n:i + 1, m:n})}</span><span class="topic">${esc(topicName(q.topic))}</span></div><h2 id="question-title" class="stem" tabindex="-1">${d.stem}</h2><div class="options" role="radiogroup" aria-labelledby="question-title">${opts}</div>${checkBtn}${chk ? feedbackHtml(q, ans) : ""}${foot}</article><aside class="navigator card"><h3>${t("navTitle")}</h3><div class="nav-grid">${nav}</div><p class="note">${t("navHint")}</p></aside></div></section>`;
}
function gradeStats(){
  const per = {}; TOPICS.forEach(tp => { per[tp.id] = {ok:0, n:0}; }); let ok = 0;
  state.order.forEach(id => { const q = byId.get(id); per[q.topic].n++; if (state.answers[id] === q.correct) { ok++; per[q.topic].ok++; } });
  return {ok, n:state.order.length, per, mark:state.order.length ? 10 * ok / state.order.length : 0};
}
function keyHtml(){
  const ids = QUESTIONS.map(q => q.id), cols = 4, per = Math.ceil(ids.length / cols); let out = "";
  for (let c = 0; c < cols; c++) { const part = ids.slice(c * per, (c + 1) * per); if (!part.length) continue;
    out += `<table class="key"><tr><th>${t("qAbbr")}</th><th>${t("keyCol")}</th><th>${t("youCol")}</th></tr>${part.map(id => { const q = byId.get(id), a = state.order.includes(id) ? state.answers[id] : undefined; return `<tr><td>${id}</td><td>${LETTERS[q.correct]}</td><td class="${a === undefined ? "" : a === q.correct ? "okc" : "badc"}">${a === undefined ? "—" : LETTERS[a]}</td></tr>`; }).join("")}</table>`; }
  return `<div class="keybox"><h3>${t("keyTitle")}</h3><div class="keywrap">${out}</div></div>`;
}
function reviewHtml(id, k){
  const q = byId.get(id), d = q[state.lang], a = state.answers[id], ok = a === q.correct, st = a === undefined ? "blank" : ok ? "ok" : "bad";
  const opts = d.options.map((o, j) => `<div class="option static${j === q.correct ? " correct" : ""}${a === j && !ok ? " wrong" : ""}"><span class="letter">${LETTERS[j]}</span><span class="otext">${o}</span></div>`).join("");
  return `<article class="q review ${st}"><div class="q-meta"><span>${fill(t("qNum"), {n:k + 1})}</span><span class="topic">${esc(topicName(q.topic))}</span><span class="verdict">${a === undefined ? t("vBlank") : ok ? t("vOk") : t("vBad")}</span></div><div class="stem">${d.stem}</div>${opts}<p class="ans">${t("yourAnswer")}: <b>${a === undefined ? "—" : LETTERS[a]}</b> &nbsp; ${t("correctAnswer")}: <b>${LETTERS[q.correct]}</b></p>${stepsHtml(q, state.lang)}${slideLinks(q)}</article>`;
}
function gradedHtml(){
  const g = gradeStats(), L = state.lang;
  const stats = TOPICS.filter(tp => g.per[tp.id].n > 0).map(tp => { const p = g.per[tp.id]; return `<div class="topic-stat"><div class="topic-stat-head"><span>${esc(tp[L])}</span><span>${p.ok}/${p.n}</span></div><div class="tbar"><div style="width:${(100 * p.ok / p.n).toFixed(0)}%"></div></div></div>`; }).join("");
  const missed = g.n - g.ok;
  return `<section class="quiz"><div class="gradebox"><h2>${t("gradeTitle")}</h2><div class="big-grade">${num(g.mark, 2)} <small>/ 10</small></div><p>${fill(t("outOf"), {k:g.ok, n:g.n})}${state.name.trim() ? ` · ${esc(state.name.trim())}` : ""} · ${state.mode === "exam" ? t("labelExam") : t("labelPractice")}${state.finished ? ` · ${esc(dateStr(state.finished))}` : ""}</p><div class="topic-stats">${stats}</div><div class="actions"><button class="btn" data-action="download">${t("download")}</button><button class="btn sec" data-action="retry-all">${t("retryAll")}</button><button class="btn sec" data-action="retry-missed"${missed ? "" : " disabled"}>${t("retryMissed")}</button><button class="btn amb" data-action="toggle-key">${state.keyOpen ? t("keyHide") : t("keyShow")}</button></div>${state.keyOpen ? keyHtml() : ""}</div><h2 class="review-title">${t("reviewTitle")}</h2>${state.order.map((id, k) => reviewHtml(id, k)).join("")}</section>`;
}
function reportHtml(){
  const g = gradeStats(), L = state.lang;
  const rows = state.order.map((id, k) => { const q = byId.get(id), d = q[L], a = state.answers[id], ok = a === q.correct;
    return `<div class="report-question ${a === undefined ? "blank" : ok ? "ok" : "bad"}"><p class="rq"><b>${k + 1}.</b> ${d.stem}</p><ol type="A">${d.options.map((o, j) => `<li${j === q.correct ? ' class="c"' : ""}>${o}</li>`).join("")}</ol><p><b>${t("yourAnswer")}:</b> ${a === undefined ? "—" : LETTERS[a]} &nbsp; <b>${t("correctAnswer")}:</b> ${LETTERS[q.correct]} &nbsp; <b class="v">${a === undefined ? t("vBlank") : ok ? t("vOk") : t("vBad")}</b></p><p class="sh">${t("solution")}</p><ol>${d.steps.map(s => `<li>${s}</li>`).join("")}</ol></div>`; }).join("");
  const topics = TOPICS.filter(tp => g.per[tp.id].n).map(tp => `<tr><td>${esc(tp[L])}</td><td>${g.per[tp.id].ok} / ${g.per[tp.id].n}</td></tr>`).join("");
  const css = "body{font-family:Georgia,'Times New Roman',serif;color:#222;max-width:900px;margin:24px auto;padding:0 16px;line-height:1.45}h1{font-size:1.4rem;color:#58595B;border-bottom:6px solid #F9B233;padding-bottom:8px}h2{font-size:1.1rem;color:#C1182C;margin-top:24px}.sub{color:#666}table{border-collapse:collapse;margin:8px 0}td,th{border-bottom:1px solid #ddd;padding:4px 14px 4px 0;text-align:left}.big{font-size:1.6rem;color:#C1182C;font-weight:bold}.report-question{border-left:6px solid #58595B;padding:6px 14px;margin:14px 0;page-break-inside:avoid}.report-question.ok{border-left-color:#2e7d32}.report-question.bad{border-left-color:#c62828}.report-question.ok .v{color:#2e7d32}.report-question.bad .v{color:#c62828}li.c{font-weight:bold;color:#2e7d32}.sh{font-weight:bold;color:#58595B;margin-bottom:2px}.foot{color:#777;font-size:.85rem;margin-top:28px}.ob{text-decoration:overline}";
  return `<!DOCTYPE html><html lang="${L}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(t("reportTitle"))}</title><style>${css}</style></head><body><h1>${esc(t("reportTitle"))}</h1><p class="sub">${esc(t("course"))} · ${esc(t("chapter"))}</p><table><tr><td>${t("rName")}</td><td>${esc(state.name.trim()) || "—"}</td></tr><tr><td>${t("rDate")}</td><td>${esc(dateStr(state.finished || Date.now()))}</td></tr><tr><td>${t("rMode")}</td><td>${state.mode === "exam" ? t("labelExam") : t("labelPractice")}</td></tr><tr><td>${t("rResult")}</td><td>${fill(t("outOf"), {k:g.ok, n:g.n})}</td></tr><tr><td>${t("rMark")}</td><td class="big">${num(g.mark, 2)}</td></tr></table><h2>${t("byTopic")}</h2><table>${topics}</table><h2>${t("reviewTitle")}</h2>${rows}<p class="foot">${esc(t("reportFoot"))}</p></body></html>`;
}
function download(){
  const blob = new Blob([reportHtml()], {type:"text/html;charset=utf-8"}), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = t("reportFile") + "_" + new Date().toISOString().slice(0, 10) + ".html";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* rendering and actions */
function render(){
  renderHeader();
  if (state.view === "slides") { main.innerHTML = slideHtml(); return; }
  if (!validData) { main.innerHTML = `<div class="card empty-state">${t("loadingError")}</div>`; return; }
  main.innerHTML = state.phase === "setup" ? setupHtml() : state.phase === "active" ? activeHtml() : gradedHtml();
}
function commit(){ save(); render(); }
function grabName(){ const el = $("#student-name"); if (el) state.name = el.value.slice(0, 80); }
function focusQ(){ const h = $("#question-title"); if (h) h.focus({preventScroll:true}); scrollIfNeeded(); }
function startAttempt(){
  grabName(); const m = $('input[name="mode"]:checked'); if (m) state.mode = m.value;
  Object.assign(state, {order:shuffle(state.pool), answers:{}, checked:{}, current:0, phase:"active", started:Date.now(), finished:null, confirm:false, keyOpen:false});
  commit(); focusQ();
}
function grade(){ Object.assign(state, {phase:"graded", finished:Date.now(), confirm:false, keyOpen:false}); commit(); window.scrollTo(0, 0); main.focus({preventScroll:true}); }
function newSetup(pool){
  const keep = {lang:state.lang, slideIndex:state.slideIndex, figMode:state.figMode, name:state.name, mode:state.mode};
  state = Object.assign(blankState(), keep, {view:"quiz", pool}); commit(); window.scrollTo(0, 0); main.focus({preventScroll:true});
}
function act(b){
  const id = b.id, a = b.dataset.action;
  if (id === "tab-slides" || id === "tab-quiz") { grabName(); state.view = id === "tab-slides" ? "slides" : "quiz"; commit(); main.focus({preventScroll:true}); return; }
  if (id === "lang-en" || id === "lang-es") { grabName(); state.lang = id === "lang-en" ? "en" : "es"; commit(); return; }
  if (b.classList.contains("nav-q")) { state.current = Number(b.dataset.index); state.confirm = false; commit(); focusQ(); return; }
  if (a === "slide-prev") go(-1);
  else if (a === "slide-next") go(1);
  else if (a === "fig-folder" || a === "fig-built") { state.figMode = a === "fig-folder" ? "folder" : "built"; commit(); }
  else if (a === "start") startAttempt();
  else if (a === "use-all") { grabName(); state.pool = QUESTIONS.map(q => q.id); commit(); }
  else if (a === "prev" || a === "next") { const j = state.current + (a === "next" ? 1 : -1); if (j >= 0 && j < state.order.length) { state.current = j; state.confirm = false; commit(); focusQ(); } }
  else if (a === "check") { const qid = state.order[state.current]; if (state.answers[qid] !== undefined) { state.checked[qid] = true; commit(); const f = $("#feedback"); if (f && f.scrollIntoView) f.scrollIntoView({block:"nearest"}); } }
  else if (a === "submit") { if (answeredCount() < state.order.length) { state.confirm = true; commit(); window.scrollTo(0, 0); } else grade(); }
  else if (a === "submit-yes") grade();
  else if (a === "submit-no") { state.confirm = false; commit(); }
  else if (a === "download") download();
  else if (a === "retry-all") newSetup(QUESTIONS.map(q => q.id));
  else if (a === "retry-missed") { const miss = state.order.filter(qid => state.answers[qid] !== byId.get(qid).correct); if (miss.length) newSetup(miss); }
  else if (a === "toggle-key") { state.keyOpen = !state.keyOpen; commit(); }
  else if (a === "goto-slide") { state.view = "slides"; state.slideIndex = Math.max(0, Math.min(SLIDES.length - 1, Number(b.dataset.slide))); commit(); window.scrollTo(0, 0); main.focus({preventScroll:true}); }
}
document.addEventListener("click", e => {
  const el = e.target;
  if (dlg.contains(el)) { if (el === dlg || el.closest("#graph-close")) closeFig(); return; }
  const b = el.closest("button");
  if (b) { act(b); return; }
  const fg = el.closest("figure.fig");
  if (fg && main.contains(fg)) openFig(fg);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "slide-select") { state.slideIndex = Number(el.value); commit(); const s = $("#slide-select"); if (s) s.focus(); }
  else if (el.name === "mode") { state.mode = el.value; save(); }
  else if (el.name === "response") { const qid = state.order[state.current]; if (state.mode === "practice" && state.checked[qid]) return; state.answers[qid] = Number(el.value); state.confirm = false; commit(); const inp = $(`input[name="response"][value="${el.value}"]`); if (inp) inp.focus({preventScroll:true}); }
});
document.addEventListener("input", e => { if (e.target.id === "student-name") { state.name = e.target.value.slice(0, 80); save(); } });
document.addEventListener("keydown", e => {
  const el = e.target, fg = el.closest ? el.closest("figure.fig") : null;
  if (fg && main.contains(fg) && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openFig(fg); return; }
  if (state.view !== "slides" || dlg.open || e.altKey || e.ctrlKey || e.metaKey) return;
  if (/^(INPUT|SELECT|TEXTAREA|SUMMARY)$/.test(el.tagName)) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
});
let touch = null;
main.addEventListener("touchstart", e => { if (state.view !== "slides") return; const p = e.changedTouches[0]; touch = {x:p.clientX, y:p.clientY}; }, {passive:true});
main.addEventListener("touchend", e => { if (!touch || state.view !== "slides") return; const p = e.changedTouches[0], dx = p.clientX - touch.x, dy = p.clientY - touch.y; touch = null; if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) go(dx < 0 ? 1 : -1); }, {passive:true});
main.addEventListener("error", e => { const im = e.target; if (im && im.tagName === "IMG" && im.dataset.fig && FIGS[im.dataset.fig]) { FIGS[im.dataset.fig].failed = true; if (state.view === "slides") render(); } }, true);

load();
render();
(function probe(){ const im = new Image(); im.onload = () => { folderOK = true; if (state.view === "slides") render(); }; im.onerror = () => { folderOK = false; }; im.src = G + "Money_Markets_Equilibrium.png"; })();
</script>
